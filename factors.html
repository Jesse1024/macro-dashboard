const ACCENT = '#3ec6e0', GRID = '#1a2636', MUTED = '#6b7f96';

// 六大因子元信息（顺序即展示顺序）：因子名 / 简称 / 折线色 / 编制基日
const FACTOR_META = [
  { code: '000922', factor: '红利', label: '中证红利',       color: '#3ec6e0', base: '2004-12-31' },
  { code: '930860', factor: '质量', label: '中证盈利质量',   color: '#f0a43a', base: '2005-06-30' },
  { code: '000057', factor: '成长', label: '全指成长',       color: '#f0453a', base: '2003-12-31' },
  { code: '000058', factor: '价值', label: '全指价值',       color: '#b78bf0', base: '2003-12-31' },
  { code: '930846', factor: '低波', label: '300低波',        color: '#2ebd6b', base: '2004-12-31' },
  { code: 'H50057', factor: '动量', label: '180动量',        color: '#e6d24a', base: '2004-12-31' },
];

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmt(v, d){ return (v === null || v === undefined) ? '—' : Number(v).toLocaleString('zh-CN', {maximumFractionDigits: d || 0}); }

// 按 code 建数据索引
function buildIndex(){
  const map = {};
  (DATA.indices || []).forEach(it => { map[it.code] = it; });
  return map;
}

function renderChart(map){
  const el = document.getElementById('factorChart');
  const series = [];
  FACTOR_META.forEach(meta => {
    const it = map[meta.code];
    if (!it) return;
    series.push({
      name: meta.label,
      type: 'line',
      data: it.series,
      showSymbol: false,
      smooth: false,
      lineStyle: { width: 1.6, color: meta.color },
      itemStyle: { color: meta.color },
      emphasis: { focus: 'series' },
    });
  });
  if (!series.length) return;

  // 基准线只挂在第一条上
  series[0].markLine = {
    silent: true, symbol: 'none',
    lineStyle: { color: '#6b7f96', type: 'dashed', width: 1 },
    label: { formatter: '基准 100', color: '#6b7f96', fontSize: 10, position: 'end' },
    data: [{ yAxis: 100 }],
  };

  const chart = echarts.init(el);
  chart.setOption({
    backgroundColor: 'transparent',
    legend: {
      top: 0, textStyle: { color: MUTED, fontSize: 11, fontFamily: 'JetBrains Mono, Consolas, monospace' },
      itemWidth: 16, itemHeight: 2, icon: 'roundRect',
    },
    tooltip: {
      trigger: 'axis',
      backgroundColor: '#0c1420', borderColor: GRID,
      textStyle: { color: '#dce8f4', fontSize: 12 },
      axisPointer: { type: 'line', lineStyle: { color: ACCENT, opacity: .35 } },
      valueFormatter: v => (v === null || v === undefined) ? '—' : Number(v).toFixed(2),
    },
    grid: { left: 52, right: 22, top: 44, bottom: 62 },
    xAxis: {
      type: 'time',
      axisLine: { lineStyle: { color: GRID } },
      axisLabel: { color: MUTED, fontSize: 10, hideOverlap: true },
      splitLine: { show: false },
    },
    yAxis: {
      type: 'value', min: 60,
      axisLine: { show: false }, axisTick: { show: false },
      axisLabel: { color: MUTED, fontSize: 10 },
      splitLine: { lineStyle: { color: GRID } },
    },
    dataZoom: [
      { type: 'inside', start: 0, end: 100 },
      { type: 'slider', start: 0, end: 100, height: 18, bottom: 8,
        borderColor: GRID, backgroundColor: '#091019', fillerColor: 'rgba(62,198,224,.12)',
        textStyle: { color: MUTED, fontSize: 10 }, handleStyle: { color: '#2a3f58' } },
    ],
    series: series,
  });
  window.addEventListener('resize', () => chart.resize());
}

function renderGrid(map){
  let html = '';
  FACTOR_META.forEach(meta => {
    const it = map[meta.code];
    if (!it) return;
    const pct = it.one_year_pct;
    const chgCls = pct === null ? 'flat' : (pct >= 0 ? 'up' : 'down');
    const chgTxt = pct === null ? '—' : (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%';
    html += '<div class="card factor-card">' +
      '<div class="card-head">' +
        '<span class="name"><span class="f-dot" style="background:' + meta.color + '"></span>' + esc(meta.factor) + ' · ' + esc(meta.label) + '</span>' +
        '<span class="freq">' + esc(meta.code) + '</span>' +
      '</div>' +
      '<div class="card-value"><span class="num">' + fmt(it.latest_value, 2) + '</span><span class="unit">归一化值</span></div>' +
      '<div class="card-meta">' +
        '<span class="date">' + esc(it.latest_date) + '</span>' +
        '<span class="chg ' + chgCls + '">近1年 ' + chgTxt + '</span>' +
      '</div>' +
      '<div class="card-note">点位 ' + fmt(it.latest_close, 2) + ' · 基日 ' + esc(meta.base) + '</div>' +
    '</div>';
  });
  document.getElementById('factorGrid').innerHTML = html;
}

function render(){
  document.getElementById('updatedAt').textContent = DATA.updated_at || '—';
  document.getElementById('chartNote').textContent =
    '归一化指数值（' + (DATA.base_date || '2011-01-04') + ' = 100）· 价格版（不含分红再投）· 线性坐标 · 拖动底部滑条缩放';
  const map = buildIndex();
  renderChart(map);
  renderGrid(map);
}

render();
</script>
<script>
/* 数字雨背景（科技感氛围）—— 稀疏慢速 */
(function () {
  var canvas = document.getElementById('bg-rain');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var fs = 18, gap = 2, cols = 0, drops = [], speed = 0.35;
  var chars = '0123456789ABCDEF';
  function resize() {
    var isMobile = window.matchMedia('(max-width: 768px)').matches;
    fs = isMobile ? 24 : 18;
    speed = isMobile ? 0.15 : 0.35;
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    cols = Math.floor(canvas.width / (fs * gap));
    drops = [];
    for (var i = 0; i < cols; i++) drops.push(Math.random() * -canvas.height / fs);
  }
  resize();
  window.addEventListener('resize', resize);
  function draw() {
    ctx.fillStyle = 'rgba(6, 11, 19, 0.07)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = fs + 'px "JetBrains Mono", "SF Mono", Consolas, monospace';
    for (var i = 0; i < cols; i++) {
      var y = drops[i] * fs;
      if (y > canvas.height && Math.random() > 0.98) drops[i] = 0;
      ctx.fillStyle = 'rgba(62, 198, 224, 0.42)';
      ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fs * gap, y);
      drops[i] += speed;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>债市分析框架 · 国债收益率曲线</title>
<script src="echarts.min.js"></script>
<style>
:root {
  --bg: #070b11;
  --card: #0c1420;
  --border: #1a2634;
  --text: #dce8f4;
  --muted: #7d90a4;
  --faint: #4d6070;
  --accent: #3ea6e0;
  --up: #f0453a;
  --down: #2ebd6b;
  --mono: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0; padding: 28px 20px 60px;
  background: var(--bg); color: var(--text);
  font-family: var(--sans); line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 1180px; margin: 0 auto; }

header { margin-bottom: 26px; }
.kicker {
  font: 11px/1.4 var(--mono); letter-spacing: 2.5px;
  color: var(--faint); text-transform: uppercase; margin-bottom: 9px;
}
h1 {
  margin: 0 0 8px; font-size: 30px; font-weight: 600;
  letter-spacing: -.4px;
}
h1 .part { color: var(--accent); }
.sub { color: var(--muted); font-size: 13px; font-family: var(--mono); }

/* 全站导航（与 macro-dashboard 其他页面保持一致） */
.navbar {
  display: flex; align-items: center; gap: 9px;
  flex-wrap: wrap; margin: 20px 0 24px;
}
.navbar a {
  color: var(--muted); text-decoration: none;
  font: 12px/1 var(--mono); letter-spacing: .5px;
  padding: 6px 12px; border: 1px solid var(--border); border-radius: 6px;
  transition: border-color .2s, color .2s;
}
.navbar a:hover { color: var(--accent); border-color: #2a3d52; }
.navbar a.active { color: var(--accent); border-color: rgba(62,166,224,.45); }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 18px 20px; margin-bottom: 16px;
}

.summary {
  font-size: 14.5px; line-height: 2.0; color: #c8d8e8;
  letter-spacing: .2px;
}
.summary b { color: var(--text); font-weight: 600; }
.summary .k10 { color: #e8d24a; font-weight: 600; }
.summary .up { color: var(--up); }
.summary .down { color: var(--down); }
.summary .flat { color: var(--muted); }
.summary .shape {
  display: block; margin-top: 10px; padding-top: 10px;
  border-top: 1px dashed var(--border); color: var(--muted); font-size: 13px;
}

.chart-bar {
  display: flex; align-items: baseline; justify-content: space-between;
  flex-wrap: wrap; gap: 8px; margin-bottom: 4px;
}
.chart-title { font-size: 14px; font-weight: 600; color: var(--text); }
.chart-legend { font: 11.5px/1.6 var(--mono); color: var(--muted); }
.chart-legend span { display: inline-block; white-space: nowrap; }
.chart-legend i {
  display: inline-block; width: 14px; height: 2px;
  vertical-align: middle; margin: 0 5px 0 10px;
}
#yieldCurve { width: 100%; height: 480px; }
#tlChart, #cdChart { width: 100%; height: 300px; }

/* 板块标题 */
.region-title {
  display: flex; align-items: center; gap: 11px;
  margin: 36px 0 14px; padding-bottom: 2px;
}
.region-title .bar {
  width: 3px; height: 19px; background: var(--accent); border-radius: 2px;
  flex: 0 0 auto;
}
.region-title h2 { margin: 0; font-size: 17.5px; font-weight: 600; letter-spacing: -.2px; }
.region-title .en {
  color: var(--faint); font: 10px/1 var(--mono);
  letter-spacing: 1.6px; margin-left: 2px;
}

/* 统计表 */
.stat-table { margin-top: 14px; border-top: 1px solid var(--border); padding-top: 8px; }
.stat-table table { font-size: 12.5px; }
.stat-table td { padding: 7px 10px; border-bottom: 1px solid #111a24; }
.stat-table td:first-child { color: var(--muted); text-align: left; width: 46%; }
.stat-table td:last-child { text-align: right; font-weight: 600; }

table { width: 100%; border-collapse: collapse; font: 12.5px/1.6 var(--mono); }
th {
  color: var(--muted); font-weight: 500; font-size: 11.5px;
  padding: 8px 10px; border-bottom: 1px solid var(--border);
  text-align: right; background: #091019;
}
th:first-child { text-align: left; }
td {
  padding: 7px 10px; border-bottom: 1px solid #111a24;
  text-align: right; color: var(--text);
}
td:first-child { text-align: left; color: var(--muted); }
tr.key td { background: #0f1a27; }
tr.key td:first-child { color: #e8d24a; font-weight: 600; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--muted); }

.note {
  color: var(--faint); font-size: 11.5px; line-height: 1.9;
  margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border);
}
.note b { color: var(--muted); font-weight: 500; }

@media (max-width: 768px) {
  body { padding: 18px 12px 40px; }
  h1 { font-size: 23px; }
  .card { padding: 14px 14px; border-radius: 8px; }
  .summary { font-size: 13.5px; line-height: 1.95; }
  #yieldCurve { height: 380px; }
  table { font-size: 11px; }
  th, td { padding: 6px 5px; }
  .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
}
</style>
</head>

const GRID = '#1a2634', MUTED = '#7d90a4';

function fmtBp(v) {
  if (v === null || v === undefined) return '—';
  const a = Math.abs(v);
  if (a < 0.005) return '持平';
  const s = a < 1 ? a.toFixed(2) : a.toFixed(1);
  return (v > 0 ? '+' : '−') + s + 'bp';
}
function cls(v) {
  if (v === null || v === undefined || Math.abs(v) < 0.005) return 'flat';
  return v > 0 ? 'up' : 'down';
}
function termLabel(t) {
  return (t === Math.floor(t) ? Math.floor(t) : t) + 'Y';
}
// 文字总结里用「30年」，图表轴和表格用「30Y」
function termYears(t) {
  return (t === Math.floor(t) ? Math.floor(t) : t) + '年';
}

// ---- 文字总结（研报体例）----
function buildSummary() {
  const parts = DATA.rows.map(r => {
    const flat = Math.abs(r.chg) < 0.005;
    const dir = flat ? '持平在' : (r.chg > 0 ? '上行' : '下行');
    const val = '<b>' + r.y.toFixed(4) + '%</b>';
    const name = termYears(r.t) + '国债';
    if (flat) return name + '与前一交易日' + dir + val;
    const move = Math.abs(r.chg).toFixed(Math.abs(r.chg) < 1 ? 2 : 1) + 'bp至';
    return name + dir + move + val;
  });
  return '中债估值曲线方面，' + parts.join('，') + '。' +
         '<span class="shape">' + DATA.shape.text + '</span>';
}

// 曲线形态判断在 Python 端 build_shape_text() 里算好，随 DATA.shape.text 一起注入，
// 这里不再重复实现，避免两端逻辑分叉。

// ---- 表格 ----
function buildTable() {
  const tb = document.getElementById('tbody');
  const all = DATA.all.map(t => ({t}));
  tb.innerHTML = all.map(({t}) => {
    const cur = DATA.latestCurve[String(t)], prv = DATA.prevCurve[String(t)];
    const chg = DATA.chgMap[String(t)];
    const key = (t === 10.0 || t === 30.0) ? ' class="key"' : '';
    return '<tr' + key + '><td>' + termLabel(t) + '</td><td>' +
      (cur !== undefined ? cur.toFixed(4) + '%' : '—') + '</td><td class="' +
      cls(chg) + '">' + fmtBp(chg) + '</td><td>' +
      (prv !== undefined ? prv.toFixed(4) + '%' : '—') + '</td></tr>';
  }).join('');
}

// ---- 图表：上方收益率曲线，下方同 X 轴的变动柱 ----
// 两天的曲线差异通常不到 1bp，在 1%~2.2% 的 Y 轴量程上会完全重合，
// 单看曲线看不出任何变化。加一根变动柱才能看清各期限到底调了多少。
function buildChart() {
  const el = document.getElementById('yieldCurve');
  const chart = echarts.init(el);
  const cats = DATA.all.map(termLabel);
  const cur = DATA.all.map(t => DATA.latestCurve[String(t)]);
  const prv = DATA.all.map(t => DATA.prevCurve[String(t)]);
  const chg = DATA.all.map(t => DATA.chgMap[String(t)] ?? 0);

  function option(mobile) {
    const L = mobile ? 44 : 58, R = mobile ? 12 : 26;
    return {
      backgroundColor: 'transparent',
      axisPointer: { link: [{ xAxisIndex: 'all' }] },
      grid: [
        { left: L, right: R, top: 20, height: mobile ? '46%' : '50%' },
        { left: L, right: R, top: mobile ? '66%' : '68%', height: '18%' }
      ],
      tooltip: {
        trigger: 'axis',
        backgroundColor: '#0c1420', borderColor: GRID,
        textStyle: { color: '#dce8f4', fontSize: 12 },
        formatter: p => {
          const i = p[0].dataIndex, t = DATA.all[i];
          const c = DATA.latestCurve[String(t)], q = DATA.prevCurve[String(t)];
          return termLabel(t) + '<br/>' +
            DATA.latest + '　' + c.toFixed(4) + '%' +
            '<br/>' + DATA.prev + '　' + q.toFixed(4) + '%' +
            '<br/>变动　' + fmtBp(DATA.chgMap[String(t)]);
        }
      },
      xAxis: [
        { type: 'category', data: cats, boundaryGap: false, gridIndex: 0,
          axisLine: { lineStyle: { color: GRID } },
          axisLabel: { show: false }, axisTick: { show: false } },
        { type: 'category', data: cats, gridIndex: 1,
          axisLine: { lineStyle: { color: GRID } },
          axisLabel: { color: MUTED, fontSize: mobile ? 9 : 11 },
          axisTick: { show: false } }
      ],
      yAxis: [
        { type: 'value', scale: true, gridIndex: 0,
          axisLine: { show: false }, axisTick: { show: false },
          splitLine: { lineStyle: { color: GRID } },
          axisLabel: { color: MUTED, fontSize: mobile ? 10 : 11,
                       formatter: v => v.toFixed(2) + '%' } },
        { type: 'value', gridIndex: 1,
          name: 'bp', nameTextStyle: { color: MUTED, fontSize: 10 },
          axisLine: { show: false }, axisTick: { show: false },
          splitLine: { show: false },
          axisLabel: { color: MUTED, fontSize: 9,
                       formatter: v => (Math.abs(v) < 0.05 ? '0' : v.toFixed(1)) } }
      ],
      series: [
        { name: '前一交易日', type: 'line', data: prv, showSymbol: false,
          xAxisIndex: 0, yAxisIndex: 0, z: 1,
          lineStyle: { color: '#5a6b7d', width: 1.4, type: 'dashed' },
          itemStyle: { color: '#5a6b7d' } },
        { name: '最新交易日', type: 'line', data: cur,
          symbol: 'circle', symbolSize: 6,
          xAxisIndex: 0, yAxisIndex: 0, z: 2,
          lineStyle: { color: '#3ea6e0', width: 2.4 },
          itemStyle: { color: '#3ea6e0' },
          areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
            { offset: 0, color: 'rgba(62,166,224,.16)' },
            { offset: 1, color: 'rgba(62,166,224,0)' }]) } },
        { name: '变动(bp)', type: 'bar',
          data: chg.map(v => ({
            value: v,
            itemStyle: {
              color: v > 0.004 ? '#f0453a' : (v < -0.004 ? '#2ebd6b' : '#4d6070'),
              borderRadius: 2
            }
          })),
          xAxisIndex: 1, yAxisIndex: 1, barWidth: '52%',
          label: { show: !mobile, position: 'top', color: '#8da2b8', fontSize: 9,
                   formatter: p => Math.abs(p.value) < 0.05 ? '' : p.value.toFixed(1) } }
      ]
    };
  }

  const isMobile = window.innerWidth <= 768;
  chart.setOption(option(isMobile));
  let lastMobile = isMobile;
  window.addEventListener('resize', () => {
    const m = window.innerWidth <= 768;
    chart.resize();
    if (m !== lastMobile) { lastMobile = m; chart.setOption(option(m), true); }
  });
}

      type: 'category', data: dates, boundaryGap: false,
      axisLine: { lineStyle: { color: GRID } },
      axisLabel: { color: MUTED, fontSize: isM ? 9 : 10,
        rotate: 0,
        interval: Math.max(0, Math.floor(dates.length / (isM ? 4 : 9))),
        formatter: x => isM ? String(x).slice(5) : x },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'value', scale: true,
      axisLine: { show: false }, axisTick: { show: false },
      splitLine: { lineStyle: { color: GRID } },
      axisLabel: { color: MUTED, fontSize: isM ? 9 : 10,
                   formatter: x => x.toFixed(2) + '%' }
    },
    series: [{
      type: 'line', data: vals, showSymbol: false,
      lineStyle: { color: '#3ea6e0', width: 2 },
      itemStyle: { color: '#3ea6e0' },
      areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
        { offset: 0, color: 'rgba(62,166,224,.14)' },
        { offset: 1, color: 'rgba(62,166,224,0)' }]) },
      markPoint: {
        symbolSize: 7,
        data: [
          { type: 'max', itemStyle: { color: '#f0453a' }, label: { show: false } },
          { type: 'min', itemStyle: { color: '#2ebd6b' }, label: { show: false } }
        ]
      }
    }]
  });
  window.addEventListener('resize', () => chart.resize());
}

document.getElementById('subline').textContent =
  '数据日期 ' + DATA.latest + '　｜　前一交易日 ' + DATA.prev +
  '　｜　中债国债收益率曲线（到期收益率·估值曲线）';
document.getElementById('summary').innerHTML = buildSummary();
document.getElementById('note').innerHTML =
  '<b>口径</b>：本页取中债登「中债国债收益率曲线」，是各期限的估值收益率；' +
  '研报里「10 年国债 260016」那种写法是活跃券成交收益率，通常比估值低 1-2bp，两者不可混用。<br>' +
  '<b>数据源</b>：中国债券信息网（中央国债登记结算有限责任公司）yield.chinabond.com.cn　｜　' +
  '抓取时间 ' + DATA.fetchedAt;
buildTable();
buildChart();
buildTL();
buildCD();
</script>

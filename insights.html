<script>
const DATA = {"updated_at": "2026-09-06 12:00", "source_name": "Professor Siegel Weekly Commentary", "source_zh": "杰里米·西格尔教授周评", "source_url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "articles": [{"id": "2026-08-31", "date": "2026-08-31", "title_en": "Warsh Gets an A: Re-focused Fed on the Right Key Principles", "title_zh": "沃什得 A：美联储重新聚焦正确的关键原则", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>凯文·沃什在杰克逊霍尔的讲话明显偏鹰派。但听完之后，我对沃什的信心反而更强了，并认为这是我所听过的最好的美联储主席演讲之一。最重要的是，沃什正在重新聚焦美联储框架中缺失多年的因素：明确承认货币供应和银行信贷对美联储的通胀前景至关重要。在疫情期间美联储与政府应对导致货币供应出现前所未有的关键性激增时，杰罗姆·鲍威尔在这一问题上表现得一塌糊涂。</p><p>沃什明确指出，除货币供应外，美联储还需要关注一系列广泛的指标，例如大宗商品价格、国内私人需求和信用利差，同时认识到许多官方经济数据都带有明显的滞后性。这正是正确的做法。货币政策不应只盯着「后视镜」里的通胀和就业统计。货币与信贷状况以及大宗商品价格，能比许多传统经济报告更早地告诉我们经济正在发生什么。</p><p>他关于利率与量化宽松（QE）相对重要性的讨论也让我备受鼓舞。QE 在流动性稀缺的金融危机期间可能极为重要，但在正常环境下，短期利率的水平远比它更关键。美联储资产负债表的规模本身，并不是衡量货币政策松紧的好指标。沃什还正确地质疑了前瞻性指引的重要性——既然我们已经不再处于零利率下限。当短期利率被钉在零、美联储需要靠承诺维持宽松来影响长期利率时，前瞻性指引是强有力的；但当利率远高于零时，这种机制的重要性就大大降低了。</p><p>对市场而言最重要的一点是，沃什并不认为当前政策具有特别的限制性。联邦基金利率约为 3.6%，银行信贷正以约 7%–8% 的年率扩张。这很难说是一种在压制需求的货币政策。</p><p>沃什指出，目前通胀预期似乎锚定良好，但他并没有把这种稳定视为理所当然。这完全正确。通胀预期往往看起来很稳定，直到突然之间不再稳定。正如海明威在被问及一个人如何破产时那句名言：「先是渐渐地，然后突然之间！」通胀预期也可能如此，这就是为什么美联储不能想当然地认为今天的稳定会一直持续下去。</p><p>在美联储之外，我们继续看到人工智能叙事为股市提供了非常强劲的基本面支撑。英伟达的财报打消了人们对 AI 投资周期正在失去动能的担忧。黄仁勋对 AI 需求持久性的信心推动了市场走高。Salesforce 的财报及其与 Anthropic 的合作，扭转了「所有软件都将被 AI 取代」的看空叙事，并带动了软件股的上涨。</p><p>总体而言，市场继续展现出相当强的韧性，我仍然保持建设性看多。我们刚刚经历了一段异常强劲的盈利增长，因此某种程度的减速不可避免，但这并不意味着盈利前景正在恶化。最大的问题是：沃什会在中期选举前加息，还是会等到 12 月？</p>", "body_en": "<p>Kevin Warsh's Jackson Hole speech was notably hawkish. But I came away from the speech even more confident in Warsh and thought it was one of the best speeches I've heard from a Federal Reserve chair. Most importantly, Warsh is refocusing on factors missing from the Fed's framework for years: an explicit recognition that money supply and bank credit matter for the Fed's inflation outlook. Jerome Powell failed miserably on this feature during a critical and unprecedented surge in money supply with the Fed and the government's pandemic response.</p><p>Warsh made clear that the Fed needs to look at a broad range of indicators in addition to the money supply, such as commodity prices, domestic private demand, and credit spreads, while recognizing much of the official economic data arrive with a substantial backward lag. This is exactly the right approach. Monetary policy should not be conducted by looking only at rear-view mirror inflation and employment statistics. Money and credit conditions and commodity prices tell us what is happening in the economy before many of the traditional economic reports do.</p><p>I was also encouraged by his discussion of the relative importance of interest rates versus quantitative easing (QE). QE can be extremely important during a financial crisis when liquidity is scarce, but in a normal environment the level of short-term interest rates is far more consequential. The size of the Fed's balance sheet is not, by itself, a good measure of whether monetary policy is tight or easy. Warsh also correctly questioned the importance of forward guidance now that we are no longer at the zero lower bound. Forward guidance was powerful when short-term rates were pinned at zero and the Fed needed to influence longer-term rates by promising to remain easy. That mechanism is much less important with rates well above zero.</p><p>The most important point for markets is that Warsh does not believe current policy is particularly restrictive. The federal funds rate is around 3.6%, and bank credit is expanding at roughly a 7%–8% annual rate. That is hardly consistent with a monetary policy crushing demand.</p><p>Warsh noted inflation expectations currently appear well anchored, but he did not take that stability for granted. That is exactly right. Inflation expectations often look stable until suddenly they do not. As Hemingway famously put it when asked how someone goes bankrupt, \"gradually, then suddenly!\" The same can happen with inflation expectations, which is why the Fed cannot simply assume that today's stability will persist.</p><p>Beyond the Fed, we continue to see a very strong fundamental backdrop from the AI story powering the equity market. Nvidia delivered results that pushed back against concerns that the AI investment cycle was losing momentum. Jensen Huang's confidence in the durability of AI demand helped propel the market. Salesforce's results and their partnership with Anthropic helped shift the bearish narrative that all software would be replaced by AI and led to a thrust in software stocks.</p><p>Overall, the market continues to demonstrate considerable resilience and I remain constructive. We are coming off extraordinarily strong earnings growth, so some deceleration is inevitable, but that does not mean the earnings outlook is deteriorating. The biggest question? Can Warsh hike before the mid-term elections or will he wait until December.</p>", "source": "siegel"}, {"id": "2026-08-10", "date": "2026-08-10", "title_en": "Soft Payrolls, Strong Earnings Reinforce Bullish Outlook", "title_zh": "非农疲软叠加盈利强劲，强化看多前景", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>市场被一份远弱于预期的就业报告所震动，国债收益率大幅下挫，投资者迅速下调了对美联储再次加息的押注。乍看之下，非农数据令人不安，尤其是叠加此前几个月的大幅下修，以及出人意料的疲弱薪资增长。</p><p>但我认为，这个头条数据夸大了劳动力市场的疲弱。大部分下滑似乎源于临时性因素——包括世界杯后休闲娱乐业就业走弱、州和地方政府招聘的季节性扰动，以及劳动力人口结构的持续变化——而非经济基本面的突然恶化。最重要的是，失业率实际上降至 4.1%，表明劳动力需求与当前放缓的劳动力增长大体相符。</p><p>劳动力市场已经进入一个新的均衡。随着人口增长放缓、移民收紧以及劳动力老龄化，每月约 2 万至 4 万的非农新增已经足以维持失业率稳定。十二个月平均就业增量已落在这一区间附近，表明经济正以接近其可持续趋势的速度增长，而非滑向衰退。如果 GDP 增长能够维持，偏弱的就业数据最终可能反而成为利好。以更少的工时生产同样的产出，将直接转化为更强的生产率增长——这正是投资者一直期待看到的、随着人工智能更深入地融入整体经济而出现的发展。尽管近期的生产率报告令人失望，但就业数据的大幅下修，提高了数据开始显现期待已久的人工智能驱动的生产率加速的可能性。</p><p>就货币政策而言，这份就业报告大幅降低了加息的可能性。未来一周的通胀数据依然关键，但油价仍是核心变量。受地缘紧张局势再度升温影响，汽油价格已从近期低点回升，不过期货市场目前暗示，若中东局势不再进一步升级，未来数月油价将温和回落。货币供应趋势同样值得密切关注。自近期冲突爆发以来，M2 以约 8% 的年化速度扩张，但这一增速似乎正在回落到 5% 至 6% 的区间。这仍高于战前水平，但远未达到疫情期间那种爆炸性的货币扩张。除非油价再次大幅飙升，否则我认为美联储很难在 9 月会议上为加息找到理由。</p><p>美国企业继续交出极为强劲的盈利，利润率达到了除强劲衰退后复苏期外罕见的水平。我认为这种强劲在很大程度上是结构性的，而非周期性的。如今的科技龙头将巨额的研究、软件和知识产权投资计为费用，而非像传统实物资产那样资本化。这种会计处理使得报表上的利润率显得异常之高，即便企业实际上正从那些从未出现在资产负债表上的巨额投资中获得回报。在科技行业之外，利润率保持相对稳定，这表明超常的盈利能力集中在那些从人工智能和无形资本中获益最多的企业，而非反映过度杠杆或不可持续的定价权。</p><p>未来的关键问题是，人工智能是否终于开始在生产率统计数据中体现出来。如果企业能以更少的工人生产更多产品，同时维持异常强劲的盈利增长，那么经济可能正在进入一个更为有利的长期生产率周期。这将支持盈利的持续扩张、缓解通胀压力，并最终使货币政策得以变得不那么紧缩。这份就业报告或许让投资者感到意外，但抛开头条数字，更大的叙事依然是：一个持续适应、创新并展现出非凡韧性的经济体。</p>", "body_en": "<p>The market was jolted by a much weaker-than-expected employment report, sending Treasury yields sharply lower as investors quickly reduced the odds of another Federal Reserve rate hike. At first glance, the payroll number looked alarming, particularly when combined with sizable downward revisions to prior months and unexpectedly soft wage growth.</p><p>But I believe the headline overstated the weakness in the labor market. Much of the decline appears attributable to temporary factors—including weakness in leisure employment following the World Cup, seasonal distortions in state and local government hiring, and ongoing shifts in labor force demographics—rather than a sudden deterioration in underlying economic conditions. Most importantly, the unemployment rate actually fell to 4.1%, indicating that labor demand remains broadly consistent with today's slower labor force growth.</p><p>The labor market has entered a new equilibrium. With slower population growth, tighter immigration, and an aging workforce, monthly payroll gains of roughly 20,000 to 40,000 are increasingly sufficient to keep unemployment stable. The twelve-month average job gain has settled near that range, suggesting the economy is growing close to its sustainable trend rather than slipping into recession. The weaker employment data could ultimately prove constructive if GDP growth holds up. Fewer hours worked producing the same level of output would translate directly into stronger productivity growth—precisely the development investors have been waiting to see as artificial intelligence becomes more deeply embedded throughout the economy. While recent productivity reports have disappointed, the labor revisions raise the possibility data will start showing the long-awaited AI-driven acceleration.</p><p>For monetary policy, the employment report materially lowers the chance of a rate increase. Inflation data over the next week will remain critical, but oil prices continue to be the key variable. Gasoline prices have risen from their recent lows following renewed geopolitical tensions, yet futures markets currently imply modest declines over the coming months if Middle East tensions do not escalate further. Money supply trends also deserve close attention here. Since the onset of the recent conflict, M2 has expanded at roughly an 8% annualized pace, but that growth now appears to be moderating back toward the 5% to 6% range. That remains above pre-war levels but is far removed from the explosive monetary expansion experienced during the pandemic. Unless oil prices experience another significant spike, I believe it will be difficult for the Fed to justify raising rates at its September meeting.</p><p>Corporate America continues to deliver remarkably strong earnings, with profit margins reaching levels rarely seen outside of powerful post-recession recoveries. I believe much of this strength is structural rather than cyclical. Today's technology leaders expense enormous investments in research, software, and intellectual property rather than capitalizing them as traditional physical assets. That accounting treatment makes reported profit margins appear extraordinarily high even though companies are earning returns on massive investments that never appear on the balance sheet. Outside tech, profit margins remain relatively stable, suggesting the extraordinary profitability is concentrated among firms benefiting most from AI and intangible capital rather than reflecting excessive leverage or unsustainable pricing power.</p><p>The key question going forward is whether AI finally begins to show up in the productivity statistics. If businesses produce more with fewer workers while maintaining exceptionally strong earnings growth, the economy may be entering a more favorable long-term productivity cycle. That would support continued earnings expansion, ease inflation pressures, and ultimately allow monetary policy to become less restrictive. The labor report may have surprised investors, but beneath the headline, the broader story remains one of an economy that continues to adapt, innovate, and demonstrate remarkable resilience.</p>", "source": "siegel"}, {"id": "2026-04-09", "date": "2026-04-09", "source": "oaktree", "title_en": "What's Going on in Private Credit?", "title_zh": "私募信贷发生了什么？", "author": "Howard Marks", "author_title": "橡树资本（Oaktree Capital）联合创始人 · 联席董事长", "url": "https://www.oaktreecapital.com/insights/memo/whats-going-on-in-private-credit", "body_zh": "<p>在我整个职业生涯中，被笼统称为「信贷」的领域经历了巨大的创新。它的受欢迎程度稳步上升，在金融世界中的规模和角色成倍增长。前几天，一位橡树资本的同事问我，究竟是哪些发展把信贷行业带到了今天这个位置。我列出了下面这张清单：</p>\n\n<h3>起源时间表</h3>\n<table>\n<tr><th>1970 年代</th><td>接受非投资级债务</td></tr>\n<tr><th>1980 年代</th><td>杠杆收购的普及，企业杠杆率上升</td></tr>\n<tr><th>1990 年代</th><td>银团贷款（Broadly Syndicated Loans）与分层证券化</td></tr>\n<tr><th>2000 年代</th><td>「另类」投资的兴起；次贷放款与抵押贷款支持证券</td></tr>\n<tr><th>2010 年代</th><td>直接贷款（Direct Lending）的扩张</td></tr>\n<tr><th>2020 年代</th><td>向个人与退休投资者销售直接贷款产品</td></tr>\n</table>\n\n<p>回想起来，我在 1968 年夏天初入投资界时，那个只由股票和高评级债券构成的世界，与上表所列的发展相比，显得如此朴素而局限。这些进步彻底改变了投资管理行业，而橡树资本及其客户是主要的受益者。上面列出的所有变化，都涉及——或者说都得益于——如今被广泛称为「信贷」的东西，本质上就是非政府债务。我先简要梳理一下这段历史，为后文铺陈背景。</p>\n\n<p>在 1977-78 年之前，一家没有投资级信用评级（BBB 或以上）的公司，几乎不可能公开发行债券。当时存在的投机级债务，主要是那些原本是投资级、后来陷入困境被降级的公司所发的债，也就是所谓的「堕落天使」。缺乏投资级评级的公司，通常只能向银行借款，或通过「私募」向保险公司融资。迈克尔·米尔肯（Michael Milken）通常被认为提出了这样一个想法，并在 1970 年代末付诸实践：只要利率高到足以补偿违约风险，非投资级公司就应该能够发行债券。这种「风险/收益思维」帮助催生了今天约 1.5 万亿美元的美国高收益债券市场，也促成了本文讨论的其他大部分发展。</p>\n\n<p>1970 年代中期发生过几笔小型的杠杆收购，但 1980 年代高收益债券的普及，让 LBO 基金、小公司和「收购艺术家」得以借到足够的钱，去收购比以往大得多的公司。这带来了杠杆收购的大规模扩张，催生了一个在 1990 年代改名为「私募股权」的行业。</p>\n\n<p>将债务工具打包、再按不同的优先级、风险和利率出售分层（tranche）的想法，始于 1970 年代抵押贷款支持证券的诞生——人们最常把它与所罗门兄弟的路易斯·拉涅里（Louis Ranieri）联系起来——并在 1980、1990 年代不断扩张。</p>\n\n<p>在 1990 年代之前，银行发放贷款——其中一些贷给非投资级公司——并把它们「银团」给少数几家同行银行。但随后，华尔街发展出了「银团贷款」「杠杆贷款」或「优先贷款」，大批量出售给机构投资者，发展到今天在美国约 1.5 万亿美元的市场。发行这类融资能力的大幅提升，助推了私募股权的增长。</p>\n\n<p>2000 年科技泡沫破灭后，标普股指出现了大萧条以来首次三年连跌，投资者对股市失去了兴趣，而且这种冷淡持续了整整十年。当各国央行降息以应对随之而来的经济与市场萎靡时，投资者又寻求高于债券的回报。股票和债券都不受待见，投资者开始寻找新的出路。他们把目光投向表现相对坚挺的对冲基金和私募股权，「另类投资」这个标签由此诞生。对冲基金找不到足够多的便宜机会来容纳庞大的机构资金，于是许多投资者转向私募股权，把它当作当时的解决方案。首批 100 亿美元级别的私募股权基金随之组建。</p>\n\n<p>大约在同一时期，企业债务开始被证券化进「结构化信贷」工具，比如贷款抵押证券（CLO）。那些打包这些工具、并利用「分层」实现内部加杠杆的银行，为高收益的次级档和过度抵押的高级档都找到了热切的买家。对 CLO 的强劲需求，以及结构化交易带来的利润，催生了对可供证券化贷款的需求，进而带动了银团贷款发行量的增加。</p>\n\n<p>许多同样的银行，把发放给可疑借款人的次级抵押贷款打包成住房抵押贷款支持证券（RMBS）。令人咋舌的是，银行家们竟能为以「骗子贷款」为底层资产的 RMBS 拿到数千个 AAA 评级。当这些贷款和结构的高度缺陷暴露出来时，结果就是 2008-09 年的全球金融危机（GFC）。</p>\n\n<p>金融危机结束时，银行变得更穷、更收敛、也受到更严格的再监管，结果是银行信贷供给不足，无法满足蓬勃发展的私募股权行业的需求。投资管理机构挺身填补了这个空缺，通过非银行贷款，也就是「私募信贷」来放贷。其中增长最快的部分，是「直接贷款」：向中端市场、由私募股权发起人（sponsor）支持的、评级低于投资级的组合公司提供的私募贷款。（请注意：「私募信贷」和「直接贷款」并非同义词；后者是前者的一个子集。如今许多提及私募信贷的报道，其实说的都是直接贷款。我会尽力在本文中谨慎区分这一点；而大多数评论者并不区分。）</p>\n\n<p>最近，向个人投资者和退休账户销售持有直接贷款的投资工具变得流行起来。这增加了可供直接贷款使用的资金，也推高了那些抢到这些资金的基金经理的管理规模。</p>\n\n<h3>正常模式</h3>\n<p>新式投资形态的流行度出现极端飙升——那些通常被贴上「泡沫」标签的现象——几乎总有一些共同特征：</p>\n<ul>\n<li><strong>核心要素是「新」。</strong>当某样东西是新的时，(a) 鼓吹者很容易通过宣扬它的优点来激发买家的兴趣；(b) 由于它从未经受过考验，缺陷尚未暴露。这让投资风潮得以成长为泡沫。</li>\n<li><strong>通常有几分真话。</strong>「漂亮五十」确实是好公司；互联网和数字通信确实改变了世界；抵押贷款通常也是安全的投资。这些真话为最终成长为极具破坏性的泡沫提供了基础。</li>\n<li><strong>早期投资新事物往往是赚钱的，</strong>因为最初入场的人，是在价格尚未被上升的人气推高之前买入的。</li>\n<li><strong>早期投资者的成功让旁观者眼红，促使他们加入这场狂欢。</strong>正如查尔斯·P·金德尔伯格在《疯狂、恐慌与崩溃：金融危机史》中所写：「没有什么比看到朋友发财更扰乱人的心境和判断力了。」嫉妒或许是世界上最强大的力量。</li>\n<li><strong>获得巨大成功的可能性点燃了投资者的希望。</strong>「可能」被混同于「大概」，继而演变成「必然」。怀疑与风险厌恶被抛到了九霄云外。</li>\n<li><strong>关键问题——也是狂热追逐中的投资者很少问的问题——是以什么价格参与才是安全的。</strong>嫉妒、兴奋、发财梦和踏空恐惧（FOMO），是谨慎和不愿跟风上车的大敌。</li>\n<li><strong>后来者吞下承诺、放低标准、推高价格，导致大多数投资趋势最终走向过度。</strong>对我而言，投资中最重要的一句格言是：「智者在开头做的事，愚者在结尾做。」巴菲特说得更形象：「先是创新者，然后是模仿者，最后是傻瓜。」</li>\n<li><strong>投资者在顺境时轻易忽略的那些缺陷、潜在陷阱和无法兑现的承诺，一旦围绕新事物的乐观情绪被证明过度、或付出的价格被证明过高，就必然导致幻灭与损失。</strong></li>\n</ul>\n<p>当马克·吐温（据传）说「历史不会重演，但会押韵」时，他想到的一定就是这种反复出现的模式。我认为这是投资中永恒的真理之一。</p>\n\n<h3>这适用于直接贷款吗？</h3>\n<p>我认为可以公允地说，过去 15 年里，直接贷款——私募信贷领域的一部分——经历了上述进程的某些阶段：</p>\n<ul>\n<li>一种新的融资形式被发明出来。</li>\n<li>随着银行放贷意愿下降，来自私募股权的融资需求超过了供给。这让早期的直接贷款人能够索取高利率，并通过严格的贷款文件获得强有力的保护。</li>\n<li>2010 年代的低利率，让直接贷款较高的预期回报显得格外有吸引力，尤其是考虑到回报还能通过低成本借款加杠杆。</li>\n<li>机构投资者注意到早期贷款的可取之处，纷纷加入这场狂欢。</li>\n<li>这种吸引力无疑因为一个事实而增强：私募贷款几乎没有价格波动，因为它们没有可供盯市的市场。这让鼓吹者可以说「它们能带来高风险调整后的回报」，但这并不对。更合理的说法是，它们能带来高「波动率调整后」的回报（这正是夏普比率所衡量的），但我要竭力强调：风险和波动率不是一回事。直接贷款所蕴含的信用风险，并不比高收益债券和银团贷款等流动性信贷工具小。只是这种风险不那么容易在价格上反映出来。</li>\n<li>数百家投资公司提供直接贷款服务，其中绝大多数是在全球金融危机结束后才进入私募信贷市场的，这意味着它们从未在艰难时期经受过考验。尽管如此，它们还是拿到了大量资金去管理。</li>\n<li>大量新管理人和巨量新增资本的涌入，导致贷款人竞相放贷，接受更低的收益率、更窄的利差和更弱的安全保障。有些管理人无疑是被「把大量资本投出去」的动机驱使，降低了标准。</li>\n<li>金融危机结束以来 17 年里总体良性的经济与投资环境，让直接贷款大获成功，尽管承销标准已经出现弱化的迹象，这些趋势却愈发明显。上述种种加在一起，促成了在低利率环境下向渴求回报的个人与退休投资者销售直接贷款产品。</li>\n</ul>\n<p>可供投资直接贷款的巨量资本，制造了一种淘金热的心态。过去 15 年里，大约发放了 2 万亿美元的直接贷款。（整个私募信贷行业 20 年前才约 1500 亿美元。）因此，我想象有些直接贷款管理人接受了过多的钱、投得过快、应用了过低的标准，为一次修正埋下了伏笔。</p>\n\n<p>在最近几个月，直接贷款（被那些不做精细区分的人泛化为整个私募信贷）的潮水开始退去。套用巴菲特的话，这带来了「某些裸泳者现形」的可能性。</p>\n\n<p>正如我在 2025 年 11 月的备忘录<a href=\"https://www.oaktreecapital.com/insights/memo/cockroaches-in-the-coal-mine\">《煤堆里的蟑螂》（Cockroaches in the Coal Mine）</a>中所写，2025 年年中，First Brands 和 Tricolor 这两起引人注目的破产案让信贷投资者措手不及。两者都引发了关于可能存在欺诈的担忧，而这种欺诈或许正是顺境中贷款人放低标准所纵容的。</p>\n\n<p>这引发了对直接贷款公开工具的担忧：也就是商业发展公司（BDC）。当一些「非上市 BDC」的投资者想要赎回资金却无法全额赎回时，关于流动性的质疑开始浮现。同样，人们也质疑这些工具如何对其私募债务持仓估值，进而质疑其报告账面价值的准确性，以及从工具中撤资的流程。或许正因如此，「上市 BDC」（可以卖出但不能赎回）的股票，开始以相对其净资产价值更大的折价交易。</p>\n\n<p>前面这些事件大多被当作孤例处理，也就是说当时并没有出现广泛的幻灭或信心丧失。但通常情况是，如果一系列令人不安的事件不断累积，最终会达到一个临界点，让投资者再也无法忽视新事物刚刚暴露的缺陷。而这就把我们带到了软件债务。</p>\n\n<h3>直接贷款与软件</h3>\n<p>在 2000 年代中期之前，高收益债券和杠杆贷款的投资者普遍不愿意把钱借给科技公司，因为科技公司被认为基本面风险太高，不够格成为借款人。既然无法加杠杆，它们也就不是私募股权基金收购的对象。</p>\n\n<p>但当私募股权基金的投资强劲增长时，管理人需要公司来买，这促使他们扩大了考虑的范围。他们得出结论：在那些「不太可能被取代的关键软件」中占据市场领先地位的公司，将 (a) 享受基于订阅的经常性现金流，这能让一家公司变得「可融资」；(b) 受益于围绕其业务的可持续护城河。私募股权基金开始收购软件公司，信贷投资者也开始为此提供资金。</p>\n\n<p><strong>以我的经验，信贷市场的制约因素从来不是借款人对资金的胃口，而是贷款人供应资金的意愿。</strong>套用凯文·科斯特纳在电影《梦幻之地》里的那句台词：「如果你提供资金，他们就会借钱并投入使用。」因此，信贷市场的构成，深受私募股权的增长、可供直接贷款的资金热潮，以及双方都认同软件公司是良好投资对象这一共识的影响。</p>\n\n<p>近年来，发起人（sponsor）越来越倾向于把直接贷款作为银团贷款的替代，因为前者能让他们从少数几家大贷款人那里拿到所需资金，免去了漫长的路演、广泛的信息披露，以及一旦出问题需要再谈判时面对大量对手方的麻烦。直接贷款人也表现出支持更高债务水平的意愿，让发起人能够实现超出银团贷款市场所能容纳的杠杆。他们还愿意以「ARR 贷款」（基于年度经常性收入）的形式，把钱借给尚未盈利的公司。</p>\n\n<p>贷款相对债券、私募相对公开的吸引力，使软件债务在美国次级投资级信贷市场中的占比大致如下：</p>\n<table>\n<tr><th>高收益债券</th><td>4-5%</td></tr>\n<tr><th>银团贷款</th><td>10-15%</td></tr>\n<tr><th>直接贷款</th><td>20-30%</td></tr>\n</table>\n\n<p>此外，由于同样的因素，在软件债务中，投向「杠杆收购标的公司」（即杠杆率更高的公司）的比例，在银团贷款市场中高于高收益债券市场，而在直接贷款市场中更高。</p>\n\n<p>由于上述种种，相当大一部分直接贷款投向了软件公司，而这些公司往往是以约 20 倍的 EBITDA 高倍数、以高杠杆率被收购的。如今，软件公司债务突然成了新闻焦点。</p>\n\n<p>在过去一两年里，人工智能显著减少了对人类写代码（即编写程序或软件）的需求，在很大程度上让程序员沦为「指示 AI 模型该做什么」的人。2024-25 年，软件公司股票和债务的市场反应并不大。随后，2025 年 11 月，Anthropic 发布了一款强大的新编程模型，接着在 1 月下旬发布了 11 个「插件」，用于在多个领域自动化任务。看起来，2 月的头几天达到了一个认知的临界点。投资者终于注意到了积累已久的负面因素，此后私募信贷市场一直面临审视与波动：</p>\n<ul>\n<li>对软件债务的担忧，让半流动公开工具的投资者提出了赎回申请。</li>\n<li>赎回限制让投资者质疑自己投资的安全性。</li>\n<li>一些投资者以公布的净资产价值（NAV）退出的过程，可能让留下的投资者质疑：人们退出时的 NAV 是否被高估了？如果高估，对自己又会有何影响？</li>\n<li>当基金限制赎回时，投资者可能会合理地得出结论：下次应该把更多的份额拿去申请赎回。</li>\n</ul>\n<p>直接贷款基金内置的赎回限制，迄今为止似乎按设计发挥了作用，让管理人避免了清仓式抛售。<strong>但如果投资者被告知「想取钱时却取不出来」，他们做出负面反应也是可以理解的。</strong></p>\n\n<h3>私募信贷与公众投资者</h3>\n<p>今天的私募信贷领域正在发生两件不同的事。一是借款人基本面和贷款稳健性的变化，二是投资者的反应。正如 Armen、Bob 和 Craig 在最近一份内部备忘录中所写：</p>\n<blockquote>虽然这些软件公司总体表现良好（只有少数例外），但市场上越来越担忧它们面临被 AI 显著颠覆的风险，这已实质性地冲击了它们的股权价值，并压缩了贷款人的股权缓冲。如今，投资者并不区分软件领域潜在的赢家和输家，整个板块都承受压力……这些扰动和头条新闻，很大程度上是资金面和情绪驱动，而非信用恶化的结果。</blockquote>\n<p><strong>投资者很少是本杰明·格雷厄姆和大卫·多德在《证券分析》中描述的那种理性、有条不紊、冷静客观的称重机，至少在短期内绝不是。</strong>正如我在 2016 年的备忘录<a href=\"/docs/default-source/memos/what-does-the-market-know.pdf?sfvrsn=cb7a0165_10\">《市场知道什么？》</a>中所写：现实生活里，事情在「还不错」和「不太妙」之间波动，但在投资者的心里，它们从「完美无瑕」直接跳到「无可救药」。</p>\n<p><strong>投资者起初会爱上新事物，全盘吞下它的承诺，并付出过高的价格。乐观与兴奋从来都不利于怀疑精神、冷静分析、维持恰当的风险厌恶，以及坚持高标准。</strong></p>\n<p><strong>然后，当失望与幻灭降临，最初支撑这项投资的胆量与信心便蒸发殆尽。此时的分析又朝相反方向出错，过度的悲观与怀疑取代了急切与轻信，纯粹的恐惧取代了在一切顺利时促成投资的盲目信念。</strong></p>\n<p>AI 对软件行业的影响、私募资产的流动性限制、以及直接贷款基金定价准确性的不确定性，这些因素已经存在多年了。但说白了，人们可能只是像往常一样，在顺境中没有提出足够多的问题、也没有给予足够多的关注。</p>\n<p>这就导致了当前直接贷款工具投资者的不适。投资直接贷款这种新现象的散户，不太可能完全理解它潜在的复杂性，尤其是当它从未在艰难时期经受实战检验时。工具中内置的杠杆，可能曾被鼓吹为「增厚利润」，而现在投资者正在看到它在相反方向上发挥作用。而投资工具对流动性的限制——可能当初被一句「大多数时候你大概会没事」的说法轻描淡写地带过——如今却以惊人的方式显现了出来。</p>\n<p><strong>狂热的信徒在狂热中赚得最多，怀疑者在崩溃时亏得最少。但我们要追求的投资成功的关键，在于始终在「相信」与「怀疑」之间保持健康的平衡。</strong>正如查理·芒格常引用古代哲学家德摩斯梯尼的话：「一个人所希望的，就是他所相信的。」大多数人梦想发财，当有人承诺一种无风险的发财之道时，他们就愿意相信。但新事物很少像预期那样兑现，尤其是当你在它狂热时毫不怀疑地投入。</p>\n<p>最稳妥的做法，是坚守久经考验的投资，把更具创新性的发展留给那些能够理解并应对其影响的专家。但很少有人能抗拒伴随大多数未经检验的风潮而来的「轻松获利」的诱惑。向来如此，永远如此。</p>\n\n<h3>1929 年的教训</h3>\n<p>我多年来读过的最好的投资书，是一本让我一章接一章读得停不下来的书：安德鲁·罗斯·索尔金所著《1929：华尔街史上最大崩盘的内部故事——以及它如何击垮了一个国家》。它讲述了 1929 年 10 月 29 日大崩盘的导火索及其后果，而且不是干巴巴地罗列事件，而是通过当时各路主角的侧写来呈现。从《1929》中能学到很多教训，与我喜欢的那些关于市场过度的书一脉相承：约翰·肯尼斯·加尔布雷思的《金融狂热简史》（1994）和爱德华·钱塞勒的《掠夺殆尽：金融投机史》（2000）。</p>\n<p>我从《1929》中得到的心得是，有三件事尤其要为那场以崩盘告终的泡沫负责：</p>\n<ul>\n<li>不考虑适当性就把股票卖给公众；</li>\n<li>向买家提供高额杠杆；以及</li>\n<li>所购资产的非流动性与为其融资的贷款的短期性质之间的错配。</li>\n</ul>\n<p>在长达数年的上涨之后，散户被诱入股市；1921 至 1928 年间，主要股指已经上涨了约 400%。券商渴求佣金和更大交易中的加价，为高达购买价 90% 的保证金贷款提供了融资。而一旦下跌抹掉了投资者 10% 的自有资金、又无法追加保证金，这些贷款就可能被要求立即偿还——持仓也会被平掉。这个故事听起来很熟悉（而且此后又重演过多次）：</p>\n<ul>\n<li>散户缺乏金融素养，容易受到推销和「好得不像真的」承诺的蛊惑。</li>\n<li>杠杆被描述成能够放大成功的果实，但相应的下行风险却往往在推销中被省略。</li>\n<li>保证金债务那些也许未被提及的条款——以及难以想象一场潜在市场下跌到底能有多深——让投资者暴露在毁灭的风险之下。</li>\n</ul>\n<p><strong>在股市里输个精光并不容易，但这三样东西加在一起，在足够糟糕的繁荣/崩盘周期里就能办到。</strong></p>\n<p>上述种种在 1929 年发生时，正值投资业监管法律近乎空白——包括对招股书真实性的要求——并因一些华尔街头面人物的自欺、缺乏原则和彻头彻尾的贪婪而雪上加霜。其结果是一场市场与经济的灾难，让好几代人心有余悸。</p>\n<p>索尔金大体上只限于记录笔下人物的行为，把下结论、讲教训留到了最后。但他结尾掷地有声：</p>\n<blockquote>股市下跌所带来的毁灭——不只是在崩盘期间，而是在其后十年的大部分时间里——给数百万美国人带来了难以忍受的痛苦。它让他们不只是远离市场，更让他们憎恨那些靠买卖股票谋生的人。<br><br>然而，把市场推到如此天高的力量——乐观、野心，以及对未来能无限光明的信念——并没有永远消失。它们从来不会消失。<br><br>归根结底，1929 年的故事无关利率或监管，也无关做空者的精明或银行家的失职。它关乎某种更恒久的东西：人性。无论发出多少警告、写下多少法律，人们总会找到新的方式去相信好日子能永远持续。他们会把希望装扮成必然。而在那种集体狂热中，人类会一次次失去理智。</blockquote>\n<p>永恒的教训不在于繁荣可以被阻止，也不在于崩溃可以被完全避免。而在于：我们需要记住，自己是多么容易遗忘。非理性繁荣的解药，不是监管本身，也不是怀疑，而是谦卑——那种知道没有系统万无一失、没有市场完全理性、没有哪一代人能豁免的谦卑。我们的确定性越高，摔得就越重、越久。</p>\n<p><strong>索尔金的结论性观察，捕捉到了从一轮轮周期中「押韵」重现的错误里可以汲取的教训。</strong></p>\n\n<h3>经理人该怎么做？</h3>\n<p>在我看来，一个尽责的经理人面临的最大难题，或许出现在「过多资本被推进他们所处的市场、投资者又急于把钱投出去」的时候。我在 2007 年 2 月、全球金融危机前夕的备忘录<a href=\"/docs/default-source/memos/2007-02-14-the-race-to-the-bottom.pdf?sfvrsn=9bbc0f65_6\">《逐底竞争》（The Race to the Bottom）</a>里详细谈过这一点（真不敢相信那已经快 20 年了）。大约就在那时，花旗 CEO 查克·普林斯说出了那句名言：「只要音乐还在放，你就得起来跳舞。」<strong>对一个经理人来说，这是怎样的两难：是在狂热投资者放低标准、急于把钱投出去时随波逐流，还是袖手旁观、分文不投，看着其他经理人堆积管理规模，并可能在你的怀疑与纪律最终得到回报之前那段看似无尽的时期里，让客户关掉账户？</strong></p>\n<p>我从来不想把橡树/布鲁克菲尔德描绘成投资美德的光辉典范，我也从不说我们是完美的。然而，卓越的投资不是来自全知全能和完美的决策，而是来自比别人更好的决策。事实上，自从 48 年前我开始做这件事以来，我们的高收益债券组合几乎每年都有违约……只是远少于大多数同行，也远少于我们为承担违约风险所获得的利差所预留的空间。话虽如此，我想描述一下我们在私募信贷、直接贷款和公开工具方面的立场。我为我们表现感到非常自豪，而且我认为这会很有启发性。</p>\n<p>第一，我们自几十年前高收益债券和银团贷款诞生之初就是投资者，但我们从未在私募信贷上过度投入。正如我一年前在备忘录<a href=\"https://www.oaktreecapital.com/insights/memo/gimme-credit\">《给我信贷》（Gimme Credit）</a>中所说，这几年来最热门的问题一直是「我们能聊聊私募信贷吗？」，而我的回应一直是「我们能聊聊信贷吗？」。我们坚持认为，私募信贷和流动信贷在投资组合中都应占有一席之地。</p>\n<p>第二，我们投资私募信贷已有数十年——在我们的困境债基金里购买银行贷款，从事夹层贷款和资产支持贷款——但我们从未像其他人那样大规模地追逐直接贷款。在 2010 年代初它刚出现时，我们认为直接贷款的回报，虽然相对较高，但绝对水平偏低。后来，我们认为它在定价和条款上的优越性，已经被新涌入的管理人和资本竞争掉了，使它变得「一般有吸引力」，而非「异常出众」。</p>\n<p>基于这些原因，私募信贷在橡树的正常信贷资产中占比远不到一半，而直接贷款在我们的私募信贷账簿中占比不到一半。因此，直接贷款只占橡树正常信贷投资的约 20%，占我们总管理规模不到 15%。</p>\n<p>第三，由于 (a) 我们的资产扩张远少于许多其他另类信贷管理人（橡树的管理规模在过去十年「仅仅」翻了一倍），且 (b) 直接贷款只占我们管理规模增长的有限一部分，我们感到的投资压力和降低标准的压力都要小得多。这意味着我们能够保持高度挑剔，限制投向软件的资金，并把它限定在我们认为最好的机会上。</p>\n<p>我们整个信贷平台对软件公司的敞口，无论从绝对量还是相对同行而言都极小。布鲁克菲尔德/橡树的大部分私募信贷基金都运作于直接贷款之外，因此对软件的持仓十分有限。即便是我们的直接贷款组合，软件敞口通常也很有限，而且在过去 12-18 个月里，我们对参与新的软件交易设定了特别高的门槛。</p>\n<p>因此，我们相信我们的私募信贷投资是防御性地承销、保守地结构化的。我们的软件敞口远低于同行，主要是第一留置权（first-lien），而且极少有实物支付（payment-in-kind）的成分。</p>\n<p>第四，橡树在私募信贷上的总投资中，80% 是代表机构客户，也就是说投向公众的非常少。当公开直接贷款工具的头部管理人手里有 400-500 亿美元甚至更多时，我们只有略高于 100 亿美元。</p>\n<p>因为我们直接贷款的投资有限，我们没有经历其他一些信贷管理人所经历的全部规模增长。这让我们处于有利位置，能够在如今投资者热情降温时大展拳脚。<strong>投资者新近抬高的怀疑，很可能在未来几天给我们带来比刚结束的这段时期里我们放弃的那些机会好得多的投资机会。</strong>保持纪律、抵制最新的风潮，不是短期收益最大化的路径，但却是我们追求卓越投资所必需的。</p>\n\n<h3>直接贷款与私募股权</h3>\n<p>由于私募股权与直接贷款的发展密不可分，我想在这里引入私募股权，谈谈这两个领域在未来几年将如何相互影响。私募股权的发展比直接贷款慢得多，但它们的命运紧密交织。</p>\n<p>正如我前面所述，私募股权诞生于 1970 年代，随 1980 年代高收益债券的普及而成长，在 2000 年代成为共识性的解决方案，又因 2010 年代兴起的直接贷款趋势而进一步加码。结果是造就了一个非常成功的私募股权行业，以及一个给了投资者他们所求回报的资产类别。这些收益在很大程度上归功于私募股权公司识别好公司、植入所有权文化、并通过战略和财务行动创造价值的能力。然而，也有相当一部分收益——却没有得到应有的承认——来自私募股权成长所处的利率环境。</p>\n<p>2022 年 12 月，我写了一篇备忘录<a href=\"https://www.oaktreecapital.com/insights/memo/sea-change\">《海变》（Sea Change）</a>。其中谈到 1980 年我的一笔未偿银行贷款，以及我收到的那张通知单：利率已经涨到了 22¼%。然后我说，2020 年我能够以 2¼% 借钱。我认为这 40 年、2000 个基点的利率下行，是过去半个世纪金融世界里最具影响力的事件，但它却没有得到足够的关注。</p>\n<p>在其他影响之中，利率下行让资产变得更有价值（导致央行行长们担忧的资产泡沫），并降低了借贷成本。因此，当利率下降时，借钱买资产的人会得到双重红利。而这正是私募股权的做法。正如我在《海变》中所写，由于利率下降和/或超低利率，私募股权行业在其存在的大部分时间里都享有巨大的顺风。2009-21 年这段时期尤其如此——这十三年里联邦基金利率大部分时间为零，平均只有约半个百分点。<strong>归根结底：私募股权诞生、并一直存在到 2021 年，它所处的利率环境对它极为有利。</strong></p>\n<p>不出所料，一切都很顺利。投资者认定私募股权是万能药；LP 资金涌入；GP 能够用唾手可得、低成本的债务资金（尤其是直接贷款出现之后）给它加杠杆。经济环境也提供支撑，迎来了美国历史上最长的复苏期。长达 10 年的牛市让私募股权公司很容易卖掉它们的组合公司，新私募基金急于通过从老私募基金手中买公司来投放资本的急切，也助长了这一点。回报不负众望，对 LP 的分配也是如此，这又让私募基金能够继续吸引 LP 资金，延续了这个「良性循环」。</p>\n<p>但 2022 年初，各国央行决定加息对抗通胀，联邦基金利率（举例而言）从零一路升到 5¼-5½%。《海变》的核心信息是：超低利率和长期下行的利率时代已经结束，那些从中受益最大的投资策略，未来将表现不如从前。</p>\n<p>《海变》这篇备忘录，源自 2022 年秋天我和布鲁斯·卡什（Bruce Karsh）疫情后首次成行时对客户的一次拜访。我永远不会忘记布鲁斯对形势的总结：<strong>「过去几年里，许多私募股权公司背负的资本结构，根本没有预料到利率会上涨 400 个基点。」</strong>利率上升给私募股权「齿轮里撒了沙子」，而今天的图景与上面描述的截然不同：</p>\n<ul>\n<li>更高的利息成本让许多组合公司利润下降。在杠杆成本低廉时非常划算的交易，如今经济意义大不如前。</li>\n<li>更高的利率意味着更高的利息支出，从而降低了利息覆盖率（盈利与利息支出之比），使低利率时期举借的债务更难再融资。</li>\n<li>利率上升降低了买家眼中公司未来现金流的价值，正如利率下降曾推高它一样。</li>\n<li>因此，组合公司可出售的价格更低了，组合公司的出售也放缓了。</li>\n<li>结果，对私募股权 LP 的分配下降，LP 基于老基金「正常」分配预期所做的资本承诺变得沉重。</li>\n<li>进一步的结果是，LP 更难向新基金出资。</li>\n<li>私募股权基金的回报骤降。根据 Claude 的说法，「MSCI 估计，2022 年至 2025 年三季度，一个美国私募股权基金指数的年化回报率为 5.8%，而标普 500 为 11.6%。」这进一步削弱了对新私募基金的热情。</li>\n</ul>\n<p><strong>未来，组合公司的表现将在很大程度上取决于私募股权公司在选择、融资和管理它们时运用了多少技能。这些因素——加上公司的可出售性——将在很大程度上决定为收购提供融资的债务（包括私募贷款）的表现。</strong>盈利下降可能迫使公司通过实物支付（PIK）功能增加欠款，而不是按计划偿还债务。债务到期时的偿还，可能因为 (a) 组合公司难以变现、(b) 再融资困难、(c) 公司估值跌破其债务总额的面值这几种因素叠加而变得复杂。贷款人会「把罐子往下踢」（拖延问题）吗？如果会，对信贷基金投资者又意味着什么？</p>\n<p>贷款人最终的安全保障，来自他们所贷公司未来的表现，以及他们因在资本结构中处于优先地位而获得的安全边际。<strong>那些做了熟练的尽职调查、坚守高标准、做出良好信贷决策的贷款人将会成功（请注意，高收益债券和银团贷款——直接贷款的前身——在包括全球金融危机在内的多年期里都表现良好）。</strong>即使有些借款人需要去杠杆，只要公司表现尚可，就应该能够支付利息和本金。当然，如果商业模式失灵、或公司被赋予更低的估值，前景就不那么乐观了，因为那会削减贷款人的安全边际，尤其是对次级债务档而言。</p>\n\n<hr>\n\n<p>为了说明「发展总会押韵重现」的倾向，我用鲍勃·奥利里（Bob O'Leary）前几天写给我的一段话来收尾：</p>\n<blockquote>我忽然觉得，今天的信贷市场与 1980 年代末/1990 年代初有着有趣的相似之处，那时你和布鲁斯创办了第一批 Special Credits 基金。当时有一种新的金融创新（高收益债券），许多投资者曾过度沉迷其中。市场突然被一场中东战争吓到，投资者只恨不能更快地抛掉高收益债券。<br><br>把高收益债券替换成直接贷款，再加上一点技术上的创造性破坏，你就得到了一些相同的动态（包括又一场中东战争引发的衰退恐慌）。最终，高收益债券安然无恙（甚至大放异彩），直接贷款也会如此，但它可能必须先经历一个信贷周期，才能走到更好的位置。</blockquote>", "body_en": "<p>The general field called \"credit\" has seen massive innovation over the course of my career. Its popularity has increased steadily, and its scale and role in the world of finance have multiplied. The other day, an Oaktree colleague asked me about the developments that brought the credit sector to where it is today. I came up with the following list:</p>\n\n<h3>Time of Inception</h3>\n<table>\n<tr><th>1970s</th><td>Acceptance of non-investment grade debt</td></tr>\n<tr><th>1980s</th><td>Popularization of leveraged buyouts and increased corporate leverage</td></tr>\n<tr><th>1990s</th><td>Broadly syndicated loans and tranched securitizations</td></tr>\n<tr><th>2000s</th><td>The rising trend toward \"alternative\" investments. Sub-prime mortgage lending and mortgage-backed securities</td></tr>\n<tr><th>2010s</th><td>Expansion of direct lending</td></tr>\n<tr><th>2020s</th><td>Marketing of direct lending vehicles to individual and retirement investors</td></tr>\n</table>\n\n<p>The investment world I first encountered in the summer of 1968, consisting exclusively of stocks and high-grade bonds, seems quaint and provincial in retrospect given the developments listed above. These advances have transformed the investment management business, and Oaktree and its clients have been major beneficiaries. All the changes listed above involved – or were facilitated by – the thing now broadly called \"credit\" – essentially non-government debt. I'll lay out a brief chronology to set the scene.</p>\n\n<p>Prior to 1977-78, it was virtually impossible for a company lacking an investment grade credit rating (BBB or above) to issue bonds publicly. The speculative-grade debt that did exist was primarily that of previously investment grade companies that had run into trouble and been downgraded, so-called \"fallen angels.\" Companies lacking investment grade ratings were generally limited to taking out bank loans or borrowing from insurance companies through \"private placements.\" Michael Milken is generally credited with the idea, implemented in the late 1970s, that non-investment grade companies should be able to issue bonds if their interest rates are high enough to compensate for the risk of default. This kind of \"risk/ return thinking\" helped enable the development of today's U.S. high yield bond market of roughly $1.5 trillion, along with most of the other developments under discussion here.</p>\n\n<p>A few small leveraged buyouts took place in the mid-1970s, but the popularization of high yield bonds in the 1980s enabled LBO funds, small companies, and \"takeover artists\" to borrow enough money to acquire much larger companies than was previously possible. That led to a massive expansion of LBOs, creating the industry that renamed itself \"private equity\" in the 1990s.</p>\n\n<p>The idea of pooling debt instruments and selling off tranches with varying seniority, risk, and thus interest rates began with the creation of mortgage-backed securities in the 1970s – most often associated with Louis Ranieri of Salomon Brothers – and expanded in the 1980s and '90s.</p>\n\n<p>Prior to the 1990s, banks made loans – some of them to non-investment grade companies – and \"syndicated\" them to a handful of fellow banks. But then \"broadly syndicated loans,\" \"leveraged loans,\" or \"senior loans\" were developed by Wall Street. They were sold to institutional investors in large amounts, growing to today's market of roughly $1.5 trillion in the U.S. The significant increase in the ability to issue this type of financing helped fuel the growth of private equity.</p>\n\n<p>After the tech bubble of the late 1990s imploded in 2000, leading to the first three-year decline in the S&P stock index since the Great Depression, investors became uninterested in the stock market and stayed that way for a decade. And when central banks reduced interest rates to fight the resulting economic and market malaise, investors sought returns above those available on bonds. With stocks and bonds out of favor, investors looked for a new solution. They turned to hedge funds and private equity, which had held up relatively well, and the label \"alternative investments\" was born. Hedge funds couldn't find enough bargain-priced opportunities to accommodate large amounts of institutional capital, so many investors gravitated toward private equity as the solution du jour. The first $10 billion private equity funds were organized.</p>\n\n<p>Around the same time, corporate debt began to be securitized in \"structured credit\" vehicles such as collateralized loan obligations, or CLOs. The banks that packaged these vehicles, with internal leverage from \"tranching,\" found eager buyers for both the high-yielding junior classes and the overcollateralized senior classes. The strong demand for CLOs and the profits available from structuring them created a need for loans to securitize, leading to increased issuance of broadly syndicated loans.</p>\n\n<p>Many of the same banks packaged subprime mortgage loans extended to questionable borrowers into residential mortgage-backed securities, or \"RMBS.\" Remarkably, the bankers were able to obtain thousands of triple-A ratings on RMBS backed by \"liar loans.\" When the highly flawed nature of these loans and structures came to light, the result was the Global Financial Crisis of 2008-09.</p>\n\n<p>The GFC ended with the banks poorer, chastened, and re-regulated, and as a result there weren't enough bank loans available to meet the needs of the burgeoning private equity industry. Investment managers moved to fill the vacuum through non-bank lending or \"private credit.\" The fastest-growing component was \"direct lending\": private loans to mid-market, private-equity-sponsored portfolio companies with sub-investment grade ratings. (Please note: \"private credit\" and \"direct lending\" aren't synonymous; the latter is a subset of the former. The many stories mentioning private credit these days are really about direct lending. I'll try here to be conscientious about making the distinction; most who comment aren't.)</p>\n\n<p>Most recently, it has become popular to market investment vehicles holding direct loans to individual investors and retirement accounts. This increased the capital available for direct lending and ballooned the assets under management of managers who scooped it up.</p>\n\n<h3>The Normal Pattern</h3>\n<p>Extreme upsurges in the popularity of novel forms of investment – those commonly labeled \"bubbles\" – invariably have certain features in common:</p>\n<ul>\n<li><strong>The essential element is newness.</strong> When something is new, (a) it's easy for its proponents to stimulate interest from buyers by touting its merits and (b) since it's never been tested, its flaws have yet to come to light. This allows investment fads to grow into bubbles.</li>\n<li><strong>Usually there's a grain of truth.</strong> The Nifty Fifty were great companies. The internet and digital communication did change the world. And mortgages are usually safe for investment. These truths provided the basis for what eventually grew into highly destructive bubbles.</li>\n<li><strong>Early investment in the new thing is often rewarding,</strong> since those who get in at the beginning do so at a price that hasn't yet been elevated by rising popularity.</li>\n<li><strong>The success of early investors makes those on the outside envious, convincing them to join the party.</strong> As Charles P. Kindleberger wrote in Manias, Panics, and Crashes: A History of Financial Crises, \"There is nothing so disturbing to one's well-being and judgment as to see a friend get rich.\" Envy just might be the strongest force in the world.</li>\n<li><strong>The possibility of great success inflames investors' hopes.</strong> Possibility is confused with probability and then morphs into certainty. Skepticism and risk aversion go out the window.</li>\n<li><strong>The critical question – rarely asked by investors in hot pursuit – is what price is safe to pay to participate.</strong> Envy, excitement, the dream of getting rich, and the fear of missing out are the mortal enemies of caution and reluctance to jump on the bandwagon.</li>\n<li><strong>Latecomers swallow promises, apply low standards, and push up prices, causing most investment trends to become overdone.</strong> For me, the most important investment adage of all is, \"what the wise man does in the beginning, the fool does in the end.\" Warren Buffett said it more colorfully: \"First the innovator, then the imitator, then the idiot.\"</li>\n<li><strong>The flaws, potential pitfalls, and unfulfillable promises that investors readily overlook when things are going well invariably lead to disillusionment and loss when the optimism surrounding the new thing turns out to have been excessive or the prices paid simply turn out to have been too high.</strong></li>\n</ul>\n<p>When Mark Twain purportedly said, \"History does not repeat itself, but it does rhyme,\" this must be the kind of recurring pattern he had in mind. I consider it one of the eternal truths in investing.</p>\n\n<h3>Does That Apply to Direct Lending?</h3>\n<p>I think it's fair to say aspects of this progression occurred over the last 15 years in direct lending, a part of the private credit universe:</p>\n<ul>\n<li>A new form of financing was developed.</li>\n<li>With banks less willing to lend, the demand for financing from private equity exceeded the supply. That allowed the early direct lenders to demand high interest rates and strong protections through robust loan documents.</li>\n<li>The low interest rates of the 2010s made the higher prospective returns on direct lending appear very attractive, especially given that returns could be levered through low-cost borrowing.</li>\n<li>Institutional investors noted the attractiveness of the early loans and joined the party.</li>\n<li>No doubt that attractiveness was enhanced by the fact that private loans don't exhibit much price volatility, since there's no market for them to mark to. That might have let their advocates say, \"They'll deliver high risk-adjusted returns,\" but it wasn't right. They could reasonably have been expected to deliver high volatility-adjusted returns (that's what Sharpe ratios are), but I insist strenuously that risk and volatility aren't the same thing. Direct loans embody no less credit risk than liquid credit instruments such as high yield bonds and broadly syndicated loans. It just isn't reflected as readily in prices.</li>\n<li>Hundreds of investment firms offered their services in direct lending, the vast majority of which entered the private credit market after the end of the Global Financial Crisis, meaning they'd never been tested in rough times. Regardless, they were given plenty of money to manage.</li>\n<li>The arrival of many new managers and a great deal of incremental capital caused lenders to compete to make direct loans by accepting lower yields, narrower yield spreads, and reduced safety. Some managers were doubtless motivated to lower their standards in order to put a lot of capital to work.</li>\n<li>The benign economic and investment environment that generally prevailed during the 17 years since the end of the GFC made direct loans successful, despite signs of weakening underwriting standards, allowing these trends to become more and more pronounced. The sum of the above facilitated the sale of direct lending vehicles to individual and retirement investors hungry for return in a low-interest-rate environment.</li>\n</ul>\n<p>The massive amounts of capital that have been available for investment in direct lending created a goldrush mentality. In the last 15 years, something like $2 trillion of direct loans has been made. (The whole private credit sector was only about $150 billion 20 years ago.) Thus, I imagine some direct lending managers accepted too much money and invested it too fast, applying standards that were too low and setting the scene for a correction.</p>\n\n<p>In the last several months, the tide has begun to go out for direct lending (generalized to all of private credit by those who don't make fine distinctions). To paraphrase Buffett, this created the possibility that some bare bottoms would be exposed.</p>\n\n<p>As I described in my November 2025 memo, Cockroaches in the Coal Mine, two prominent bankruptcies – First Brands and Tricolor – caught credit investors by surprise in mid-2025. Both raised concerns about possible fraud, perhaps enabled by the low standards applied by lenders in good times.</p>\n\n<p>This raised some concern regarding public vehicles for direct loans: business development companies, or \"BDCs.\" When some investors in \"non-traded BDCs\" wanted to withdraw their money and weren't able to do so in full, questions began to be raised regarding liquidity. Likewise, there were questions about how these vehicles valued their private debt holdings, and thus about the accuracy of reported carrying values and the process of withdrawing from the vehicles. Perhaps as a result, the shares of \"publicly traded BDCs,\" which can be sold but not redeemed, came to be priced at wider discounts from their net asset values.</p>\n\n<p>The preceding events were mostly treated as idiosyncratic, meaning there was no broad disillusionment or loss of confidence at the time. But it's usually the case that if a confluence of troubling events builds up, a critical mass can eventually be reached, rendering investors no longer able to overlook the newly exposed flaws in the new thing. And that brings us to software debt.</p>\n\n<h3>Direct Lending and Software</h3>\n<p>Prior to the mid-2000s, investors in high yield bonds and leveraged loans were generally unwilling to lend money to technology companies, which were considered too fundamentally risky to be creditworthy. And since they couldn't be levered, they weren't candidates for purchase by private equity funds.</p>\n\n<p>But when investment in private equity funds grew strongly, their managers needed companies to buy, and that caused them to expand the range of what they would consider. They concluded that companies with market-leading positions in essential software that was unlikely to be replaced would (a) enjoy the recurring subscription-based cash flows that can make a company bankable and (b) benefit from sustainable moats surrounding their businesses. Private equity funds began to buy software companies, and credit investors began to lend money for that purpose.</p>\n\n<p><strong>In my experience, the limiting factor in the credit markets is never borrowers' appetite for capital, but rather lenders' willingness to supply it.</strong> To paraphrase Kevin Costner's character in the movie Field of Dreams, \"If you provide capital, they'll borrow and put it to work.\" Thus, the makeup of the credit market was greatly influenced by the growth of private equity, the boom in capital available for direct lending, and both parties' agreement that software companies were good candidates for investment.</p>\n\n<p>In recent years, sponsors have increasingly turned to direct lending as an alternative to broadly syndicated loans, as the former allowed them to get the capital they needed from a few big lenders, freeing them from protracted road shows, widely distributed financial disclosure, and having to deal with a large number of counterparties if trouble necessitated renegotiation. Direct lenders have also shown a willingness to support higher debt levels, enabling sponsors to achieve leverage beyond what the syndicated loan market might accommodate. They've also been willing to lend more to companies that are not yet profitable in the form of \"ARR loans\" based on annual recurring revenue.</p>\n\n<p>The attractiveness to sponsors of loans versus bonds and private versus public brought the representation of software debt in the U.S. sub-investment grade credit markets to roughly the following proportions:</p>\n<table>\n<tr><th>High yield bonds</th><td>4-5%</td></tr>\n<tr><th>Broadly syndicated loans</th><td>10-15%</td></tr>\n<tr><th>Direct lending</th><td>20-30%</td></tr>\n</table>\n\n<p>In addition, thanks to the same factors, the percentage of software debt that is to companies that were the subject of leveraged buyouts (meaning they're more highly levered) is higher in the broadly syndicated loan market than in the high yield bond market, and higher still in the direct lending market.</p>\n\n<p>As a result of all the above, a significant portion of direct loans were made to software companies, which were often acquired at high EBITDA multiples of ~20x and with high leverage ratios. Now, suddenly, software company debt is in the news.</p>\n\n<p>Over the last year or two, artificial intelligence has significantly reduced the need for humans to write code (that is, program computers or write software), largely relegating coders to instructing AI models what to do. The market for software company stocks and debt didn't react much in 2024-25. Then, in November 2025, Anthropic released a powerful new model for coding, followed in late January by the release of 11 \"plug-ins\" to automate tasks in a number of fields. It seems a cognitive tipping point was reached in the first days of February. Investors finally took notice of the negatives that had accumulated, and the private credit market has faced scrutiny and volatility ever since:</p>\n<ul>\n<li>Worry about software debt made investors in semi-liquid public vehicles put in for redemptions.</li>\n<li>Limits on redemptions caused investors to question the safety of their investments.</li>\n<li>The process through which some investors got out at the stated net asset value might have caused those remaining to question whether the NAVs people exited at were overstated and if so what the impact might be on them.</li>\n<li>When funds limited redemptions, investors might reasonably have concluded that they should put more shares in for withdrawal next time.</li>\n</ul>\n<p>The redemption limits built into the direct lending funds appear to have worked as designed so far, allowing managers to avoid fire-sale liquidations. <strong>But it would be understandable if investors reacted negatively to being told they can't get their money out when they want.</strong></p>\n\n<h3>Private Credit and Public Investors</h3>\n<p>There are two different things going on in private credit today. There are the developments in the fundamentals of borrowers and the solidity of loans, and then there are the reactions of investors. As Armen, Bob, and Craig wrote in a recent internal memo:</p>\n<blockquote>While these software companies are generally performing well (with a few outliers), there has been a growing concern in the market that they are at risk of significant disruption from AI, which has materially impacted their equity value and reduced the equity cushion for lenders. Today, investors are not discriminating between the potential winners and losers in the software space, and the entire sector is under pressure. . . . The disruptions and headlines are largely flow- and sentiment-driven rather than the result of credit deterioration.</blockquote>\n<p><strong>Investors are rarely the informed, methodical, dispassionate weighing machine Benjamin Graham and David Dodd described in Security Analysis, and certainly not in the short run.</strong> As I wrote in my 2016 memo What Does the Market Know? in real life things fluctuate between pretty good and not so hot, but in the minds of investors they go from flawless to hopeless.</p>\n<p><strong>Investors initially fall in love with the new thing, swallow its promises whole, and overpay. Optimism and excitement are never conducive to skepticism, dispassionate analysis, the maintenance of appropriate risk aversion, and the insistence on high standards.</strong></p>\n<p><strong>Then, when disappointment and disillusionment set in, the bravado and confidence that originally supported the investment evaporate. Now the analysis errs in the opposite direction, with excessive pessimism and skepticism replacing eagerness and gullibility, and with sheer terror replacing the blind faith that enabled investment when everything was going well.</strong></p>\n<p>The implications of AI for the software industry, limitations on liquidity in private assets, and uncertainty regarding the accuracy of direct lending funds' pricing have been there for years. But, simply put, people may not have asked enough questions or paid enough attention in the good times . . . as usual.</p>\n<p>This has led to the current discomfort of investors in direct lending vehicles. Individual investors in a new phenomenon like direct lending are unlikely to fully grasp its potential complications, especially if it has never been seen in action during tough times. The inclusion of leverage in the vehicles may have been touted as profit-enhancing, and now investors are seeing it at work in the opposite direction. And the investment vehicles' limitations on liquidity – which may have been glossed over with a representation that \"most of the time, you'll probably be okay\" – has come into play with surprising effect.</p>\n<p><strong>True believers make the most money in manias, and skeptics lose the least when they crash. But the key to the investment success we aim for lies in always maintaining a healthy balance between belief and doubt.</strong> As Charlie Munger used to say, quoting the ancient philosopher Demosthenes, \"For that which a man wishes, that he will believe.\" Most people dream of getting rich and are willing to trust when promised a way to do so without risk. But the new thing rarely pays off as expected, especially if invested in unskeptically while it's raging.</p>\n<p>It's safest to stick to tried and true investments and leave the more innovative developments to experts who are able to understand and cope with the implications. But few can resist the siren song of easy profits that accompanies most untested fads. It will ever be so.</p>\n\n<h3>The Lessons of 1929</h3>\n<p>The best investing book I've read in years, one that pulled me along from chapter to chapter, is 1929: Inside the Greatest Crash in Wall Street History – and How It Shattered a Nation, by Andrew Ross Sorkin. It describes the leadup to the Great Crash of October 29, 1929, and its aftermath, and it does so not by dryly recounting the events, but through profiles of the protagonists of the day. There are a lot of lessons to be learned from 1929, along the lines of my favorite books about market excesses: A Short History of Financial Euphoria by John Kenneth Galbraith (1994) and Devil Take the Hindmost: A History of Financial Speculation by Edward Chancellor (2000).</p>\n<p>My take from 1929 was that three things in particular were primarily responsible for the bubble that ended in the Great Crash:</p>\n<ul>\n<li>the sale of stock to the public without regard for suitability,</li>\n<li>the provision of heavy leverage to the buyers, and</li>\n<li>the mismatch between the illiquidity of the assets bought and the short-term nature of the loans that financed the purchases.</li>\n</ul>\n<p>Individual investors were lured into the stock market following an ascent that had gone on for years; the major stock market averages had already risen by roughly 400% between 1921 and 1928. Brokerage firms, hungry for commissions and markups on larger transactions, provided margin loans for up to 90% of the purchase price. And those loans could be called – and the positions sold out – if a decline wiped out the investor's 10% equity and additional cash couldn't be posted. The story sounds familiar (and has been repeated several times since):</p>\n<ul>\n<li>A lack of financial sophistication on the part of individual investors leaves them susceptible to promotions and too-good-to-be-true promises.</li>\n<li>Leverage is described as capable of magnifying the fruits of success, but the corresponding downside risk is often omitted from the sales pitch.</li>\n<li>The perhaps-unmentioned terms of margin debt – and the difficulty of imagining the full depth of a potential market decline – expose investors to the risk of ruin.</li>\n</ul>\n<p><strong>It's not easy to lose everything in the stock market, but the combination of these three elements can do the trick in a bad-enough boom/bust cycle.</strong></p>\n<p>The things described above took place in 1929 against the background of a near-total absence of laws governing the investment business, including requirements for honesty in prospectuses, and were compounded by the self-serving delusion, lack of principles, and downright venality of some Wall Street leaders. The result was a market and economic catastrophe that scarred several generations.</p>\n<p>Sorkin mostly limits himself to chronicling his characters' behavior, leaving the drawing of conclusions and morals until the very end. But he finishes with a punch:</p>\n<blockquote>The devastation wrought by the stock market's decline – not just during the crash itself but for most of the ensuing decade – caused millions of Americans insufferable pain. It caused them to not just turn away from the market but to revile those who made their living buying and selling stocks.<br><br>Yet the forces that drove the market to such stratospheric levels – optimism, ambition, and the belief that the future could be endlessly brighter – did not disappear forever. They never do.<br><br>Ultimately, the story of 1929 is not about [interest] rates or regulation, nor about the cleverness of short sellers or the failures of bankers. It is about something far more enduring: human nature. No matter how many warnings are issued or how many laws are written, people will find new ways to believe that the good times can last forever. They will dress up hope as certainty. And in that collective fever, humanity will again and again lose its head.</blockquote>\n<p>The enduring lesson is not that booms can be prevented, or that busts can be fully averted. It is that we need to remember how easily we forget. The antidote to irrational exuberance is not regulation by itself, nor skepticism, but humility – the humility to know that no system is foolproof, no market fully rational, and no generation exempt. The greater the heights of our certainty, the longer and harder we fall.</p>\n<p><strong>Sorkin's concluding observations capture the lessons that can be learned from the mistakes that rhyme from cycle to cycle.</strong></p>\n\n<h3>What's a Manager to Do?</h3>\n<p>In my opinion, perhaps the conscientious manager's biggest problem arises when too much capital is being pushed into their market and investors are too eager to put it to work. I talked about this at length in my February 2007 memo, The Race to the Bottom, on the doorstep of the Global Financial Crisis (I can't believe it's almost 20 years old). That's roughly when Citibank's CEO, Chuck Prince, was moved to say, \"As long as the music is playing, you've got to get up and dance.\" <strong>What a choice for a manager: join in when feverish investors are lowering their standards in order to put money to work, or sit on the sidelines and not invest, watching as other managers pile up AUM, and likely causing clients to close their accounts in the seemingly interminable period before your skepticism and discipline finally pay off?</strong></p>\n<p>I never want to present Oaktree/Brookfield as the paragon of investment virtue, and I never say we're perfect. However, superior investing doesn't result from omniscience and perfect decision making, but rather from decisions that are better than those made by others. In truth, we've had defaults in our high yield bond portfolios nearly every year since I started the effort 48 years ago . . . just far fewer than most and far fewer than were allowed for by the yield spread we were paid for bearing default risk. Having said that, I want to describe where we stand with regard to private credit, direct lending, and public vehicles. I'm very proud of our performance, and I think this will be instructive.</p>\n<p>First, we've been investors in high yield bonds and broadly syndicated loans since their inception decades ago, but we never went overboard in private credit. As I mentioned a year ago in my memo, Gimme Credit, whereas for a few years the most popular question has been \"can we talk about private credit?\" my rejoinder has been \"can we talk about credit?\" We insisted there was a place in portfolios for both private credit and liquid credit.</p>\n<p>Second, we've been investing in private credit for decades – buying bank loans in our distressed debt funds and engaging in mezzanine lending and asset-backed lending – but we never pursued direct lending to the same extent as others. At the beginning of its existence in the early 2010s, we thought the returns from direct lending, while high in relative terms, were low in the absolute. And later, we thought the superiority in pricing and terms had been competed away by the newly arrived managers and capital, rendering it average in attractiveness, not exceptional.</p>\n<p>For these reasons, private credit represents well under half of Oaktree's performing credit assets, and direct lending represents less than half of our private credit book. Thus, direct lending is only around 20% of Oaktree's investments in performing credit and less than 15% of our overall assets under management.</p>\n<p>Third, since (a) we expanded our assets far less than many other alternative credit managers (Oaktree's AUM \"only\" doubled over the last decade) and (b) direct lending was a limited part of our AUM growth, we've felt less pressure to invest quickly or compromise our standards. That meant we could remain highly selective, limiting the amount invested in software and restricting it to what we believe to be the best opportunities.</p>\n<p>Our exposure to software companies across our entire credit platform is extremely small on an absolute basis and relative to peers. Most of Brookfield/Oaktree's private credit funds operate outside of direct lending and thus have only limited holdings in software. Even our direct lending portfolios generally have limited software exposure, and over the last 12-18 months we've maintained a particularly high bar for participating in new software transactions.</p>\n<p>Thus, we believe our private credit investments have been defensively underwritten and conservatively structured. Our software exposure is substantially less than that of our peers, predominantly first-lien, and with very little of it payment-in-kind.</p>\n<p>Fourth, 80% of Oaktree's total investment in private credit is on behalf of institutional clients, meaning very little was placed with the public. While the leading managers of public direct lending vehicles have $40-50 billion or more there, we have just over $10 billion.</p>\n<p>Because our investment in direct lending was limited, we didn't experience all the AUM growth some other credit managers did. That positions us well to take advantage now that investor enthusiasm has become more tempered. <strong>Investors' newly elevated skepticism is likely to give us investment opportunities in the days ahead that are much better than those we passed up in the period just ended.</strong> Staying disciplined and resisting the latest fads isn't the route to short-term maximization, but it's essential for the excellence in investing we seek.</p>\n\n<h3>Direct Lending and Private Equity</h3>\n<p>Because it's so much a part of the development of direct lending, I want to bring in private equity here and talk about the ways the two sectors will impact each other in the years ahead. Private equity took a lot longer to develop than direct lending, but their fates are very much intertwined.</p>\n<p>As I described earlier, private equity was birthed in the 1970s, grew with the popularization of high yield bonds in the 1980s, became a consensus solution in the 2000s, and was amped up by the trend toward direct lending starting in the 2010s. The result was a very successful private equity industry and an asset class that gave investors the returns they wanted. In large part, those gains are attributed to PE firms' ability to identify good companies to buy, install an ownership culture, and add value through strategic and financial actions. However, a substantial part of the gains resulted – without as much recognition as might have been due – from the interest rate climate private equity grew up in.</p>\n<p>In December 2022, I wrote a memo called Sea Change. In it I talked about a bank loan I had outstanding in 1980 and the slip I got in the mail informing me that my interest rate had risen to 22¼%. Then, I said, I was able to borrow at 2¼% in 2020. I consider that 40-year, 2,000-basis point decline in interest rates the most impactful event in the financial world in the last half-century, but one that has received inadequate attention.</p>\n<p>Among other things, declining rates make assets more valuable (leading to the asset bubbles central bankers worry about) and reduce the cost of borrowing. Thus, when rates fall, people who bought assets using borrowed money get a double bonus. And that's exactly what private equity does. Thanks to declining and/or ultra-low rates, as I wrote in Sea Change, the private equity industry enjoyed a great tailwind for much of its existence. This was particularly true of the period 2009-21, thirteen years in which the fed funds rate was zero most of the time and averaged about half a percent. <strong>Bottom line: private equity was born and existed through 2021 in an interest rate climate that was supportive of it in the extreme.</strong></p>\n<p>Unsurprisingly, things went great. Investors concluded that private equity was a panacea; LP capital flowed in; and GPs were able to lever it up with freely available, low-cost debt capital, especially from direct lending after its arrival on the scene. The economic climate was supportive, featuring the longest recovery in U.S. history. A 10-year bull market made it easy for PE firms to sell their portfolio companies, as did the eagerness of new PE funds to deploy capital by buying companies from old PE funds. Returns lived up to expectations, as did distributions to LPs, and this enabled PE funds to continue attracting LP capital, perpetuating the \"virtuous circle.\"</p>\n<p>But early in 2022, the central banks decided to fight inflation by raising rates, and the fed funds rate (for example) went from zero to 5¼-5½%. The essential message of Sea Change was that the days of ultra-low and secularly declining interest rates were over, and the investment strategies that had benefitted most from them would do less well in the future.</p>\n<p>The Sea Change memo was the product of a trip Bruce Karsh and I made to clients in the fall of 2022, when travel first became possible post-pandemic. I'll never forget the way Bruce summed up the situation: <strong>\"In the last several years, a lot of private equity companies have been saddled with capital structures that didn't anticipate a 400-basis point increase in interest rates.\"</strong> The rate rise \"threw sand in the gears\" of private equity, and the picture today is very different from that described above:</p>\n<ul>\n<li>Higher interest costs have made many portfolio companies less profitable. Deals that were very lucrative when the cost of leverage was low now make less economic sense.</li>\n<li>Higher rates have meant higher interest bills and thus lower coverage ratios – the ratio of earnings to interest expense – making it more difficult to refinance debt taken on when rates were low.</li>\n<li>Rising interest rates reduced the value to buyers of companies' future cash flows, just as falling rates had increased it.</li>\n<li>Thus, the prices at which portfolio companies can be sold is lower, and sales of portfolio companies have slowed.</li>\n<li>As a consequence, distributions to private equity LPs have fallen, and capital commitments LPs made based on expectations of \"normal\" distributions from older funds have become burdensome.</li>\n<li>As a further consequence, LPs are less able to commit to new funds.</li>\n<li>Returns on private equity funds have fallen precipitously. According to Claude, \"MSCI estimates that between 2022 and Q3 2025, an index of U.S. private equity funds saw annualized returns of 5.8%, compared to 11.6% for the S&P 500.\" This further reduced enthusiasm for new PE funds.</li>\n</ul>\n<p><strong>In the future, the performance of portfolio companies will be heavily influenced by the amount of skill private equity firms applied in selecting, financing, and managing them. These things – plus the salability of companies – will do a great deal to determine the performance of the debt that financed buyouts, including private loans.</strong> Declining profitability can require companies to increase the amount they owe through the payment-in-kind feature rather than service their debt as scheduled. Repayment of debt at maturity can be complicated by the combination of (a) difficulty monetizing portfolio companies, (b) refinancing challenges, and (c) company valuations that fall below the face amount of the companies' total debt. Will lenders kick the can down the road? If so, what are the implications for investors in credit funds?</p>\n<p>Lenders derive their eventual security from the performance of the companies they lend to and the margin of safety they receive from being senior in the capital structure. <strong>Lenders who performed skillful due diligence, upheld high standards, and made good credit decisions will be successful (note that high yield bonds and broadly syndicated loans, the precursors of direct lending, did fine in multi-year periods that included the Global Financial Crisis).</strong> Even if some borrowers have to delever, decent company performance should permit the payment of interest and principal. Of course, the outlook is less good if business models falter or lower valuations are assigned to companies, as that reduces the lender's margin of safety, especially with regard to junior debt tranches.</p>\n\n<hr>\n\n<p>Illustrating the tendency of developments to rhyme, I'll close with something Bob O'Leary wrote to me the other day:</p>\n<blockquote>It strikes me that there are interesting parallels between credit markets today and the late 1980s/early '90s, when you and Bruce started the first Special Credits funds. Back then, there was a new financial innovation (high yield bonds) that many investors had over-indulged in. The market suddenly got spooked by a war in the Middle East, and investors couldn't dump high yield fast enough.<br><br>Substitute direct lending for high yield and add an element of technological creative destruction, and you have some of the same dynamics (including another war in the Middle East sparking fears of recession). Ultimately, high yield was fine (even great), and direct lending will be as well, but it may have to go through a credit cycle to get to a better place.</blockquote>"}]};

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function sourceName(s){
  return s === 'oaktree' ? '马克斯备忘录' : (s === 'siegel' ? '西格尔周评' : (s || ''));
}

function render(){
  document.getElementById('updatedAt').textContent = DATA.updated_at || '—';
  document.getElementById('disclaimer').innerHTML =
    DATA.source_zh + '来自 ' + esc(DATA.source_name) + '，原文见 ' +
    '<a href="'+esc(DATA.source_url)+'" target="_blank" rel="noopener" style="color:var(--accent)">官方页面</a>。' +
    '本文为个人翻译，仅供学习参考，不构成任何投资建议。作者观点可能随时变化，请以官方原文为准。';

  const arts = DATA.articles.slice().sort((a,b) => b.date.localeCompare(a.date));
  if (!arts.length) { document.getElementById('articles').innerHTML = ''; return; }

  // 每个来源的最新一篇完整显示，其余折叠
  const latestBySource = {};
  const rest = [];
  arts.forEach(a => {
    const s = a.source || 'other';
    if (!(s in latestBySource)) latestBySource[s] = a;
    else rest.push(a);
  });
  const latestList = Object.values(latestBySource).sort((a,b) => b.date.localeCompare(a.date));

  let html = '';
  latestList.forEach(a => {
    html += '<div class="article latest">' +
      '<div class="a-date">'+esc(a.date)+'<span class="a-source-tag">'+esc(sourceName(a.source))+'</span></div>' +
      '<div class="a-title-zh">'+esc(a.title_zh)+'</div>' +
      '<div class="a-title-en">'+esc(a.title_en)+'</div>' +
      '<div class="a-author"><b>'+esc(a.author)+'</b> · '+esc(a.author_title)+'</div>' +
      '<div class="a-body">' + a.body_zh + '</div>' +
      '<details class="a-en"><summary>英文原文</summary>' +
        a.body_en + '</details>' +
      '<a class="a-src" href="'+esc(a.url)+'" target="_blank" rel="noopener">阅读英文原文 ↗</a>' +
    '</div>';
  });

  // 历史归档（折叠）
  if (rest.length) {
    html += '<div class="archive-title"><div class="bar"></div><h2>历史观点</h2><span class="en">ARCHIVE</span></div>';
    rest.forEach(a => {
      html += '<details class="arch-item">' +
        '<summary><span class="d">'+esc(a.date)+'</span><span class="t">'+esc(a.title_zh)+'</span></summary>' +
        '<div class="arch-body"><div class="a-title-en" style="margin-bottom:8px">'+esc(a.title_en)+'</div>' +
          a.body_zh + '</div>' +
      '</details>';
    });
  }
  document.getElementById('articles').innerHTML = html;
}

render();
</script>
</body>
</html>

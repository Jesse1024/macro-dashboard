<script>
const DATA = {"updated_at": "2026-09-28 21:00", "source_name": "Professor Siegel Weekly Commentary", "source_zh": "杰里米·西格尔教授周评", "source_url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "articles": [{"id": "2026-09-28", "date": "2026-09-28", "source": "siegel", "title_en": "Surging Real Yields Test a Resilient Market", "title_zh": "实际收益率飙升，考验韧性十足的市场", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>债券市场已经成为投资者关注的核心叙事。过去几周引人注目的变化，不是通胀预期上升，而是实际利率上行。实际利率在三周内上升了约 40 个基点，这是我在如此短的时间里记忆中最为剧烈的一次变动之一。与此同时，较长期限的通胀预期实际上还略有下降。这是市场在重新定价实体经济的强劲，而非又一次简单的通胀恐慌。</p><p>增长数据持续超预期上行。当前的 GDP 预估从低端约 3.3% 到亚特兰大联储给出的约 5% 不等，而初请失业金人数再次低于 20 万人。这样的经济，很难说有多少迹象表明货币政策已经变得足够紧缩。市场越来越怀疑，再额外加息一次是否足够。如果即将公布的通胀和就业数据继续保持如此强劲，美联储将不得不认真考虑在 10 月加息 25 个基点，并在年底前再采取一次行动。</p><p>这种重新定价最引人注目的体现出现在 TIPS（通胀保值债券）市场。10 年期实际收益率已逼近 2.8%，这是我们多年来并不常见到的水平。这对股票影响巨大。20 倍市盈率大致对应约 5% 的盈利收益率，因此接近 3% 的实际国债收益率，开始实质性地收窄股票相对债券所享有的优势。它并不会消除股票风险溢价，但会让这种竞争变得严峻得多。</p><p>然而股票表现出色地扛住了压力，而且这是有充分理由的。经济更强劲不仅推高贴现率，也会推高盈利。股票参与了名义经济增长，并提供抵御通胀的保护，而固定利率债券做不到这一点。正因如此，股市对这一轮实际利率的异常上行所表现出的消化能力，远超人们通常的预期。未来的较量非常清晰：更强的盈利对阵更高的贴现率。</p><p>我将再次特别密切关注货币供应。最新的周度银行存款数据出现大幅增长，本周即将公布的月度 M2 数据，将告诉我们此前看到的加速是否仍在延续。如果货币增长保持强劲，而就业和实际 GDP 又在同时加速，那么美联储保持耐心的空间将进一步收窄。</p><p>更高的利率也让许多投资者所预期的、由经济走强所带动的中小盘股与价值股轮动变得更加复杂。对周期敏感的行业应当受益于更好的增长，但规模较小的公司也更依赖短期融资。市场对 2027 年年中的联邦基金利率预期已上移近 100 个基点，而抵押贷款利率再次升破 7%。如果这些利率持续下去，住房将继续受到抑制，而高杠杆企业将直接感受到融资负担。</p><p>人工智能领域还涌现出一股令人着迷的新力量。市场对 Meta 新 AI 智能体的初步反应，凸显出一个潜在广泛得多的经济变化。银行、电信、保险及其他行业的公司，长期以来受益于客户惯性。消费者常常因为换一家不值得费力，而继续忍受较差的利率或服务。一个能够比价、谈判并更换服务商的 AI 智能体，改变了这一等式。</p><p>我在 25 多年前就写过，互联网可以通过让比价变得极其容易，从而加剧价格竞争。结果好坏参半，因为消费者仍需要自己采取行动。AI 智能体有可能消除这最后一层摩擦。如果它们开始去谈电话账单、把存款转向收益率更高的账户，或例行地寻找更便宜的替代方案，它们就能冲击所谓「惯性垄断」。这最终可能成为整个经济中一股重要的竞争力量，也是一股重要的去通胀力量。</p>", "body_en": "<p>The bond market has become the central story for investors. The remarkable development over the past several weeks is not rising inflation expectations but rising real interest rates. Real rates have increased roughly 40 basis points in just three weeks, one of the sharpest moves I can remember over such a short period. Meanwhile, longer-term inflation expectations have actually edged slightly lower. This is a market repricing the strength of the real economy, not simply another inflation scare.</p><p>The growth numbers continue to surprise on the upside. Current GDP estimates range from roughly 3.3% at the low end to around 5% from the Atlanta Fed, while initial jobless claims have again come in below 200,000. That is simply not an economy showing much evidence that monetary policy has become restrictive enough. The market is increasingly questioning whether one additional Fed hike will be sufficient. If the incoming inflation and employment data remain this strong, the Fed will have to seriously consider a 25-basis-point increase in October followed by another move by year-end.</p><p>The most striking manifestation of this repricing is in the TIPS market. The 10-year real yield has approached 2.8%, a level we have not regularly seen in many years. That matters enormously for equities. A 20-times earnings multiple represents roughly a 5% earnings yield, so a real Treasury yield approaching 3% begins to meaningfully narrow the advantage stocks have enjoyed over bonds. It does not eliminate the equity premium, but it makes the competition much more serious.</p><p>Yet stocks have held up remarkably well, and there is a good reason. A stronger economy does not merely increase discount rates; it also increases earnings. Equities participate in nominal economic growth and provide protection from inflation, while fixed-rate bonds do not. That is why the stock market has absorbed this extraordinary rise in real rates considerably better than one might normally expect. The battle going forward is very clear: stronger earnings versus higher discount rates.</p><p>I will again be watching the money supply particularly closely. Weekly bank deposits showed a substantial increase in the latest data, and the next monthly M2 release this week will tell us whether the acceleration we saw previously is continuing. If money growth remains strong at the same time that employment and real GDP are accelerating, the Fed will have even less room to remain patient.</p><p>Higher rates also complicate the case for the small-cap and value rotation that many investors have expected from a stronger economy. Cyclically sensitive companies should benefit from better growth, but smaller companies are also much more dependent on short-term financing. Fed-funds expectations for mid-2027 have moved almost 100 basis points higher, while mortgage rates are again above 7%. Housing will remain restrained if those rates persist, and highly leveraged companies will feel that financing burden directly.</p><p>There is also a fascinating new force emerging from artificial intelligence. The initial reaction to Meta's new AI agent highlights a potentially much broader economic development. Companies in banking, telecommunications, insurance and other industries have long benefited from customer inertia. Consumers frequently stay with an inferior rate or service because switching simply is not worth the effort. An AI agent capable of comparison shopping, negotiating and switching providers changes that equation.</p><p>I wrote more than 25 years ago that the internet could intensify price competition by making comparison shopping dramatically easier. The results were mixed because consumers still had to take action themselves. AI agents potentially remove that final friction. If they begin negotiating phone bills, moving deposits toward higher-yielding accounts or routinely finding cheaper alternatives, they could attack what might be called inertial monopolies. That could ultimately be an important competitive, and disinflationary, force across the economy.</p>"}, {"id": "2026-09-22", "date": "2026-09-22", "source": "oaktree", "title_en": "Shall We Repeal the Laws of Economics – Part III", "title_zh": "能否废除经济学定律——第三部分", "author": "Howard Marks", "author_title": "橡树资本（Oaktree Capital）联合创始人 · 联席董事长", "url": "https://www.oaktreecapital.com/insights/memo/shall-we-repeal-the-laws-of-economics---part-iii", "body_zh": "<p>我在 2024 年 9 月和 2025 年 6 月写过两份备忘录，批评政府试图凌驾于经济学定律之上的做法。我的依据是一个坚定的信念：这样的尝试很可能既无效又有害。经济是自然运转的有机体，试图去操纵它会扭曲其运转，通常还会让整体结果变得更糟。有时这样做确有必要——为了阻止社会无法接受的结果，比如大面积贫困或失业——但应当有选择地、极其谨慎地进行。</p>\n\n<p>最好的类比来自自然界。电影《狮子王》里的一首歌描述了所谓的「生命之环」。这个环有它消极的一面——因为它通过「适者生存」这类机制运转——但它让整体保持着平衡。人类可以为了保护猎物而采取措施去压制某个捕食者，但这类干预会产生二阶效应，导致其他物种失控繁衍，把整个环境搅得失去平衡。让一个物种捕食另一个物种看起来或许残忍，但人类试图改善整体结果的做法，很容易带来意想不到的后果。这就引出了我想谈的话题：试图去支配市场的运行。</p>\n\n<p>最近的一次此类尝试，是针对长期利率近来持续上行这一事实而宣布的。8 月 17 日，30 年期美国国债收益率收于 5.3% 以上，创下 19 年新高。政府或央行可能希望遏制这波上行、把长期利率压下来，因为更高的利率往往会（a）抑制经济增长，（b）降低那些通常靠贷款支付的东西（比如汽车和住房）的可负担性，（c）增加联邦债务的偿债成本（联邦债务最近已达到惊人的 40 万亿美元），以及（d）暗示市场参与者信心流失。</p>\n\n<p>美联储无法像联邦公开市场委员会（FOMC）设定联邦基金利率目标区间那样直接设定长期利率——联邦基金利率对其他短期利率有着强烈影响。财政部同样不「设定」长期利率，但它可以通过发行和回购来影响长期利率。于是，8 月 19 日，财政部宣布将把长期国债回购的单次最大规模至少翻倍，从每次 20 亿美元提高到 40 亿美元，并称此举意在为更长期限证券提供更强的流动性支持。次日，财政部长斯科特·贝森特（Scott Bessent）表示愿意做得更多——近乎一种「不惜一切代价」的承诺。在其他条件不变的情况下，买得越多，债券价格就越高，而债券价格越高意味着收益率越低。公告发布后长期利率应声回落，但第二天就反弹了回去。</p>\n\n<h3>这能解决问题吗？</h3>\n\n<p><strong>我把这一行动视为试图在表面上改善利率图景。它或许是对上述利率上行之影响的一种回应，但无法被称作解决了根本问题。</strong></p>\n\n<p><strong>第一，任何效果都可能是暂时的。</strong>在其他条件不变的情况下，你可以通过买入来抬高某样东西的价格，也可以通过卖出来压低某样东西的价格。但你行动的影响可能是短暂的，一旦你停下来，市场很可能回到你不干预时本会呈现的样子。我想象的是海洋中的一柱水。只要水柱持续上涌，它就能让一个球悬停在水面之上。但一旦停止向上喷水，球就会落下。</p>\n\n<p>8 月 24 日，投资者斯坦利·德鲁肯米勒（Stanley Druckenmiller）在《华尔街日报》发表评论文章，回应贝森特的公告。下面是我从他文中摘出的几段我特别欣赏的话：</p>\n\n<blockquote>人为压低收益率的每一个基点，都是对拖延的一种补贴。……这场操作每省下几个基点，都要在拖延中付出数倍的代价。……逆基本面而行、试图守住价格的政府，最终总会输。唯一的变量是他们在认输之前会花掉多少钱。</blockquote>\n\n<p>德鲁肯米勒所言不虚，因为他曾参与构思了史上最著名的宏观交易。1992 年，他负责乔治·索罗斯量子基金的日常运作，当时该基金成功做空英格兰银行逆基本面支撑英镑的能力。据报道，那笔交易为基金赚了约 10 亿美元——在那个年代，10 亿美元是实打实的大钱。</p>\n\n<p><strong>第二，它并没有直接回应利率上行背后的根源问题。</strong>财政部所不乐见的利率上行，并非无端发生的随机现象。可能的推动因素包括以下几点：</p>\n\n<ul>\n<li><strong>通胀顽固地高于理想水平</strong>（例如，7 月 PCE 通胀为 3.7%，而美联储的长期目标为 2%）；这是美联储上周上调基准利率的首要原因。与伊朗战争相关的高企油价，也威胁着让通胀维持在高位。由于通胀会随时间侵蚀货币的购买力，购买长期工具的投资者会要求收益率中纳入一个通胀保护成分，以保护他们未来收回资金时的购买力。</li>\n<li><strong>美国表现出对财政纪律的完全缺失。</strong>得益于美元作为世界储备货币的地位，美国拥有了一张我称之为「金色信用卡」的东西——没有信用额度上限、账单永远不到、利率极低。但美国用卡并不明智。一百年前，约翰·梅纳德·凯恩斯是赤字开支的坚定倡导者（事实上，赤字开支与「凯恩斯经济学」紧密联系在一起）。他主张在经济放缓时期通过赤字来刺激就业，等经济恢复增长后再偿还由此产生的债务。而今天，美国在繁荣时期仍在制造巨额赤字，我们听不到任何关于平衡预算的讨论（实际上连预算本身都很少提及）。<strong>还要注意，巨额赤字可能是通胀性的，尤其是在经济接近满负荷运转时，因为政府通过支出注入流动性的量，超过了它通过税收抽走的量。</strong>这部分新增的流动性刺激了总需求，从而刺激了经济增长，也推高了通胀，进而加剧了上面描述的问题。</li>\n</ul>\n\n<p>如今的赤字规模约为 GDP 的 6%，对于一个失业率仅 4%、正处繁荣期的经济体来说，这是一个极高的水平。今年的净利息支出预计超过 1 万亿美元，超过国防预算，而且如果债务继续以快于 GDP 的速度增长，这一数字还将迅速攀升。（倘若利率在此基础上进一步上行呢？）这种挥霍无度带来了一个可能：那张信用卡或许会被收走，或者至少受到某种限制。最直接的后果将是美国国债利率上升。这会抬高偿债成本、进一步扩大赤字，让财政纪律缺失所引发的负向螺旋周而复始。</p>\n\n<ul>\n<li>财政部的回购由它的一般现金资源出资，而这些资源最终要靠增发来补充。如果增加长期债券回购的同时伴随着更大规模的短期国库券（T-bill）发行，这些交易并不会改变我们的总体债务水平，但会缩短我们债务的期限结构，导致需要更频繁地以届时通行的利率进行再融资。这似乎不太可能增强人们对我国财政图景的信心。</li>\n<li>为巨额联邦赤字融资的需求，叠加在美国经济增长所伴随的常规资本需求之上，再加上数万亿美元的 AI 投资。三者叠加的结果，是对债务和权益资本的强劲需求。经济学最朴素的规律是：对某样东西的需求上升，其价格就会上涨。<strong>因此，这种日益增长的资本需求对「货币的价格」——也就是利率——构成上行压力，是完全可以理解的。</strong></li>\n</ul>\n\n<p>展望未来，AI 的建设很可能耗资数万亿美元，麦肯锡公司估计，到 2030 年全球仅在直接与 AI 相关的数据中心上就将投入超过 5 万亿美元。其中相当一部分可能要靠借债，但即便是通过出售股票筹得的部分，也会从可用的总资本供给中抽取，从而影响债券为吸引投资者而必须支付的利率。与此同时，财政部在弥补年度赤字的同时，还必须为巨量到期证券进行再融资。其发行的大部分仅仅是滚动到期债务，但约 2 万亿美元的新增净发行量将增加投资者必须消化的供给，对收益率构成上行压力，<strong>这也说明利率短期内下降的可能性不大。</strong></p>\n\n<p>据《金融时报》8 月 22 日报道，「贝森特周四辩称，『收益率并未反映潜在的基本面』，他提到了伊朗战争的影响以及 30 年期国债市场『非常差』的流动性。」<strong>相反，我认为美国长期债券收益率恰恰反映了如上所述的基本面。</strong></p>\n\n<p><strong>第三，我认为财政部/美联储公告的影响在相当大程度上往往只是心理层面的，</strong>旨在制造某种反应（就像这一次制造了一天的反应）。但它们的效力会随时间消退，尤其是如果没有把注意力放到根源问题上时。这一回合的结论是：市场似乎并不买账。请看 Evercore ISI 在 9 月 9 日发布的一份简报：</p>\n\n<blockquote>今天上午 11 点，是财长贝森特加码版「扭曲操作」回购的首轮揭晓时刻。财政部周四宣布将回购操作的最大规模增至三倍，从 20 亿美元提高到 60 亿美元——超过了 8 月承诺的「至少 40 亿美元」。但市场显得不为所动，截至发稿时收益率还在走高。</blockquote>\n\n<p><strong>目标不应该是把利率压下去，而应该是回应那些推高利率的因素。</strong>靠买债券来强行压低利率，就像医生给发烧的病人敷冰袋。冰袋也许能降低病人的体温，但在发烧的根源被处理掉之前，病人不太可能真正痊愈。</p>\n\n<h3>债务是问题吗？</h3>\n\n<p>我经常被问到这个问题，而它确实很难想清楚。<strong>一方面，直白地说，美国不可能永远入不敷出地花钱，这看起来并不合理。</strong>正如经济学家赫伯特·斯坦（Herbert Stein）曾说过的：「如果一件事不可能永远持续下去，它就会停下来。」你无法反驳这一点！</p>\n\n<p><strong>但另一方面，又很难想出究竟是什么会让美国无法通过继续举债来为赤字融资。</strong>虽然当时的候选人特朗普在 2016 年总统竞选期间，最初就美国债务问题发表过一些含糊其辞、关于「做笔交易」的言论，但我认为美国按计划还不上债的概率并不高。我们为什么要违约呢？毕竟我们的债务是以美国自己发行的货币计价的。我年轻时收藏过一张 20 世纪 20 年代初魏玛共和国的 1000 马克纸币，上面被加印了「一百万马克」的字样。德国背负着来自一战债务和赔款的沉重财政义务，印钞帮助它弥补赤字，却也助推了货币的崩溃。</p>\n\n<p>只要美元还是世界主要的储备货币——2025 年它参与了 89% 的外汇交易，2026 年第一季度占已分配官方储备的 57%——我们就似乎有可能继续用自己的货币为赤字融资。「啊，」你会说，「但美元会不会失去储备地位呢？印太多美元会不会让它们变得不那么被接受？」这是个棘手的问题。我认为，世界需要安全、流动性好的储备货币，用来存储储备和进行国际交易。美元要失去主要储备货币的地位，必须有另一种货币或一组货币承担起更大的角色。十五年前，有人认为那可能是欧元。欧元至今仍是第二大储备货币，但并未缩小与美元的差距。后来，中国的进步似乎有望让人民币赢得储备地位。但人民币目前仅占已分配官方储备的约 2%，而资本管制和全球紧张局势让它的快速崛起变得不太可能。（不过，确实有一些关于中国、俄罗斯和伊朗要搞出一个美元替代品的讨论。）黄金在交易中并不被广泛使用——出于显而易见的原因，也不太可能被广泛使用——但据三菱日联银行（MUFG Bank）上周的一份报告，黄金最近已超越美元，成为全球央行最主要的储备资产。最后，加密货币在储备中只扮演着微不足道的角色。就目前而言，世界在很大程度上恐怕还是离不开美元。</p>\n\n<p>所以，美国很可能继续能够用美元做出名义上的偿付来偿还债务。这就引出了下一个问题：汇率会怎样？在其他条件不变的情况下，大量创造一种货币会降低它相对于「实物」和其他货币的价值。你可以轻松地把一张 1000 马克的纸币变成一张 100 万马克的纸币，但它很可能仍然只能买到一只山羊（正如我在 2008 年的备忘录《消极主义的极限》中所写）。事实上，那些思索美国将如何应对债务的人，谈论的是「货币贬值交易」：那些旨在让我们用购买力下降的美元来还债的行动——也就是说，用更少的山羊来结账。</p>\n\n<p>正如《金融时报》8 月 22 日所写：</p>\n\n<blockquote>财政部压低债券收益率的新尝试是一个信号：与其节制开支，美国更愿意扭曲市场来为借贷成本封顶，哪怕这会导致其货币贬值。这让美元作为避险资产的地位面临更多质疑。</blockquote>\n\n<p>这类行动可能适得其反，因为它们让人们担心将来用于偿还他们的美元购买力，从而要求对新的美元债务索取更高的利率。</p>\n\n<p>需要说明的是，我在 2008 年提到那张被加印的魏玛纸币，是出于对当时为把我们拉出全球金融危机而创造的大量央行流动性的担忧。包括我在内的许多人都担心，这可能会让美元相对其他货币走弱，或导致通胀加速。但美元并未对主要货币持续贬值，持续的恶性通胀也没有随之而来。</p>\n\n<p>2008 年美联储资产负债表的扩张，是阻止一场似乎正在发生的世界金融体系崩溃所必需的审慎之举。（事实证明，它并没有让美元贬值；在我看来，它很大程度上抵消了全球金融危机造成的货币与信贷的毁灭。）而今天大规模的赤字融资，是为了应对我们自己制造的赤字。而且它发生在一个繁荣时期，因此会给总需求和通胀压力添砖加瓦。</p>\n\n<p>通常让沃伦·巴菲特来做结语是最好的，所以我就引用他在 2025 年 5 月伯克希尔·哈撒韦年度股东大会上的发言来结束这一节：</p>\n\n<blockquote>在美国，财政政策才是让我害怕的东西。……我们现在运行的财政赤字，从非常长的时期来看是不可持续的。……<strong>我们不知道这意味着两年还是二十年</strong>，因为从来没有出现过像美国这样的国家。（粗体为笔者所加。）</blockquote>\n\n<h3>有解决办法吗？</h3>\n\n<p><strong>眼下的问题不是一个猜测问题……只是数学问题。我们的支出超过了收入；我们的债务相对 GDP 在增加；我们的利息账单在迅速增长。</strong>这是一个酝酿已久、早已被认清、也早已被警示的问题，如今似乎开始反噬。它不会自动修复，而且到目前为止，还没有人挺身而出去解决它。一个急性问题（比如国债拍卖流拍或买家抵制）似乎不太可能出现。但代价是慢性的，而且已经在被支付。正如德鲁肯米勒在《华尔街日报》所写：「如果 30 年期国债必须以 5.5% 的收益率才能出清，那这不是危机，而是一张账单。」我们要么支付它——无论它涨到多少——要么就得解决根本问题。</p>\n\n<p>如果一个人（或一个国家）入不敷出地过日子，唯一真正的长期解决办法就是：改变行为。唯一的希望在于做到以下几点：</p>\n\n<ul>\n<li>忘掉「削减债务」或「还清债务」这类说法</li>\n<li>接受一个事实：我们未来的债务不太可能比现在更少</li>\n<li>承担起财政责任——开始关心预算及其影响</li>\n<li>拉平曲线（借用了新冠疫情期间的说法）</li>\n<li>通过提高所得税税率（尤其是高端税率，目前联邦最高边际税率相对战后大部分时期都相当低）和取消税收优惠，来提高财政收入占 GDP 的比重</li>\n<li>通过秉持「资源是有限的」这一理念所要求的纪律，让支出增速低于 GDP 增速</li>\n</ul>\n\n<p><strong>还有一件事可能有所帮助。在其他条件不变的情况下，提高 GDP 增速既能增加税收，又能相对 GDP 降低总支出。实现这一点的最佳途径是提高生产率，</strong>而这可以通过以下组合来推进：（a）扎实的经济增长，（b）越来越多地使用 AI——它比任何东西都更像一个生产率工具，以及（c）有利于商业的政策，减少那些损害效率的多余监管。不过，最后一个要素至关重要：我们必须让新增的收入不被花掉。</p>\n\n<p><strong>如果我们做到这些，年度赤字占 GDP 的比重应该会缩小，年度债务增量应该会更小，债务占 GDP 的比率也可能下降。</strong>我认为这是我们能指望的最好结果。很少有人会对我上面描述的所有内容都满意（比如，没人喜欢多交税），但一个不愿削减开支的国家，就必须在收入上想办法。我真诚地怀疑是否还有别的解决办法。</p>\n\n<h3>与此同时该怎么做？</h3>\n\n<p>在等待华盛顿解决这个问题的同时，我们的投资组合该怎么做？这是我的一位朋友上个月问我的问题——他不是投资专业人士，而是一位全国知名的企业家。<strong>「我该卖掉我的股票吗？」</strong></p>\n\n<p>我告诉他，这不是答案。<strong>我们面临的问题，不是美国股市的问题，也不是美国公司的问题。它是美国财政管理的问题，最终可能是美元的问题。</strong>如果你卖掉美国股票，你的钱放哪儿？银行？货币市场基金？债券？如果它们都是以美元计价的，那你并没有逃脱这里讨论的风险。如果美国的坏习惯最终反噬其身，投资者对美国国债越来越不满意，那很可能通过看低美元的方式表现出来。如果你想对这个风险做点什么，你可能不得不转向（a）以美元以外货币计价的资产，（b）非金融资产，比如黄金或美国以外的房地产，或者（c）美国以外的公司或加密货币。</p>\n\n<p>但转向非美元或非美国资产会引入其他风险。发达世界其他地方的许多公司，增长前景不如美国龙头公司，规模也更小（因而规模经济也更少），而且许多公司所处的司法辖区监管更严、对商业更不友好。新兴市场的公司往往看起来有不错的增长潜力，但兑现这种潜力却要不确定得多。到目前为止，大多数机构投资者都大量配置于美国，并且取得了巨大成功，而这样做背后的原因——自由市场体制、亲商环境、经济活力、创新与适应精神、技术与管理的专业能力、法治、适度的监管、优质的高等教育、强大的资本市场——在很大程度上依然完好。在我看来，没有任何其他国家能在同等程度上拥有这些东西。<strong>把钱从美国撤出会带来风险，很容易让这一步以失败告终，尤其是当这么做只是为了规避一个其清算可能还很遥远的问题时。</strong>（而且我不想给人留下只有美国在赤字的印象。如果你从美元资产转向另一种也可能贬值的货币，那你又达到了什么目的呢？）</p>\n\n<p>这并不是说我完全反对分散配置、减持美元。对于有非美元需求、目标或愿景的投资者来说，少持有一些以美元计价的资产或许是合理的。但由于上述原因，我不认为应该大规模地这么做。</p>\n\n<hr>\n\n<p><strong>结论：你不能无视经济学定律，还指望自己能笑到最后。我认为美国不可能永远入不敷出地花钱，却不料想其信用会被质疑、其借条——它的货币和国债——会被轻慢。</strong>这不是一个投资问题，而是一个政治问题，但它给投资者提出了难题。卖出美元资产未必是答案。不太可能有人会卖出足够多的美元资产来消除这个问题，而且这么做很容易在很长一段时间里看起来像个大错（因为没有人知道这个问题会不会爆发、何时爆发）。潜在的解决办法只有一个。我们愿意正视这个问题并采取行动吗？</p>", "body_en": "<p>In September 2024 and June 2025, I wrote memos that were critical of governments' attempts to override the laws of economics, based on my conviction that trying to do so is likely to prove ineffective and potentially harmful. Economies are naturally functioning organisms, and trying to steer them will distort their functioning and, usually, worsen the overall result. Sometimes doing so is necessary to prevent outcomes society deems unacceptable, such as widespread poverty or unemployment, but it should be done selectively and with great caution.</p>\n\n<p>The best analogy is to nature. There's a \"Circle of Life,\" as described by a song in the movie <em>The Lion King</em>. The Circle has negative aspects &ndash; since it works through processes such as \"survival of the fittest\" &ndash; but it keeps the whole in balance. Humans can take steps to suppress a predator for the protection of prey, but interventions of this kind can have second-order effects, causing other species to grow out of control and throwing the overall environment out of balance. Having one species prey upon another may seem unkind, but human efforts to improve the overall result can easily produce unintended consequences. And that leads me to efforts to dictate the operation of markets.</p>\n\n<p>The latest such attempt was announced in response to the fact that long-term interest rates have been rising of late. On August 17, the yield on the 30-year U.S. Treasury bond closed at over 5.3%, then a 19-year high. A government or central bank might want to stem the rise and bring about lower long-term rates since higher ones tend to (a) depress economic growth, (b) reduce the affordability of things that are usually paid for through loans (like cars and houses), (c) increase the cost of servicing the federal debt (which has recently reached an astounding $40 trillion), and (d) suggest a loss of confidence among market participants.</p>\n\n<p>The Federal Reserve can't directly set long-term rates the way the Federal Open Market Committee sets a target range for the federal funds rate, which strongly influences other short-term rates. The Treasury doesn't \"set\" long-term rates either, but it can influence them through issuance and buybacks. Thus, on August 19, in a move it described as intended to provide greater liquidity support in longer-dated securities, the Treasury announced it would at least double the maximum size of its long-dated buybacks, from $2 billion per operation to $4 billion. The next day, Treasury Secretary Scott Bessent indicated a willingness to do more &ndash; something approaching a \"whatever-it-takes\" promise. All else equal, more buying should result in higher bond prices, and higher bond prices mean lower bond yields. Long rates declined immediately after the announcement, but they bounced back the next day.</p>\n\n<h3>Will It Solve the Problem?</h3>\n\n<p><strong>I view this action as an attempt to improve the interest-rate picture cosmetically. It may constitute a response to the effects of rising rates enumerated above, but it can't be described as solving the underlying problem.</strong></p>\n\n<p><strong>First, any effect may be temporary.</strong> All else equal, you can raise the price of something by buying it, or you can make the price of something decline by selling it. But the impact of your actions may be fleeting, and once you stop, the market is likely to go back to doing what it would have done if you hadn't intervened. My vision is of a column of water in the ocean. Its upward thrust can keep a ball suspended above the surface for as long as it continues. But as soon as the water stops being pumped upward, the ball will fall.</p>\n\n<p>On August 24, investor Stanley Druckenmiller responded to Bessent's announcement with an opinion piece in <em>The Wall Street Journal</em>. Here are some of my favorite bits from what he wrote:</p>\n\n<blockquote>Every basis point of artificial yield suppression is a subsidy to procrastination. . . . Whatever this operation saves in basis points, it will cost multiples in delay. . . . Governments defending prices against fundamentals always lose. The only variable is how much they spend before conceding.</blockquote>\n\n<p>Druckenmiller knows what he's talking about, as he helped conceive the most famous macro trade in history. He was running George Soros's Quantum Fund on a day-to-day basis in 1992, when it successfully bet against the Bank of England's ability to support the pound in contravention of fundamentals. That trade reportedly earned the fund about $1 billion, at a time when $1 billion was real money.</p>\n\n<p><strong>Second, it doesn't directly respond to the issues at the root of the rate rise.</strong> The increase in rates that the Treasury finds undesirable isn't a random phenomenon that's occurring for no reason. Among the likely contributors are these:</p>\n\n<ul>\n<li><strong>Inflation is stubbornly higher than is desirable</strong> (for example, PCE inflation was 3.7% in July versus the Fed's long-term target of 2%); this is the primary reason why the Federal Reserve raised its benchmark interest rate last week. Elevated oil prices associated with the war with Iran threaten to keep inflation high. Because inflation reduces the purchasing power of currencies over time, investors buying long-term instruments demand that yields incorporate an inflation-protection component to protect the purchasing power of the money with which they'll be repaid.</li>\n<li><strong>The U.S. displays a total lack of fiscal discipline.</strong> Thanks to the dollar's position as the world's reserve currency, the U.S. has had what I call a \"golden credit card\" on which there's no credit limit, the bill never comes, and the interest rate is extremely low. But it uses the card unwisely. John Maynard Keynes was a strong advocate of deficit spending a hundred years ago (in fact, deficit spending is closely identified with \"Keynesian economics\"). He advocated running deficits during economic slowdowns to spur employment, repaying the resulting debt when the economy returns to growth. Today, the U.S. is incurring massive deficits during prosperity, and we hear no talk of balanced budgets (and really of budgets at all). <strong>And note that large deficits can be inflationary, especially when the economy is operating near capacity, since the government adds more to liquidity through its spending than it withdraws through taxes.</strong> This incremental liquidity stimulates aggregate demand and thus economic growth, adds to inflation, and thus exacerbates the problem described above.</li>\n</ul>\n\n<p>Today's deficit is in the vicinity of 6% of GDP, an extraordinarily high level for an economy enjoying prosperity with unemployment of only 4%. Net interest outlays are projected at more than $1 trillion this year, more than the defense budget, and they will rise rapidly if the debt continues to grow faster than GDP. (And what if interest rates rise further from here?) This profligacy raises the possibility that the credit card may be taken away or at least be limited in some way. The immediate consequence would be higher interest rates on U.S. debt. This would increase the cost of servicing the debt and further expand the deficit, perpetuating the negative spiral caused by the lack of fiscal discipline.</p>\n\n<ul>\n<li>Treasury buybacks are financed from its general cash resources, which ultimately are replenished through additional issuance. To the extent increased long-term-bond buybacks are accompanied by greater T-bill issuance, the transactions don't change our overall indebtedness, but they shorten the maturity pattern of our debt, necessitating more frequent refunding at whatever rates prevail. This doesn't seem likely to bolster confidence in our fiscal picture.</li>\n<li>The need to fund the massive federal deficits comes on top of the routine need for capital that accompanies the growth of the U.S. economy, and to that is added the multi-trillion-dollar investment in AI. The result of this combination is strong demand for debt and equity capital. The simplest rule of economics is that increased demand for something causes its price to rise. <strong>It's entirely understandable, therefore, that this growing demand for capital should put upward pressure on the price of money: interest rates.</strong></li>\n</ul>\n\n<p>Looking ahead, the AI buildout is likely to cost trillions of dollars, with McKinsey &amp; Company estimating that over $5 trillion will be spent worldwide through 2030 on data centers directly related to AI. A fair bit of this will probably be borrowed, but even that which comes from the sale of equity will draw from the total supply of available capital, affecting the interest rates bonds must pay to attract investors. At the same time, the Treasury will have to refinance an enormous volume of maturing securities while financing the annual deficits. Most of its issuance will merely roll maturing debt, but the new net issuance of roughly $2 trillion will add to the supply investors must absorb, putting upward pressure on yields and <strong>arguing against the likelihood of a decline in interest rates anytime soon.</strong></p>\n\n<p>According to <em>The Financial Times</em> of August 22, \"Bessent argued on Thursday that 'yields don't reflect the underlying fundamentals,' citing the effect of the Iran war and 'very poor' liquidity in the 30-year Treasury market.\" <strong>On the contrary, I think U.S. long-term bond yields are reflecting the fundamentals as described above.</strong></p>\n\n<p><strong>Third, I think the impact of Treasury/Fed announcements is often largely psychological,</strong> designed to produce a certain reaction (as this one did for a day). But their influence can wane over time, especially if not backed up with attention to root causes. The bottom line regarding this go-round is that the market doesn't seem to be impressed. See the following note issued by Evercore ISI on September 9:</p>\n\n<blockquote>Today at 11 AM was the big reveal for the first round of Treasury Secretary Bessent's ramped up \"Treasury Twist\" buybacks. Treasury announced a tripling in the maximum size of the buyback operation on Thursday from $2bn to $6bn &ndash; more than the \"at least $4bn\" promised in August. But markets look underwhelmed with yields at the time of writing moving higher.</blockquote>\n\n<p><strong>The goal shouldn't be to get interest rates down. It should be to respond to the factors pushing rates up.</strong> Forcing rates down by buying bonds is like a doctor applying an ice pack to a patient with a fever. The ice pack may lower the patient's temperature, but the patient isn't likely to get healthy until the underlying cause of the fever has been dealt with.</p>\n\n<h3>Is the Debt a Problem?</h3>\n\n<p>I get this question a lot, and it can be hard to get one's head around it. <strong>On one hand, simply put, it doesn't seem reasonable that the U.S. can continue forever to spend more than it brings in.</strong> And as economist Herbert Stein once said, \"If it can't go on forever, it will stop.\" You can't argue with that!</p>\n\n<p><strong>But on the other hand, it's hard to figure out what will render the U.S. unable to continue financing deficits by adding to its debt.</strong> While then-candidate Donald Trump initially made some ambiguous comments about making a deal on U.S. debt during the 2016 presidential campaign, I don't think there's a serious probability the U.S. will fail to repay debt as scheduled. Why would we, since our debt is denominated in a currency the U.S. issues? When I was young, I had a 1,000 mark note from the Weimar Republic of the early 1920s that had been overprinted \"One Million Marks.\" Germany had large fiscal obligations stemming from World War I debts and reparations, and money creation helped finance its deficits but contributed to the currency's collapse.</p>\n\n<p>As long as the dollar is the world's main reserve currency &ndash; it was involved in 89% of foreign exchange transactions in 2025 and accounted for 57% of allocated official reserves in the first quarter of 2026 &ndash; it seems likely we'll be able to continue financing deficits in our own currency. \"Ah,\" you say, \"but might the dollar lose its reserve status? Will printing too many dollars render them less accepted?\" That's a tough question. I think the world needs safe, liquid reserve currencies for storing reserves and engaging in international transactions. For the U.S. dollar not to be the main reserve currency, another currency or group of currencies would have to take a larger role. Fifteen years ago, some thought that could be the euro. It remains the second-largest reserve currency, but it hasn't closed the gap with the dollar. Later, China's progress seemed capable of winning reserve status for the renminbi. But it still accounts for only about 2% of allocated official reserves, and capital controls and global tensions make a rapid ascent unlikely. (There is, however, some talk of China, Russia, and Iran coming up with an alternative to the dollar.) Gold isn't widely used in transactions &ndash; nor is it likely to be for obvious reasons &ndash; but according to a note last week from MUFG Bank, it recently surpassed the dollar as the world's leading central bank reserve asset. Lastly, cryptocurrency plays only a negligible reserve role. For the most part, the world is probably stuck with the dollar for now.</p>\n\n<p>So, the U.S. is likely to continue being able to make nominal payments in dollars to service its debt. That brings us to the next question: what will happen to exchange rates? Creating large amounts of a currency can, all else equal, reduce its value relative to \"things\" and other currencies. You can easily turn a 1,000 mark note into a 1,000,000 mark note, but it's likely to still buy just one goat (as I wrote in my memo <em>The Limits to Negativism</em> in 2008). In fact, people who ponder what the U.S. will do about the debt are talking about \"the debasement trade\": actions designed to let us pay our debts using dollars with reduced purchasing power &ndash; i.e., by forking over fewer goats.</p>\n\n<p>As <em>The Financial Times</em> wrote on August 22:</p>\n\n<blockquote>The Treasury's new attempt to depress bond yields is a signal that rather than tame spending, the US is prepared to distort markets to cap borrowing costs, even if that causes its currency to fall. That raises more questions about the dollar as a haven.</blockquote>\n\n<p>Such actions can be self-defeating because they make people worry about the purchasing power of the dollars with which they'll be repaid, which makes them demand higher interest rates on new dollar debt.</p>\n\n<p>Note that my 2008 mention of the overprinted Weimar note was occasioned by concern over the large amounts of central-bank liquidity that were being created to pull us out of the Global Financial Crisis. A lot of people, including me, were worried that it could weaken the dollar relative to other currencies or cause inflation to accelerate. But the dollar was not durably debased against major currencies, and sustained high inflation did not follow.</p>\n\n<p>The expansion of the Fed's balance sheet in 2008 was a necessary and prudent step to stop a meltdown of the world financial system that appeared to be underway. (As it turned out, it didn't debase the dollar; in my view, it largely offset the destruction of money and credit brought about by the Global Financial Crisis.) Today's massive deficit financing is being done in response to deficits of our own making. And it's taking place in a time of prosperity, so it can add to aggregate demand and inflation pressure.</p>\n\n<p>It's often best to let Warren Buffett have the last word, so I'll close this section by quoting from his remarks at the May 2025 Berkshire Hathaway annual meeting:</p>\n\n<blockquote>Fiscal policy is what scares me in the United States. . . . We're operating at a fiscal deficit now that is unsustainable over a very long period of time. . . . <strong>We don't know whether that means two years or 20 years</strong>, because there's never been a country like the United States. (Emphasis added.)</blockquote>\n\n<h3>Is There a Solution?</h3>\n\n<p><strong>The issue at hand isn't a matter of conjecture . . . just math. We're spending more than we're taking in; we're increasing our debt relative to our GDP; and our interest bill is growing rapidly.</strong> This is a problem long in the making, long recognized, and long warned about, which now seems to be starting to bite. It won't get fixed of its own accord, and so far, no one has stepped up to fix it. An acute problem (a failed Treasury auction or buyers' strike) seems improbable. But the cost is chronic and already being imposed. As Druckenmiller wrote in the <em>WSJ</em>, \"If the 30-year must trade at 5.5% to clear, that isn't a crisis. It is an invoice.\" We either must pay it &ndash; whatever it grows to &ndash; or we must fix the underlying problem.</p>\n\n<p>If a person (or a country) is living beyond their means, there's only one genuine, long-term solution: change behavior. The only hope lies in doing the following:</p>\n\n<ul>\n<li>Forget phrases like \"pay down the debt\" or \"pay off the debt\"</li>\n<li>Accept that we're unlikely to ever have less debt than we do now</li>\n<li>Adopt fiscal responsibility &ndash; start caring about budgets and their impact</li>\n<li>Flatten the curve (a phrase from the Covid-19 pandemic)</li>\n<li>Increase revenues as a percentage of GDP through higher income tax rates (especially at the upper end, where the top federal marginal rate is quite low relative to much of the postwar period) and elimination of tax preferences</li>\n<li>Hold the rate of growth in spending below GDP growth by applying the discipline that comes with thinking of resources as finite</li>\n</ul>\n\n<p><strong>There's one more thing that could help. All else being equal, raising the rate of GDP growth would both increase tax revenues and reduce total spending relative to GDP. The best way to accomplish this would be through increased productivity</strong>, which could be advanced through the combination of (a) solid economic growth, (b) increasing use of AI, which more than anything else is a productivity tool, and (c) pro-business policies that reduce unneeded regulation that impairs efficiency. A final element is essential, however: we'll have to keep the added revenue from being spent.</p>\n\n<p><strong>If we do these things, annual deficits should shrink as a percentage of GDP, the annual increase in debt should be smaller, and the debt-to-GDP ratio could decline.</strong> I think that's the best we can hope for. Few people will be happy with all the components I describe above (e.g., no one likes to pay higher taxes), but a country that won't cut spending has to look at revenue. I sincerely doubt there's another solution available.</p>\n\n<h3>What to Do in the Meantime</h3>\n\n<p>While we're waiting for Washington to solve the problem, what should we do in our portfolios? That's what a friend of mine &ndash; not an investment professional, but a nationally known entrepreneur &ndash; asked me last month. <strong>\"Should I sell my stocks?\"</strong></p>\n\n<p>That's not the answer, I told him. <strong>The problem we face isn't a problem with the U.S. stock market or with U.S. companies. It's a problem with U.S. fiscal management, and ultimately a potential problem with the U.S. dollar.</strong> If you sell your U.S. stocks, where will you put your money? A bank? A money market fund? Bonds? If they're denominated in dollars, you haven't escaped the risk under discussion here. If the U.S.'s bad habits catch up with it and investors become less happy with U.S. Treasurys, that's likely to manifest itself through a lower opinion of the dollar. If you want to do something about that risk, you may have to move into (a) assets denominated in currencies other than the dollar, (b) non-financial assets, such as gold or non-U.S. real estate, or (c) non-U.S. companies or cryptocurrencies.</p>\n\n<p>But moving into non-dollar or non-U.S. assets introduces other risks. Many companies elsewhere in the developed world have poorer growth prospects than leading U.S. companies and less scale (and thus fewer economies of scale), and many operate in jurisdictions that are more highly regulated and less business-friendly. Companies in emerging markets often appear to have good growth potential, but realizing it is much more uncertain. Most institutional investors have been heavily allocated to the U.S. to date, with great success, and the reasons for that &ndash; the free-market system, pro-business climate, economic vitality, spirit of innovation and adaptability, technological and managerial expertise, rule of law, moderate regulation, excellent higher education, strong capital markets &ndash; largely remain intact. In my opinion, no other country possesses these things to the same extent. <strong>Taking money out of the U.S. entails risks that could easily render it unsuccessful, especially if it's done to avoid a problem whose reckoning may be so far off.</strong> (And I don't want to give the impression that only the U.S. is running deficits. If you move out of dollar assets and into another currency that's subject to debasement, what have you accomplished?)</p>\n\n<p>That's not to say I flatly oppose diversification away from the dollar. For investors with non-dollar needs, goals, or aspirations, it may make sense to own fewer dollar-denominated assets. But I don't think it should be done on a great scale for the reasons described above.</p>\n\n<hr>\n\n<p><strong>The bottom line: you can't ignore the laws of economics and expect to come out ahead. I don't think the U.S. can perpetually spend more than it takes in and not expect its creditworthiness to be questioned and its IOUs &ndash; its currency and Treasury securities &ndash; to be disrespected.</strong> This isn't an investment problem. It's a political problem, but it poses a problem for investors. Selling dollar assets may not be the answer. No one's likely to do enough of it to eliminate the issue, and doing so could easily look like a big mistake for a very long time (since no one knows whether or when the issue will come to a head). There's just one potential solution. Will we face up to the problem and take action?</p>"}, {"id": "2026-09-21", "date": "2026-09-21", "source": "siegel", "title_en": "Higher Rates Test Stocks, But Growth Endures", "title_zh": "利率走高考验股市，但增长韧性仍在", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>美联储如期落地了市场普遍预期的 25 个基点加息，但整体信息比预期更偏鹰派。决议获得一致通过，新的点阵图指向今年还会再加息一次。四位与会者显然认为在剩余每次会议上都有加息的可能，因此联邦公开市场委员会（FOMC）中明显存在一股举足轻重的鹰派力量。主席沃什在新闻发布会上讲话不多，但他的信息很明确：经济增长依然非常强劲，通胀尚未取得足够进展，美联储准备对两者同时加以抑制。</p><p>经济的强劲已越来越难以忽视。最新零售销售报告尤其强劲，其中对照组数据推高了三季度 GDP 预估。美联储上调了增长预测，并把年底失业率预期从 4.3% 下调至 4.1%。增长更强叠加通胀持续，正好解释了沃什为何愿意收紧政策。现在最有趣的问题是，下一次加息会落在 10 月还是 12 月。我的预期是 12 月。在中期选举前夕加息会招致不必要的政治争议，除非数据明显转热，否则美联储没有理由这么做。</p><p>对股票而言，长端债券甚至比联邦基金利率更重要。股票是长久期资产，而 10 年期美债收益率约为 5%、10 年期 TIPS（通胀保值债券）实际收益率接近 2.6%，对股票构成了实实在在的竞争。20 倍市盈率大致对应约 5% 的实际盈利收益率，这意味着股票相对 TIPS 的风险溢价约为 2.4 个百分点。这一溢价确实比实际债券收益率为负时投资者所习惯的水平要窄，但绝非史无前例。2000 年前后实际收益率曾超过 4%，而当时股票估值远比今天更为苛刻。</p><p>如果收益率稳定在 5% 以下，股市可以继续稳步上行。如果长端收益率明确升破 5%，股票继续上涨的难度就会大得多，尤其是在今年已经录得强劲涨幅之后。除非债券收益率回落、或能源价格面临的地缘政治压力开始缓解，否则我认为近期看不到推动股市明显上行的重大催化。</p><p>沃什把长端收益率的上行主要归因于强劲的经济增长、与 AI 相关的巨额投资与借贷，以及地缘政治带来的通胀压力。一个引人注目的遗漏是联邦预算赤字。大多数经济学家在讨论 10 年期美债为何逼近 5% 时，都会把赤字和不断膨胀的联邦利息支出列为推高收益率的重要因素。无论沃什的遗漏是有意还是无意，这一点都相当显眼。</p><p>高利率对整体经济的影响，与其对 AI 热潮的影响之间存在一个重要区别。大约 15 万亿美元的美元计价贷款直接或间接与短期利率挂钩。但我并不那么确信这些加息会实质性地拖累 AI 基础设施投资。事实上，AI 本身正在制造一种不同寻常的通胀冲动。在那些历史上技术进步一直带来价格持续下跌的领域，内存和半导体价格正在上涨。在科技产业链的某些环节，对算力的需求简直压倒了供给。</p><p>长期效应应当恰恰相反。AI 最终应能带来生产率提升，从而降低成本、提高实际产出。然而，我们尚未在生产率统计数据中清楚地看到这些收益。这让我想起罗伯特·索洛在 1980 年代计算机革命期间那句著名的观察：除了生产率统计之外，计算机无处不在。而不久之后，生产率便急剧加速。</p><p>最后，我将密切关注货币与信贷增长。存款增长和货币供应增长一直偏热，而沃什已表示货币总量指标对他很重要。更高的短期利率应当会降低家庭和企业的借贷意愿，并最终放缓信贷与货币增长。这是检验本轮紧缩是否奏效的最清晰标准之一。</p>", "body_en": "<p>The Federal Reserve delivered the 25-basis-point increase the markets had largely anticipated, but the overall message was somewhat more hawkish than expected. The decision was unanimous, and the new dot plot points to another rate increase this year. Four participants apparently see the possibility of raising rates at each remaining meeting, so there is clearly a meaningful hawkish contingent on the FOMC. Chairman Warsh said relatively little at the press conference, but his message was clear: economic growth remains very strong, inflation has not made sufficient progress, and the Fed is prepared to lean against both.</p><p>The strength of the economy is increasingly difficult to ignore. The latest retail sales report was particularly strong, with the control group pushing third-quarter GDP estimates higher. The Fed raised its growth forecast and lowered its year-end unemployment projection to 4.1% from 4.3%. That combination of stronger growth and persistent inflation explains why Warsh was willing to tighten policy. Now the most interesting question is whether October or December brings the next increase. My expectation is December. Raising rates just before the midterm election invites unnecessary political controversy, and the Fed has no need to do that unless the data become considerably hotter.</p><p>The long end of the bond is even more important for equities than the fed funds rate. Stocks are long-duration assets, and the 10-year Treasury yield around 5% and the 10-year TIPS yield near 2.6%, provide real competition for equities. A 20-times earnings multiple represents roughly a 5% real earnings yield, leaving an equity premium of about 2.4 percentage points over TIPS. That premium is certainly narrower than investors became accustomed to when real bond yields were negative, but it is hardly unprecedented. Real yields exceeded 4% around 2000 when equity valuations were considerably more demanding than they are today.</p><p>If yields stabilize below 5%, equities can continue to grind higher. If long-term yields decisively move above 5%, it becomes much more difficult for stocks to advance, particularly after the strong gains we have already seen this year. I do not see a major upside catalyst for equities over the immediate term unless bond yields retreat or the geopolitical pressure on energy prices begins to ease.</p><p>Warsh attributed the rise in long-term yields primarily to strong economic growth, enormous AI-related investment and borrowing, and geopolitical inflation pressures. One notable omission was the federal budget deficit. Most economists discussing why the 10-year Treasury is near 5% would include the deficit and growing federal interest expense among the important factors pushing yields higher. Whether Warsh's omission was intentional or not, it was striking.</p><p>There is also an important distinction between the impact of higher rates on the broader economy and their impact on the AI boom. Roughly $15 trillion of dollar-denominated loans are tied directly or indirectly to short-term rates. But I am less convinced that these rate hikes will materially derail AI infrastructure investment. In fact, AI itself is creating an unusual inflationary impulse. Memory and semiconductor prices are rising in areas where technological progress historically produced relentless price declines. Demand for computing power is simply overwhelming supply in parts of the technology complex.</p><p>The longer-term effect should be precisely the opposite. AI should eventually generate productivity gains that lower costs and increase real output. Yet we have not yet seen those gains clearly in the productivity statistics. This reminds me of Robert Solow's famous observation in the 1980s during the computer revolution that computers could be seen everywhere except in the productivity statistics. Shortly thereafter, productivity accelerated sharply.</p><p>Finally, I will be watching money and credit growth very closely. Deposit growth and money supply growth have been running hot, and Warsh has indicated that monetary aggregates matter to him. Higher short-term rates should reduce the willingness of households and businesses to borrow and eventually slow credit and money growth. That is one of the clearest tests of whether this tightening is working.</p>"}, {"id": "2026-09-14", "date": "2026-09-14", "source": "siegel", "title_en": "Higher Inflation Tests Fed and Markets", "title_zh": "通胀走高考验美联储与市场", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>最新公布的通胀数据让美联储跨过了一条重要门槛。核心 CPI 环比上涨 0.3%，单看涨幅不大，却已足以把期货市场对加息的预期推高至上周五早晨的 90% 左右。再加上信贷持续扩张、劳动力市场强劲和市场利率走高，我认为美联储很可能在本周会议上将联邦基金利率上调 25 个基点。</p><p>这将是凯文·沃什就任美联储主席以来面临的最艰难抉择。特朗普总统已明确表示希望降息，但美联储不能任由政治压力侵蚀其抗击通胀的信誉。市场本身正在发出强烈信号：两年期美债收益率已高出联邦基金利率约 100 个基点，而且两年期与十年期收益率曲线都指向短期利率应当更高。信贷扩张的速度也远超与 2% 通胀相一致的水平——这一点尤其值得注意，因为沃什在杰克逊霍尔讲话中特意把信贷增长列为他在重点观察的重要指标。</p><p>我预计是加息 25 个基点，而不是 50 个基点。事实上，我认为对市场而言更大的风险是美联储按兵不动。如果维持利率不变，沃什可能面临四五张反对票，这将引发对美联储信誉的质疑。相反，若投资者因此相信美联储遏制通胀的决心更加坚定，加息甚至可能带动长期收益率下行。</p><p>石油仍是最大的变数。WTI 已飙升突破 100 美元，柴油价格升破 6 美元且可能继续快速上行。围绕伊朗、霍尔木兹海峡以及胡塞武装袭扰的地缘政治风险依然巨大，这使能源价格成为未来数周通胀与市场最重要变量之一。</p><p>令我印象深刻的是，股市对这一切的消化相当从容。尽管通胀走高、油价高于近期水平、债券收益率大幅上行，标普 500 指数距离高点也只差几个百分点。经济仍在稳健运行：本月就业报告强劲，初请失业金人数保持低位，消费需求也没有出现实质性恶化。股票的韧性告诉我，市场上流动性充裕，对股票的底层需求真实存在。</p><p>不过，估值正面临更艰难的环境。10 年期 TIPS 实际收益率在 2.5% 左右，虽然远不及 2000 年科技泡沫顶部时期 4% 以上的水平，但已足以在没有新的利好催化的情况下对股票估值倍数构成挑战。财报季已接近尾声，未来三到四周股市横盘整理甚至走低，我不会感到意外。下一个重要催化剂是 10 月发布的三季报，目前几乎没有证据表明需求已弱化到会拖累又一个强劲财报季的程度。</p><p>本周三的会议或许能起到一次「出清」的效果。我的基准判断坚定地指向加息 25 个基点。如果美联储行动果断、油价企稳，市场就能越过当下的通胀与信誉之争，重新聚焦经济增长和 10 月财报。</p>", "body_en": "<p>The latest inflation report crossed an important threshold for the Federal Reserve. Core CPI rose 0.3% for the month but that was enough to push futures-market expectations for a rate increase to around 90% last Friday morning. Combined with continued credit expansion, a strong labor market and higher market interest rates, I believe the Fed is likely to raise the federal funds rate by 25 basis points at this week&rsquo;s meeting.</p><p>This will be the most difficult decision Kevin Warsh has faced since becoming Fed chair. President Trump has made clear that he wants lower rates, but the Fed cannot allow political pressure to undermine its inflation-fighting credibility. The market itself is sending a powerful signal. The two-year Treasury yield is roughly 100 basis points above the federal funds rate, and both the two-year and ten-year yield curves suggest that short-term rates should be higher. Credit expansion is also running well above a pace consistent with 2% inflation, particularly relevant because Warsh specifically identified credit growth as an important indicator that he is watching at his Jackson Hole speech.</p><p>I would expect a 25-basis-point increase, not 50. In fact, I believe the greater risk to the markets would be the Fed failing to act. Warsh could face four or five dissents if he holds rates unchanged, which would raise questions about the Fed&rsquo;s credibility. A rate hike could even bring long-term yields down if investors see the Fed as more committed to containing inflation.</p><p>Oil remains the critical wild card. WTI surged above $100, while diesel prices have moved above $6 and could continue rising rapidly. The geopolitical risks surrounding Iran, the Strait of Hormuz and disruptions involving the Houthis remain substantial, making energy prices one of the most important variables for both inflation and markets in the weeks ahead.</p><p>What impresses me is how well equities have absorbed all of this. The S&amp;P 500 is only a few percentage points below its high despite higher inflation, oil above recent levels and sharply higher bond yields. The economy continues to chug along: this month&rsquo;s employment report was strong, jobless claims remain low and there is still no meaningful deterioration in consumer demand. The resilience of stocks tells me there is considerable liquidity and underlying demand for equities.</p><p>Valuations, however, are facing a more difficult environment. Ten-year TIPS yields around 2.5% are nowhere near the 4%-plus real yields we saw around the technology peak in 2000, but they are high enough to challenge equity multiples without another positive catalyst. With the earnings season largely finished, I would not be surprised to see the equity market trade relatively flat or down over the next three or four weeks. The next major catalyst is third-quarter earnings in October, and there is little evidence today suggesting that demand has weakened enough to prevent another good earnings season.</p><p>This Wednesday could be something of a clearing event. My point estimate is firmly for a 25-basis-point hike. If the Fed acts decisively and oil stabilizes, markets can move beyond the immediate inflation and credibility debate and refocus on economic growth and October earnings.</p>"}, {"id": "2026-09-08", "date": "2026-09-08", "source": "siegel", "title_en": "Strong Jobs Data Raises Fed Pressure", "title_zh": "强劲就业数据令美联储承压", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>8月就业报告远强于预期，进一步印证了我的判断：美国经济依然极具韧性。非农就业新增16.2万人，高于所有市场预估，前两个月的数据还被上修了共5.5万人。每周工时增加0.1小时，家庭调查极为强劲，劳动参与率终于回升。薪资增速依然温和，同比仅3.1%。这几乎是人所能期望的最理想的就业组合。</p><p>就业的强劲确实会压低生产率统计的表现。我密切跟踪的各家预测均值显示，三季度 GDP 增速估计仍非常强劲，或许在3.5%左右。我原本希望，如此强劲的产出叠加极为克制的招聘，能再度带来生产率的大幅跃升，为人工智能已在推升全经济范围生产率提供清晰证据。但实际情况是就业和工作时长都在上升。生产率应该仍然可观，但本季度恐怕难以给出我此前预期的强劲生产率抬升。</p><p>这并不意味着 AI 失败了。高盛估计，采用 AI 的企业正获得约30%的生产率提升，与显示20%-30%区间的学术研究一致。但这些收益尚未转化为更高的利润率。竞争似乎正迫使企业把大部分好处通过更低的成本和价格让渡出去。长期看，这正是生产率惠及整体经济的应有方式：更低的通胀压力与更高的实际工资。重要的是，AI 引发就业末日论的证据几乎仍不存在。初请失业金人数仍处于20万出头的低位，归因于 AI 的裁员仍然有限，被替代的工人普遍能够较快找到新工作。</p><p>不过，经济的强劲确实让美联储的决策变得更复杂。就业报告发布后，市场对9月加息的预期显著上升，而我认为支持加息25个基点的经济理由是充分的。货币增速进一步强化了这一结论。伊朗战争爆发以来，M2 货币供应一直在以约10%的年化速度扩张，而此前数年大约为4%。这固然远不及疫情期间那种异常的货币扩张，但在信贷和货币如此快速扩张的情况下，很难把当前的货币环境称为紧缩。如果联邦基金利率真的具有限制性，借贷增速应当出现明显得多的放缓。</p><p>沃什主席面临的麻烦在政治层面。距离中期选举只剩两个月，加息将不可避免地招致政府的批评，尤其是因为更高的短期利率会直接传导至信用卡和汽车贷款利率。讽刺的是，如果投资者因此确信美联储对控制通胀是认真的，加息反而可能最终压低长期收益率。但政治观感已经相当棘手，特朗普已放话：不降息就上调关税！本周的生产者与消费者价格报告将极为关键，将决定美联储是否会顺着经济理由再度加息。</p><p>对股票而言，就业报告在基本面上是好消息，但股价对利率继续走高所能承受的幅度可能存在上限。更强的增长支撑盈利，但更高的债券收益率抬高了对这些盈利进行折现的贴现率。10年期美债收益率已升至4.8%附近，逼近后疫情通胀大战时期触及的5%水平。若持续站上5%，将构成股票市场的实质性难题，对债券更不用说。倒也可能有一线好处：足够高的长期利率或许终于会迫使华盛顿正视联邦赤字问题。</p><p>石油与地缘政治仍是最大的变数。尽管 WTI 价格走高，裂解价差却在回落，汽油期货显示零售端油价压力相对可控。但伊朗冲突与霍尔木兹海峡可能迅速改变这一盘算。股票市场的主要风险已不再是衰退，而是经济持续强劲、货币高速扩张与地缘政治压力三者叠加，令通胀和债券收益率高到足以迫使美联储、并最终迫使整个市场重新校准。</p>", "body_en": "<p>The August employment report was much stronger than expected and reinforces my view that the U.S. economy remains remarkably resilient. Payrolls increased by 162,000, above every estimate, while revisions added another 55,000 jobs to the previous two months. The workweek increased by one-tenth of an hour, the household survey was extremely strong, and the participation rate finally moved higher. Wage growth remains contained at just 3.1% year over year. This is about as favorable a labor mix as one could ask for.</p><p>The strength of employment does temper productivity statistics. Estimates for third-quarter GDP growth remain very strong, perhaps around 3.5% averaging forecasts that I watch closely. I hoped that such strong output accompanied by very modest hiring would produce another dramatic productivity gain and provide clear evidence that artificial intelligence is already lifting economy-wide productivity. Instead, employment and hours worked are rising. Productivity should still be respectable, but this quarter may not provide the strong productivity uptick I anticipated.</p><p>That does not mean AI is failing. Goldman Sachs estimates that businesses adopting AI are experiencing productivity improvements of roughly 30%, consistent with academic studies showing gains in the 20%-30% range. Yet these gains have not yet translated into higher profit margins. Competition appears to be forcing firms to pass much of the benefit through lower costs and prices. Over time, that is exactly how productivity should benefit the broader economy: lower inflationary pressure and higher real wages. Importantly, there remains virtually no evidence of an AI-driven employment apocalypse. Jobless claims remain in the low 200,000s, layoffs attributable to AI remain limited, and displaced workers generally appear able to find new employment quickly.</p><p>The stronger economy does, however, complicate the Federal Reserve&rsquo;s decision. Expectations for a September rate increase rose meaningfully following the employment report, and I believe the economic case for a 25-basis-point hike is strong. Money growth reinforces that conclusion. Since the beginning of the Iran war, M2 money supply has been expanding at roughly a 10% annualized rate, compared with approximately 4% for several years beforehand. This is nothing resembling the extraordinary monetary expansion during the pandemic, but it is difficult to characterize current monetary conditions as restrictive when credit and money are expanding this rapidly. If the federal funds rate were truly restrictive, borrowing should be slowing much more significantly.</p><p>The complication for Chair Warsh is political. With the midterm elections only two months away, raising rates would inevitably attract administration criticism, particularly because higher short-term rates feed directly into credit cards and auto loans. Ironically, a rate increase could ultimately lower longer-term yields if investors become convinced that the Fed is serious about controlling inflation. But the political optics are already difficult, as Trump has avowed to hike tariffs if rates are not decreased! This week&rsquo;s producer and consumer price reports will be extremely important in determining whether the Fed follows the economic case for another hike.</p><p>For equities, the employment report is fundamentally good news, but there could be a limit to how much higher interest rate stocks can absorb. Stronger growth supports earnings, but higher bond yields increase the discount rate applied to those earnings. The 10-year Treasury yield has moved toward 4.8%, approaching the 5% level reached during the battle against the post-pandemic inflation surge. A sustained move above 5% could become a meaningful problem for equities, and it would certainly be a problem for bonds. There could be one silver lining: sufficiently high long-term rates may finally force Washington to confront the federal deficit.</p><p>Oil and geopolitics remain the major wild cards. Despite higher WTI prices, crack spreads have declined and gasoline futures suggest relatively contained pressure on retail prices. But the Iran conflict and the Strait of Hormuz could quickly change that calculation. The principal risk to equities is no longer recession. It is that continued economic strength, rapid money growth and geopolitical pressure that keep inflation and bond yields high enough to force the Fed, and ultimately the market, to recalibrate.</p>"}, {"id": "2026-08-31", "date": "2026-08-31", "title_en": "Warsh Gets an A: Re-focused Fed on the Right Key Principles", "title_zh": "沃什得 A：美联储重新聚焦正确的关键原则", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>凯文·沃什在杰克逊霍尔的讲话明显偏鹰派。但听完之后，我对沃什的信心反而更强了，并认为这是我所听过的最好的美联储主席演讲之一。最重要的是，沃什正在重新聚焦美联储框架中缺失多年的因素：明确承认货币供应和银行信贷对美联储的通胀前景至关重要。在疫情期间美联储与政府应对导致货币供应出现前所未有的关键性激增时，杰罗姆·鲍威尔在这一问题上表现得一塌糊涂。</p><p>沃什明确指出，除货币供应外，美联储还需要关注一系列广泛的指标，例如大宗商品价格、国内私人需求和信用利差，同时认识到许多官方经济数据都带有明显的滞后性。这正是正确的做法。货币政策不应只盯着「后视镜」里的通胀和就业统计。货币与信贷状况以及大宗商品价格，能比许多传统经济报告更早地告诉我们经济正在发生什么。</p><p>他关于利率与量化宽松（QE）相对重要性的讨论也让我备受鼓舞。QE 在流动性稀缺的金融危机期间可能极为重要，但在正常环境下，短期利率的水平远比它更关键。美联储资产负债表的规模本身，并不是衡量货币政策松紧的好指标。沃什还正确地质疑了前瞻性指引的重要性——既然我们已经不再处于零利率下限。当短期利率被钉在零、美联储需要靠承诺维持宽松来影响长期利率时，前瞻性指引是强有力的；但当利率远高于零时，这种机制的重要性就大大降低了。</p><p>对市场而言最重要的一点是，沃什并不认为当前政策具有特别的限制性。联邦基金利率约为 3.6%，银行信贷正以约 7%–8% 的年率扩张。这很难说是一种在压制需求的货币政策。</p><p>沃什指出，目前通胀预期似乎锚定良好，但他并没有把这种稳定视为理所当然。这完全正确。通胀预期往往看起来很稳定，直到突然之间不再稳定。正如海明威在被问及一个人如何破产时那句名言：「先是渐渐地，然后突然之间！」通胀预期也可能如此，这就是为什么美联储不能想当然地认为今天的稳定会一直持续下去。</p><p>在美联储之外，我们继续看到人工智能叙事为股市提供了非常强劲的基本面支撑。英伟达的财报打消了人们对 AI 投资周期正在失去动能的担忧。黄仁勋对 AI 需求持久性的信心推动了市场走高。Salesforce 的财报及其与 Anthropic 的合作，扭转了「所有软件都将被 AI 取代」的看空叙事，并带动了软件股的上涨。</p><p>总体而言，市场继续展现出相当强的韧性，我仍然保持建设性看多。我们刚刚经历了一段异常强劲的盈利增长，因此某种程度的减速不可避免，但这并不意味着盈利前景正在恶化。最大的问题是：沃什会在中期选举前加息，还是会等到 12 月？</p>", "body_en": "<p>Kevin Warsh's Jackson Hole speech was notably hawkish. But I came away from the speech even more confident in Warsh and thought it was one of the best speeches I've heard from a Federal Reserve chair. Most importantly, Warsh is refocusing on factors missing from the Fed's framework for years: an explicit recognition that money supply and bank credit matter for the Fed's inflation outlook. Jerome Powell failed miserably on this feature during a critical and unprecedented surge in money supply with the Fed and the government's pandemic response.</p><p>Warsh made clear that the Fed needs to look at a broad range of indicators in addition to the money supply, such as commodity prices, domestic private demand, and credit spreads, while recognizing much of the official economic data arrive with a substantial backward lag. This is exactly the right approach. Monetary policy should not be conducted by looking only at rear-view mirror inflation and employment statistics. Money and credit conditions and commodity prices tell us what is happening in the economy before many of the traditional economic reports do.</p><p>I was also encouraged by his discussion of the relative importance of interest rates versus quantitative easing (QE). QE can be extremely important during a financial crisis when liquidity is scarce, but in a normal environment the level of short-term interest rates is far more consequential. The size of the Fed's balance sheet is not, by itself, a good measure of whether monetary policy is tight or easy. Warsh also correctly questioned the importance of forward guidance now that we are no longer at the zero lower bound. Forward guidance was powerful when short-term rates were pinned at zero and the Fed needed to influence longer-term rates by promising to remain easy. That mechanism is much less important with rates well above zero.</p><p>The most important point for markets is that Warsh does not believe current policy is particularly restrictive. The federal funds rate is around 3.6%, and bank credit is expanding at roughly a 7%–8% annual rate. That is hardly consistent with a monetary policy crushing demand.</p><p>Warsh noted inflation expectations currently appear well anchored, but he did not take that stability for granted. That is exactly right. Inflation expectations often look stable until suddenly they do not. As Hemingway famously put it when asked how someone goes bankrupt, \"gradually, then suddenly!\" The same can happen with inflation expectations, which is why the Fed cannot simply assume that today's stability will persist.</p><p>Beyond the Fed, we continue to see a very strong fundamental backdrop from the AI story powering the equity market. Nvidia delivered results that pushed back against concerns that the AI investment cycle was losing momentum. Jensen Huang's confidence in the durability of AI demand helped propel the market. Salesforce's results and their partnership with Anthropic helped shift the bearish narrative that all software would be replaced by AI and led to a thrust in software stocks.</p><p>Overall, the market continues to demonstrate considerable resilience and I remain constructive. We are coming off extraordinarily strong earnings growth, so some deceleration is inevitable, but that does not mean the earnings outlook is deteriorating. The biggest question? Can Warsh hike before the mid-term elections or will he wait until December.</p>", "source": "siegel"}, {"id": "2026-08-10", "date": "2026-08-10", "title_en": "Soft Payrolls, Strong Earnings Reinforce Bullish Outlook", "title_zh": "非农疲软叠加盈利强劲，强化看多前景", "author": "Jeremy Siegel", "author_title": "WisdomTree 高级经济学家 · 宾夕法尼亚大学沃顿商学院金融学荣休教授", "url": "https://resources.wisdomtree.com/weekly-siegel-commentary/", "body_zh": "<p>市场被一份远弱于预期的就业报告所震动，国债收益率大幅下挫，投资者迅速下调了对美联储再次加息的押注。乍看之下，非农数据令人不安，尤其是叠加此前几个月的大幅下修，以及出人意料的疲弱薪资增长。</p><p>但我认为，这个头条数据夸大了劳动力市场的疲弱。大部分下滑似乎源于临时性因素——包括世界杯后休闲娱乐业就业走弱、州和地方政府招聘的季节性扰动，以及劳动力人口结构的持续变化——而非经济基本面的突然恶化。最重要的是，失业率实际上降至 4.1%，表明劳动力需求与当前放缓的劳动力增长大体相符。</p><p>劳动力市场已经进入一个新的均衡。随着人口增长放缓、移民收紧以及劳动力老龄化，每月约 2 万至 4 万的非农新增已经足以维持失业率稳定。十二个月平均就业增量已落在这一区间附近，表明经济正以接近其可持续趋势的速度增长，而非滑向衰退。如果 GDP 增长能够维持，偏弱的就业数据最终可能反而成为利好。以更少的工时生产同样的产出，将直接转化为更强的生产率增长——这正是投资者一直期待看到的、随着人工智能更深入地融入整体经济而出现的发展。尽管近期的生产率报告令人失望，但就业数据的大幅下修，提高了数据开始显现期待已久的人工智能驱动的生产率加速的可能性。</p><p>就货币政策而言，这份就业报告大幅降低了加息的可能性。未来一周的通胀数据依然关键，但油价仍是核心变量。受地缘紧张局势再度升温影响，汽油价格已从近期低点回升，不过期货市场目前暗示，若中东局势不再进一步升级，未来数月油价将温和回落。货币供应趋势同样值得密切关注。自近期冲突爆发以来，M2 以约 8% 的年化速度扩张，但这一增速似乎正在回落到 5% 至 6% 的区间。这仍高于战前水平，但远未达到疫情期间那种爆炸性的货币扩张。除非油价再次大幅飙升，否则我认为美联储很难在 9 月会议上为加息找到理由。</p><p>美国企业继续交出极为强劲的盈利，利润率达到了除强劲衰退后复苏期外罕见的水平。我认为这种强劲在很大程度上是结构性的，而非周期性的。如今的科技龙头将巨额的研究、软件和知识产权投资计为费用，而非像传统实物资产那样资本化。这种会计处理使得报表上的利润率显得异常之高，即便企业实际上正从那些从未出现在资产负债表上的巨额投资中获得回报。在科技行业之外，利润率保持相对稳定，这表明超常的盈利能力集中在那些从人工智能和无形资本中获益最多的企业，而非反映过度杠杆或不可持续的定价权。</p><p>未来的关键问题是，人工智能是否终于开始在生产率统计数据中体现出来。如果企业能以更少的工人生产更多产品，同时维持异常强劲的盈利增长，那么经济可能正在进入一个更为有利的长期生产率周期。这将支持盈利的持续扩张、缓解通胀压力，并最终使货币政策得以变得不那么紧缩。这份就业报告或许让投资者感到意外，但抛开头条数字，更大的叙事依然是：一个持续适应、创新并展现出非凡韧性的经济体。</p>", "body_en": "<p>The market was jolted by a much weaker-than-expected employment report, sending Treasury yields sharply lower as investors quickly reduced the odds of another Federal Reserve rate hike. At first glance, the payroll number looked alarming, particularly when combined with sizable downward revisions to prior months and unexpectedly soft wage growth.</p><p>But I believe the headline overstated the weakness in the labor market. Much of the decline appears attributable to temporary factors—including weakness in leisure employment following the World Cup, seasonal distortions in state and local government hiring, and ongoing shifts in labor force demographics—rather than a sudden deterioration in underlying economic conditions. Most importantly, the unemployment rate actually fell to 4.1%, indicating that labor demand remains broadly consistent with today's slower labor force growth.</p><p>The labor market has entered a new equilibrium. With slower population growth, tighter immigration, and an aging workforce, monthly payroll gains of roughly 20,000 to 40,000 are increasingly sufficient to keep unemployment stable. The twelve-month average job gain has settled near that range, suggesting the economy is growing close to its sustainable trend rather than slipping into recession. The weaker employment data could ultimately prove constructive if GDP growth holds up. Fewer hours worked producing the same level of output would translate directly into stronger productivity growth—precisely the development investors have been waiting to see as artificial intelligence becomes more deeply embedded throughout the economy. While recent productivity reports have disappointed, the labor revisions raise the possibility data will start showing the long-awaited AI-driven acceleration.</p><p>For monetary policy, the employment report materially lowers the chance of a rate increase. Inflation data over the next week will remain critical, but oil prices continue to be the key variable. Gasoline prices have risen from their recent lows following renewed geopolitical tensions, yet futures markets currently imply modest declines over the coming months if Middle East tensions do not escalate further. Money supply trends also deserve close attention here. Since the onset of the recent conflict, M2 has expanded at roughly an 8% annualized pace, but that growth now appears to be moderating back toward the 5% to 6% range. That remains above pre-war levels but is far removed from the explosive monetary expansion experienced during the pandemic. Unless oil prices experience another significant spike, I believe it will be difficult for the Fed to justify raising rates at its September meeting.</p><p>Corporate America continues to deliver remarkably strong earnings, with profit margins reaching levels rarely seen outside of powerful post-recession recoveries. I believe much of this strength is structural rather than cyclical. Today's technology leaders expense enormous investments in research, software, and intellectual property rather than capitalizing them as traditional physical assets. That accounting treatment makes reported profit margins appear extraordinarily high even though companies are earning returns on massive investments that never appear on the balance sheet. Outside tech, profit margins remain relatively stable, suggesting the extraordinary profitability is concentrated among firms benefiting most from AI and intangible capital rather than reflecting excessive leverage or unsustainable pricing power.</p><p>The key question going forward is whether AI finally begins to show up in the productivity statistics. If businesses produce more with fewer workers while maintaining exceptionally strong earnings growth, the economy may be entering a more favorable long-term productivity cycle. That would support continued earnings expansion, ease inflation pressures, and ultimately allow monetary policy to become less restrictive. The labor report may have surprised investors, but beneath the headline, the broader story remains one of an economy that continues to adapt, innovate, and demonstrate remarkable resilience.</p>", "source": "siegel"}, {"id": "2026-04-09", "date": "2026-04-09", "source": "oaktree", "title_en": "What's Going on in Private Credit?", "title_zh": "私募信贷发生了什么？", "author": "Howard Marks", "author_title": "橡树资本（Oaktree Capital）联合创始人 · 联席董事长", "url": "https://www.oaktreecapital.com/insights/memo/whats-going-on-in-private-credit", "body_zh": "<p>在我整个职业生涯中，被笼统称为「信贷」的领域经历了巨大的创新。它的受欢迎程度稳步上升，在金融世界中的规模和角色成倍增长。前几天，一位橡树资本的同事问我，究竟是哪些发展把信贷行业带到了今天这个位置。我列出了下面这张清单：</p>\n\n<h3>起源时间表</h3>\n<table>\n<tr><th>1970 年代</th><td>接受非投资级债务</td></tr>\n<tr><th>1980 年代</th><td>杠杆收购的普及，企业杠杆率上升</td></tr>\n<tr><th>1990 年代</th><td>银团贷款（Broadly Syndicated Loans）与分层证券化</td></tr>\n<tr><th>2000 年代</th><td>「另类」投资的兴起；次贷放款与抵押贷款支持证券</td></tr>\n<tr><th>2010 年代</th><td>直接贷款（Direct Lending）的扩张</td></tr>\n<tr><th>2020 年代</th><td>向个人与退休投资者销售直接贷款产品</td></tr>\n</table>\n\n<p>回想起来，我在 1968 年夏天初入投资界时，那个只由股票和高评级债券构成的世界，与上表所列的发展相比，显得如此朴素而局限。这些进步彻底改变了投资管理行业，而橡树资本及其客户是主要的受益者。上面列出的所有变化，都涉及——或者说都得益于——如今被广泛称为「信贷」的东西，本质上就是非政府债务。我先简要梳理一下这段历史，为后文铺陈背景。</p>\n\n<p>在 1977-78 年之前，一家没有投资级信用评级（BBB 或以上）的公司，几乎不可能公开发行债券。当时存在的投机级债务，主要是那些原本是投资级、后来陷入困境被降级的公司所发的债，也就是所谓的「堕落天使」。缺乏投资级评级的公司，通常只能向银行借款，或通过「私募」向保险公司融资。迈克尔·米尔肯（Michael Milken）通常被认为提出了这样一个想法，并在 1970 年代末付诸实践：只要利率高到足以补偿违约风险，非投资级公司就应该能够发行债券。这种「风险/收益思维」帮助催生了今天约 1.5 万亿美元的美国高收益债券市场，也促成了本文讨论的其他大部分发展。</p>\n\n<p>1970 年代中期发生过几笔小型的杠杆收购，但 1980 年代高收益债券的普及，让 LBO 基金、小公司和「收购艺术家」得以借到足够的钱，去收购比以往大得多的公司。这带来了杠杆收购的大规模扩张，催生了一个在 1990 年代改名为「私募股权」的行业。</p>\n\n<p>将债务工具打包、再按不同的优先级、风险和利率出售分层（tranche）的想法，始于 1970 年代抵押贷款支持证券的诞生——人们最常把它与所罗门兄弟的路易斯·拉涅里（Louis Ranieri）联系起来——并在 1980、1990 年代不断扩张。</p>\n\n<p>在 1990 年代之前，银行发放贷款——其中一些贷给非投资级公司——并把它们「银团」给少数几家同行银行。但随后，华尔街发展出了「银团贷款」「杠杆贷款」或「优先贷款」，大批量出售给机构投资者，发展到今天在美国约 1.5 万亿美元的市场。发行这类融资能力的大幅提升，助推了私募股权的增长。</p>\n\n<p>2000 年科技泡沫破灭后，标普股指出现了大萧条以来首次三年连跌，投资者对股市失去了兴趣，而且这种冷淡持续了整整十年。当各国央行降息以应对随之而来的经济与市场萎靡时，投资者又寻求高于债券的回报。股票和债券都不受待见，投资者开始寻找新的出路。他们把目光投向表现相对坚挺的对冲基金和私募股权，「另类投资」这个标签由此诞生。对冲基金找不到足够多的便宜机会来容纳庞大的机构资金，于是许多投资者转向私募股权，把它当作当时的解决方案。首批 100 亿美元级别的私募股权基金随之组建。</p>\n\n<p>大约在同一时期，企业债务开始被证券化进「结构化信贷」工具，比如贷款抵押证券（CLO）。那些打包这些工具、并利用「分层」实现内部加杠杆的银行，为高收益的次级档和过度抵押的高级档都找到了热切的买家。对 CLO 的强劲需求，以及结构化交易带来的利润，催生了对可供证券化贷款的需求，进而带动了银团贷款发行量的增加。</p>\n\n<p>许多同样的银行，把发放给可疑借款人的次级抵押贷款打包成住房抵押贷款支持证券（RMBS）。令人咋舌的是，银行家们竟能为以「骗子贷款」为底层资产的 RMBS 拿到数千个 AAA 评级。当这些贷款和结构的高度缺陷暴露出来时，结果就是 2008-09 年的全球金融危机（GFC）。</p>\n\n<p>金融危机结束时，银行变得更穷、更收敛、也受到更严格的再监管，结果是银行信贷供给不足，无法满足蓬勃发展的私募股权行业的需求。投资管理机构挺身填补了这个空缺，通过非银行贷款，也就是「私募信贷」来放贷。其中增长最快的部分，是「直接贷款」：向中端市场、由私募股权发起人（sponsor）支持的、评级低于投资级的组合公司提供的私募贷款。（请注意：「私募信贷」和「直接贷款」并非同义词；后者是前者的一个子集。如今许多提及私募信贷的报道，其实说的都是直接贷款。我会尽力在本文中谨慎区分这一点；而大多数评论者并不区分。）</p>\n\n<p>最近，向个人投资者和退休账户销售持有直接贷款的投资工具变得流行起来。这增加了可供直接贷款使用的资金，也推高了那些抢到这些资金的基金经理的管理规模。</p>\n\n<h3>正常模式</h3>\n<p>新式投资形态的流行度出现极端飙升——那些通常被贴上「泡沫」标签的现象——几乎总有一些共同特征：</p>\n<ul>\n<li><strong>核心要素是「新」。</strong>当某样东西是新的时，(a) 鼓吹者很容易通过宣扬它的优点来激发买家的兴趣；(b) 由于它从未经受过考验，缺陷尚未暴露。这让投资风潮得以成长为泡沫。</li>\n<li><strong>通常有几分真话。</strong>「漂亮五十」确实是好公司；互联网和数字通信确实改变了世界；抵押贷款通常也是安全的投资。这些真话为最终成长为极具破坏性的泡沫提供了基础。</li>\n<li><strong>早期投资新事物往往是赚钱的，</strong>因为最初入场的人，是在价格尚未被上升的人气推高之前买入的。</li>\n<li><strong>早期投资者的成功让旁观者眼红，促使他们加入这场狂欢。</strong>正如查尔斯·P·金德尔伯格在《疯狂、恐慌与崩溃：金融危机史》中所写：「没有什么比看到朋友发财更扰乱人的心境和判断力了。」嫉妒或许是世界上最强大的力量。</li>\n<li><strong>获得巨大成功的可能性点燃了投资者的希望。</strong>「可能」被混同于「大概」，继而演变成「必然」。怀疑与风险厌恶被抛到了九霄云外。</li>\n<li><strong>关键问题——也是狂热追逐中的投资者很少问的问题——是以什么价格参与才是安全的。</strong>嫉妒、兴奋、发财梦和踏空恐惧（FOMO），是谨慎和不愿跟风上车的大敌。</li>\n<li><strong>后来者吞下承诺、放低标准、推高价格，导致大多数投资趋势最终走向过度。</strong>对我而言，投资中最重要的一句格言是：「智者在开头做的事，愚者在结尾做。」巴菲特说得更形象：「先是创新者，然后是模仿者，最后是傻瓜。」</li>\n<li><strong>投资者在顺境时轻易忽略的那些缺陷、潜在陷阱和无法兑现的承诺，一旦围绕新事物的乐观情绪被证明过度、或付出的价格被证明过高，就必然导致幻灭与损失。</strong></li>\n</ul>\n<p>当马克·吐温（据传）说「历史不会重演，但会押韵」时，他想到的一定就是这种反复出现的模式。我认为这是投资中永恒的真理之一。</p>\n\n<h3>这适用于直接贷款吗？</h3>\n<p>我认为可以公允地说，过去 15 年里，直接贷款——私募信贷领域的一部分——经历了上述进程的某些阶段：</p>\n<ul>\n<li>一种新的融资形式被发明出来。</li>\n<li>随着银行放贷意愿下降，来自私募股权的融资需求超过了供给。这让早期的直接贷款人能够索取高利率，并通过严格的贷款文件获得强有力的保护。</li>\n<li>2010 年代的低利率，让直接贷款较高的预期回报显得格外有吸引力，尤其是考虑到回报还能通过低成本借款加杠杆。</li>\n<li>机构投资者注意到早期贷款的可取之处，纷纷加入这场狂欢。</li>\n<li>这种吸引力无疑因为一个事实而增强：私募贷款几乎没有价格波动，因为它们没有可供盯市的市场。这让鼓吹者可以说「它们能带来高风险调整后的回报」，但这并不对。更合理的说法是，它们能带来高「波动率调整后」的回报（这正是夏普比率所衡量的），但我要竭力强调：风险和波动率不是一回事。直接贷款所蕴含的信用风险，并不比高收益债券和银团贷款等流动性信贷工具小。只是这种风险不那么容易在价格上反映出来。</li>\n<li>数百家投资公司提供直接贷款服务，其中绝大多数是在全球金融危机结束后才进入私募信贷市场的，这意味着它们从未在艰难时期经受过考验。尽管如此，它们还是拿到了大量资金去管理。</li>\n<li>大量新管理人和巨量新增资本的涌入，导致贷款人竞相放贷，接受更低的收益率、更窄的利差和更弱的安全保障。有些管理人无疑是被「把大量资本投出去」的动机驱使，降低了标准。</li>\n<li>金融危机结束以来 17 年里总体良性的经济与投资环境，让直接贷款大获成功，尽管承销标准已经出现弱化的迹象，这些趋势却愈发明显。上述种种加在一起，促成了在低利率环境下向渴求回报的个人与退休投资者销售直接贷款产品。</li>\n</ul>\n<p>可供投资直接贷款的巨量资本，制造了一种淘金热的心态。过去 15 年里，大约发放了 2 万亿美元的直接贷款。（整个私募信贷行业 20 年前才约 1500 亿美元。）因此，我想象有些直接贷款管理人接受了过多的钱、投得过快、应用了过低的标准，为一次修正埋下了伏笔。</p>\n\n<p>在最近几个月，直接贷款（被那些不做精细区分的人泛化为整个私募信贷）的潮水开始退去。套用巴菲特的话，这带来了「某些裸泳者现形」的可能性。</p>\n\n<p>正如我在 2025 年 11 月的备忘录<a href=\"https://www.oaktreecapital.com/insights/memo/cockroaches-in-the-coal-mine\">《煤堆里的蟑螂》（Cockroaches in the Coal Mine）</a>中所写，2025 年年中，First Brands 和 Tricolor 这两起引人注目的破产案让信贷投资者措手不及。两者都引发了关于可能存在欺诈的担忧，而这种欺诈或许正是顺境中贷款人放低标准所纵容的。</p>\n\n<p>这引发了对直接贷款公开工具的担忧：也就是商业发展公司（BDC）。当一些「非上市 BDC」的投资者想要赎回资金却无法全额赎回时，关于流动性的质疑开始浮现。同样，人们也质疑这些工具如何对其私募债务持仓估值，进而质疑其报告账面价值的准确性，以及从工具中撤资的流程。或许正因如此，「上市 BDC」（可以卖出但不能赎回）的股票，开始以相对其净资产价值更大的折价交易。</p>\n\n<p>前面这些事件大多被当作孤例处理，也就是说当时并没有出现广泛的幻灭或信心丧失。但通常情况是，如果一系列令人不安的事件不断累积，最终会达到一个临界点，让投资者再也无法忽视新事物刚刚暴露的缺陷。而这就把我们带到了软件债务。</p>\n\n<h3>直接贷款与软件</h3>\n<p>在 2000 年代中期之前，高收益债券和杠杆贷款的投资者普遍不愿意把钱借给科技公司，因为科技公司被认为基本面风险太高，不够格成为借款人。既然无法加杠杆，它们也就不是私募股权基金收购的对象。</p>\n\n<p>但当私募股权基金的投资强劲增长时，管理人需要公司来买，这促使他们扩大了考虑的范围。他们得出结论：在那些「不太可能被取代的关键软件」中占据市场领先地位的公司，将 (a) 享受基于订阅的经常性现金流，这能让一家公司变得「可融资」；(b) 受益于围绕其业务的可持续护城河。私募股权基金开始收购软件公司，信贷投资者也开始为此提供资金。</p>\n\n<p><strong>以我的经验，信贷市场的制约因素从来不是借款人对资金的胃口，而是贷款人供应资金的意愿。</strong>套用凯文·科斯特纳在电影《梦幻之地》里的那句台词：「如果你提供资金，他们就会借钱并投入使用。」因此，信贷市场的构成，深受私募股权的增长、可供直接贷款的资金热潮，以及双方都认同软件公司是良好投资对象这一共识的影响。</p>\n\n<p>近年来，发起人（sponsor）越来越倾向于把直接贷款作为银团贷款的替代，因为前者能让他们从少数几家大贷款人那里拿到所需资金，免去了漫长的路演、广泛的信息披露，以及一旦出问题需要再谈判时面对大量对手方的麻烦。直接贷款人也表现出支持更高债务水平的意愿，让发起人能够实现超出银团贷款市场所能容纳的杠杆。他们还愿意以「ARR 贷款」（基于年度经常性收入）的形式，把钱借给尚未盈利的公司。</p>\n\n<p>贷款相对债券、私募相对公开的吸引力，使软件债务在美国次级投资级信贷市场中的占比大致如下：</p>\n<table>\n<tr><th>高收益债券</th><td>4-5%</td></tr>\n<tr><th>银团贷款</th><td>10-15%</td></tr>\n<tr><th>直接贷款</th><td>20-30%</td></tr>\n</table>\n\n<p>此外，由于同样的因素，在软件债务中，投向「杠杆收购标的公司」（即杠杆率更高的公司）的比例，在银团贷款市场中高于高收益债券市场，而在直接贷款市场中更高。</p>\n\n<p>由于上述种种，相当大一部分直接贷款投向了软件公司，而这些公司往往是以约 20 倍的 EBITDA 高倍数、以高杠杆率被收购的。如今，软件公司债务突然成了新闻焦点。</p>\n\n<p>在过去一两年里，人工智能显著减少了对人类写代码（即编写程序或软件）的需求，在很大程度上让程序员沦为「指示 AI 模型该做什么」的人。2024-25 年，软件公司股票和债务的市场反应并不大。随后，2025 年 11 月，Anthropic 发布了一款强大的新编程模型，接着在 1 月下旬发布了 11 个「插件」，用于在多个领域自动化任务。看起来，2 月的头几天达到了一个认知的临界点。投资者终于注意到了积累已久的负面因素，此后私募信贷市场一直面临审视与波动：</p>\n<ul>\n<li>对软件债务的担忧，让半流动公开工具的投资者提出了赎回申请。</li>\n<li>赎回限制让投资者质疑自己投资的安全性。</li>\n<li>一些投资者以公布的净资产价值（NAV）退出的过程，可能让留下的投资者质疑：人们退出时的 NAV 是否被高估了？如果高估，对自己又会有何影响？</li>\n<li>当基金限制赎回时，投资者可能会合理地得出结论：下次应该把更多的份额拿去申请赎回。</li>\n</ul>\n<p>直接贷款基金内置的赎回限制，迄今为止似乎按设计发挥了作用，让管理人避免了清仓式抛售。<strong>但如果投资者被告知「想取钱时却取不出来」，他们做出负面反应也是可以理解的。</strong></p>\n\n<h3>私募信贷与公众投资者</h3>\n<p>今天的私募信贷领域正在发生两件不同的事。一是借款人基本面和贷款稳健性的变化，二是投资者的反应。正如 Armen、Bob 和 Craig 在最近一份内部备忘录中所写：</p>\n<blockquote>虽然这些软件公司总体表现良好（只有少数例外），但市场上越来越担忧它们面临被 AI 显著颠覆的风险，这已实质性地冲击了它们的股权价值，并压缩了贷款人的股权缓冲。如今，投资者并不区分软件领域潜在的赢家和输家，整个板块都承受压力……这些扰动和头条新闻，很大程度上是资金面和情绪驱动，而非信用恶化的结果。</blockquote>\n<p><strong>投资者很少是本杰明·格雷厄姆和大卫·多德在《证券分析》中描述的那种理性、有条不紊、冷静客观的称重机，至少在短期内绝不是。</strong>正如我在 2016 年的备忘录<a href=\"/docs/default-source/memos/what-does-the-market-know.pdf?sfvrsn=cb7a0165_10\">《市场知道什么？》</a>中所写：现实生活里，事情在「还不错」和「不太妙」之间波动，但在投资者的心里，它们从「完美无瑕」直接跳到「无可救药」。</p>\n<p><strong>投资者起初会爱上新事物，全盘吞下它的承诺，并付出过高的价格。乐观与兴奋从来都不利于怀疑精神、冷静分析、维持恰当的风险厌恶，以及坚持高标准。</strong></p>\n<p><strong>然后，当失望与幻灭降临，最初支撑这项投资的胆量与信心便蒸发殆尽。此时的分析又朝相反方向出错，过度的悲观与怀疑取代了急切与轻信，纯粹的恐惧取代了在一切顺利时促成投资的盲目信念。</strong></p>\n<p>AI 对软件行业的影响、私募资产的流动性限制、以及直接贷款基金定价准确性的不确定性，这些因素已经存在多年了。但说白了，人们可能只是像往常一样，在顺境中没有提出足够多的问题、也没有给予足够多的关注。</p>\n<p>这就导致了当前直接贷款工具投资者的不适。投资直接贷款这种新现象的散户，不太可能完全理解它潜在的复杂性，尤其是当它从未在艰难时期经受实战检验时。工具中内置的杠杆，可能曾被鼓吹为「增厚利润」，而现在投资者正在看到它在相反方向上发挥作用。而投资工具对流动性的限制——可能当初被一句「大多数时候你大概会没事」的说法轻描淡写地带过——如今却以惊人的方式显现了出来。</p>\n<p><strong>狂热的信徒在狂热中赚得最多，怀疑者在崩溃时亏得最少。但我们要追求的投资成功的关键，在于始终在「相信」与「怀疑」之间保持健康的平衡。</strong>正如查理·芒格常引用古代哲学家德摩斯梯尼的话：「一个人所希望的，就是他所相信的。」大多数人梦想发财，当有人承诺一种无风险的发财之道时，他们就愿意相信。但新事物很少像预期那样兑现，尤其是当你在它狂热时毫不怀疑地投入。</p>\n<p>最稳妥的做法，是坚守久经考验的投资，把更具创新性的发展留给那些能够理解并应对其影响的专家。但很少有人能抗拒伴随大多数未经检验的风潮而来的「轻松获利」的诱惑。向来如此，永远如此。</p>\n\n<h3>1929 年的教训</h3>\n<p>我多年来读过的最好的投资书，是一本让我一章接一章读得停不下来的书：安德鲁·罗斯·索尔金所著《1929：华尔街史上最大崩盘的内部故事——以及它如何击垮了一个国家》。它讲述了 1929 年 10 月 29 日大崩盘的导火索及其后果，而且不是干巴巴地罗列事件，而是通过当时各路主角的侧写来呈现。从《1929》中能学到很多教训，与我喜欢的那些关于市场过度的书一脉相承：约翰·肯尼斯·加尔布雷思的《金融狂热简史》（1994）和爱德华·钱塞勒的《掠夺殆尽：金融投机史》（2000）。</p>\n<p>我从《1929》中得到的心得是，有三件事尤其要为那场以崩盘告终的泡沫负责：</p>\n<ul>\n<li>不考虑适当性就把股票卖给公众；</li>\n<li>向买家提供高额杠杆；以及</li>\n<li>所购资产的非流动性与为其融资的贷款的短期性质之间的错配。</li>\n</ul>\n<p>在长达数年的上涨之后，散户被诱入股市；1921 至 1928 年间，主要股指已经上涨了约 400%。券商渴求佣金和更大交易中的加价，为高达购买价 90% 的保证金贷款提供了融资。而一旦下跌抹掉了投资者 10% 的自有资金、又无法追加保证金，这些贷款就可能被要求立即偿还——持仓也会被平掉。这个故事听起来很熟悉（而且此后又重演过多次）：</p>\n<ul>\n<li>散户缺乏金融素养，容易受到推销和「好得不像真的」承诺的蛊惑。</li>\n<li>杠杆被描述成能够放大成功的果实，但相应的下行风险却往往在推销中被省略。</li>\n<li>保证金债务那些也许未被提及的条款——以及难以想象一场潜在市场下跌到底能有多深——让投资者暴露在毁灭的风险之下。</li>\n</ul>\n<p><strong>在股市里输个精光并不容易，但这三样东西加在一起，在足够糟糕的繁荣/崩盘周期里就能办到。</strong></p>\n<p>上述种种在 1929 年发生时，正值投资业监管法律近乎空白——包括对招股书真实性的要求——并因一些华尔街头面人物的自欺、缺乏原则和彻头彻尾的贪婪而雪上加霜。其结果是一场市场与经济的灾难，让好几代人心有余悸。</p>\n<p>索尔金大体上只限于记录笔下人物的行为，把下结论、讲教训留到了最后。但他结尾掷地有声：</p>\n<blockquote>股市下跌所带来的毁灭——不只是在崩盘期间，而是在其后十年的大部分时间里——给数百万美国人带来了难以忍受的痛苦。它让他们不只是远离市场，更让他们憎恨那些靠买卖股票谋生的人。<br><br>然而，把市场推到如此天高的力量——乐观、野心，以及对未来能无限光明的信念——并没有永远消失。它们从来不会消失。<br><br>归根结底，1929 年的故事无关利率或监管，也无关做空者的精明或银行家的失职。它关乎某种更恒久的东西：人性。无论发出多少警告、写下多少法律，人们总会找到新的方式去相信好日子能永远持续。他们会把希望装扮成必然。而在那种集体狂热中，人类会一次次失去理智。</blockquote>\n<p>永恒的教训不在于繁荣可以被阻止，也不在于崩溃可以被完全避免。而在于：我们需要记住，自己是多么容易遗忘。非理性繁荣的解药，不是监管本身，也不是怀疑，而是谦卑——那种知道没有系统万无一失、没有市场完全理性、没有哪一代人能豁免的谦卑。我们的确定性越高，摔得就越重、越久。</p>\n<p><strong>索尔金的结论性观察，捕捉到了从一轮轮周期中「押韵」重现的错误里可以汲取的教训。</strong></p>\n\n<h3>经理人该怎么做？</h3>\n<p>在我看来，一个尽责的经理人面临的最大难题，或许出现在「过多资本被推进他们所处的市场、投资者又急于把钱投出去」的时候。我在 2007 年 2 月、全球金融危机前夕的备忘录<a href=\"/docs/default-source/memos/2007-02-14-the-race-to-the-bottom.pdf?sfvrsn=9bbc0f65_6\">《逐底竞争》（The Race to the Bottom）</a>里详细谈过这一点（真不敢相信那已经快 20 年了）。大约就在那时，花旗 CEO 查克·普林斯说出了那句名言：「只要音乐还在放，你就得起来跳舞。」<strong>对一个经理人来说，这是怎样的两难：是在狂热投资者放低标准、急于把钱投出去时随波逐流，还是袖手旁观、分文不投，看着其他经理人堆积管理规模，并可能在你的怀疑与纪律最终得到回报之前那段看似无尽的时期里，让客户关掉账户？</strong></p>\n<p>我从来不想把橡树/布鲁克菲尔德描绘成投资美德的光辉典范，我也从不说我们是完美的。然而，卓越的投资不是来自全知全能和完美的决策，而是来自比别人更好的决策。事实上，自从 48 年前我开始做这件事以来，我们的高收益债券组合几乎每年都有违约……只是远少于大多数同行，也远少于我们为承担违约风险所获得的利差所预留的空间。话虽如此，我想描述一下我们在私募信贷、直接贷款和公开工具方面的立场。我为我们表现感到非常自豪，而且我认为这会很有启发性。</p>\n<p>第一，我们自几十年前高收益债券和银团贷款诞生之初就是投资者，但我们从未在私募信贷上过度投入。正如我一年前在备忘录<a href=\"https://www.oaktreecapital.com/insights/memo/gimme-credit\">《给我信贷》（Gimme Credit）</a>中所说，这几年来最热门的问题一直是「我们能聊聊私募信贷吗？」，而我的回应一直是「我们能聊聊信贷吗？」。我们坚持认为，私募信贷和流动信贷在投资组合中都应占有一席之地。</p>\n<p>第二，我们投资私募信贷已有数十年——在我们的困境债基金里购买银行贷款，从事夹层贷款和资产支持贷款——但我们从未像其他人那样大规模地追逐直接贷款。在 2010 年代初它刚出现时，我们认为直接贷款的回报，虽然相对较高，但绝对水平偏低。后来，我们认为它在定价和条款上的优越性，已经被新涌入的管理人和资本竞争掉了，使它变得「一般有吸引力」，而非「异常出众」。</p>\n<p>基于这些原因，私募信贷在橡树的正常信贷资产中占比远不到一半，而直接贷款在我们的私募信贷账簿中占比不到一半。因此，直接贷款只占橡树正常信贷投资的约 20%，占我们总管理规模不到 15%。</p>\n<p>第三，由于 (a) 我们的资产扩张远少于许多其他另类信贷管理人（橡树的管理规模在过去十年「仅仅」翻了一倍），且 (b) 直接贷款只占我们管理规模增长的有限一部分，我们感到的投资压力和降低标准的压力都要小得多。这意味着我们能够保持高度挑剔，限制投向软件的资金，并把它限定在我们认为最好的机会上。</p>\n<p>我们整个信贷平台对软件公司的敞口，无论从绝对量还是相对同行而言都极小。布鲁克菲尔德/橡树的大部分私募信贷基金都运作于直接贷款之外，因此对软件的持仓十分有限。即便是我们的直接贷款组合，软件敞口通常也很有限，而且在过去 12-18 个月里，我们对参与新的软件交易设定了特别高的门槛。</p>\n<p>因此，我们相信我们的私募信贷投资是防御性地承销、保守地结构化的。我们的软件敞口远低于同行，主要是第一留置权（first-lien），而且极少有实物支付（payment-in-kind）的成分。</p>\n<p>第四，橡树在私募信贷上的总投资中，80% 是代表机构客户，也就是说投向公众的非常少。当公开直接贷款工具的头部管理人手里有 400-500 亿美元甚至更多时，我们只有略高于 100 亿美元。</p>\n<p>因为我们直接贷款的投资有限，我们没有经历其他一些信贷管理人所经历的全部规模增长。这让我们处于有利位置，能够在如今投资者热情降温时大展拳脚。<strong>投资者新近抬高的怀疑，很可能在未来几天给我们带来比刚结束的这段时期里我们放弃的那些机会好得多的投资机会。</strong>保持纪律、抵制最新的风潮，不是短期收益最大化的路径，但却是我们追求卓越投资所必需的。</p>\n\n<h3>直接贷款与私募股权</h3>\n<p>由于私募股权与直接贷款的发展密不可分，我想在这里引入私募股权，谈谈这两个领域在未来几年将如何相互影响。私募股权的发展比直接贷款慢得多，但它们的命运紧密交织。</p>\n<p>正如我前面所述，私募股权诞生于 1970 年代，随 1980 年代高收益债券的普及而成长，在 2000 年代成为共识性的解决方案，又因 2010 年代兴起的直接贷款趋势而进一步加码。结果是造就了一个非常成功的私募股权行业，以及一个给了投资者他们所求回报的资产类别。这些收益在很大程度上归功于私募股权公司识别好公司、植入所有权文化、并通过战略和财务行动创造价值的能力。然而，也有相当一部分收益——却没有得到应有的承认——来自私募股权成长所处的利率环境。</p>\n<p>2022 年 12 月，我写了一篇备忘录<a href=\"https://www.oaktreecapital.com/insights/memo/sea-change\">《海变》（Sea Change）</a>。其中谈到 1980 年我的一笔未偿银行贷款，以及我收到的那张通知单：利率已经涨到了 22¼%。然后我说，2020 年我能够以 2¼% 借钱。我认为这 40 年、2000 个基点的利率下行，是过去半个世纪金融世界里最具影响力的事件，但它却没有得到足够的关注。</p>\n<p>在其他影响之中，利率下行让资产变得更有价值（导致央行行长们担忧的资产泡沫），并降低了借贷成本。因此，当利率下降时，借钱买资产的人会得到双重红利。而这正是私募股权的做法。正如我在《海变》中所写，由于利率下降和/或超低利率，私募股权行业在其存在的大部分时间里都享有巨大的顺风。2009-21 年这段时期尤其如此——这十三年里联邦基金利率大部分时间为零，平均只有约半个百分点。<strong>归根结底：私募股权诞生、并一直存在到 2021 年，它所处的利率环境对它极为有利。</strong></p>\n<p>不出所料，一切都很顺利。投资者认定私募股权是万能药；LP 资金涌入；GP 能够用唾手可得、低成本的债务资金（尤其是直接贷款出现之后）给它加杠杆。经济环境也提供支撑，迎来了美国历史上最长的复苏期。长达 10 年的牛市让私募股权公司很容易卖掉它们的组合公司，新私募基金急于通过从老私募基金手中买公司来投放资本的急切，也助长了这一点。回报不负众望，对 LP 的分配也是如此，这又让私募基金能够继续吸引 LP 资金，延续了这个「良性循环」。</p>\n<p>但 2022 年初，各国央行决定加息对抗通胀，联邦基金利率（举例而言）从零一路升到 5¼-5½%。《海变》的核心信息是：超低利率和长期下行的利率时代已经结束，那些从中受益最大的投资策略，未来将表现不如从前。</p>\n<p>《海变》这篇备忘录，源自 2022 年秋天我和布鲁斯·卡什（Bruce Karsh）疫情后首次成行时对客户的一次拜访。我永远不会忘记布鲁斯对形势的总结：<strong>「过去几年里，许多私募股权公司背负的资本结构，根本没有预料到利率会上涨 400 个基点。」</strong>利率上升给私募股权「齿轮里撒了沙子」，而今天的图景与上面描述的截然不同：</p>\n<ul>\n<li>更高的利息成本让许多组合公司利润下降。在杠杆成本低廉时非常划算的交易，如今经济意义大不如前。</li>\n<li>更高的利率意味着更高的利息支出，从而降低了利息覆盖率（盈利与利息支出之比），使低利率时期举借的债务更难再融资。</li>\n<li>利率上升降低了买家眼中公司未来现金流的价值，正如利率下降曾推高它一样。</li>\n<li>因此，组合公司可出售的价格更低了，组合公司的出售也放缓了。</li>\n<li>结果，对私募股权 LP 的分配下降，LP 基于老基金「正常」分配预期所做的资本承诺变得沉重。</li>\n<li>进一步的结果是，LP 更难向新基金出资。</li>\n<li>私募股权基金的回报骤降。根据 Claude 的说法，「MSCI 估计，2022 年至 2025 年三季度，一个美国私募股权基金指数的年化回报率为 5.8%，而标普 500 为 11.6%。」这进一步削弱了对新私募基金的热情。</li>\n</ul>\n<p><strong>未来，组合公司的表现将在很大程度上取决于私募股权公司在选择、融资和管理它们时运用了多少技能。这些因素——加上公司的可出售性——将在很大程度上决定为收购提供融资的债务（包括私募贷款）的表现。</strong>盈利下降可能迫使公司通过实物支付（PIK）功能增加欠款，而不是按计划偿还债务。债务到期时的偿还，可能因为 (a) 组合公司难以变现、(b) 再融资困难、(c) 公司估值跌破其债务总额的面值这几种因素叠加而变得复杂。贷款人会「把罐子往下踢」（拖延问题）吗？如果会，对信贷基金投资者又意味着什么？</p>\n<p>贷款人最终的安全保障，来自他们所贷公司未来的表现，以及他们因在资本结构中处于优先地位而获得的安全边际。<strong>那些做了熟练的尽职调查、坚守高标准、做出良好信贷决策的贷款人将会成功（请注意，高收益债券和银团贷款——直接贷款的前身——在包括全球金融危机在内的多年期里都表现良好）。</strong>即使有些借款人需要去杠杆，只要公司表现尚可，就应该能够支付利息和本金。当然，如果商业模式失灵、或公司被赋予更低的估值，前景就不那么乐观了，因为那会削减贷款

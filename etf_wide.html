(function(){
  const c=document.getElementById('bg-rain'); if(!c) return;
  const ctx=c.getContext('2d');
  let cols,drops,fs,gap;
  function init(){
    c.width=innerWidth;c.height=innerHeight;
    const mobile=innerWidth<768; fs=mobile?24:18; gap=mobile?26:20;
    cols=Math.floor(c.width/gap); drops=Array(cols).fill(0).map(()=>Math.random()*-100);
  }
  const chars='0123456789ABCDEF';
  function draw(){
    ctx.fillStyle='rgba(6,11,19,.07)';ctx.fillRect(0,0,c.width,c.height);
    ctx.font=fs+'px "JetBrains Mono",monospace';
    for(let i=0;i<cols;i++){
      const ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle='rgba(62,198,224,.42)';
      ctx.fillText(ch,i*gap,drops[i]*fs);
      drops[i]+= (innerWidth<768?0.15:0.35);
      if(drops[i]*fs>c.height&&Math.random()>0.975) drops[i]=0;
    }
  }
  init(); setInterval(draw,60); addEventListener('resize',init);
})();
</script>

<style>
.etf-wrap{max-width:1420px;margin:0 auto;padding:28px 20px 60px}
.page-head{margin-bottom:22px}
.page-head .kicker{font:600 11px/1 "JetBrains Mono",Consolas,monospace;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.page-head h1{font-size:26px;margin:10px 0 6px;color:var(--text)}
.page-head p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:20px 22px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:12px;width:2px;height:22px;background:var(--accent);box-shadow:0 0 12px var(--accent)}
.card h2{font-size:15px;margin:0 0 4px;color:var(--text);font-weight:600}
.card .sub{color:var(--muted);font-size:12px;margin-bottom:16px}
.etf-table{width:100%;border-collapse:collapse;font:12.5px/1.5 "JetBrains Mono",Consolas,monospace;white-space:nowrap}
.etf-table thead th{color:var(--muted);font-weight:500;font-size:11.5px;padding:8px 8px;border-bottom:1px solid var(--border);text-align:right;background:#091019}
.etf-table thead th:first-child,.etf-table thead th:nth-child(2){text-align:left}
.etf-table td{padding:7px 8px;border-bottom:1px solid #121c28;text-align:right;color:var(--text)}
.etf-table td:first-child{text-align:left;color:var(--text)}
.etf-table td.code{text-align:left;color:var(--faint);font-size:11.5px}
.etf-table tr.g-hl td{background:rgba(230,210,74,.06)}
.etf-table tr.g-hl td:first-child{box-shadow:inset 3px 0 0 #e6d24a}
.etf-table tr.gr td{background:rgba(62,198,224,.05)}
.etf-table tr.gr td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.etf-table tr.subtotal td{color:var(--muted);font-size:11.5px;border-bottom:1px solid var(--border)}
.etf-table tr.subtotal td.v{color:var(--accent);font-weight:600}
.etf-table tr.total td{border-top:1px solid var(--border);color:var(--text);font-weight:600;padding-top:10px}
.etf-table tr.total td.v{color:#e6d24a}
.pos{color:var(--up)}.neg{color:var(--down)}
.chart{width:100%;height:420px}
.footnote{color:var(--faint);font-size:11.5px;line-height:1.8;margin-top:14px}
.footnote b{color:var(--muted);font-weight:500}
.sign{margin-top:30px;text-align:right;color:var(--faint);font-size:12px}
@media(max-width:768px){
  .etf-wrap{padding:18px 10px 40px}

  .etf-table{font-size:10.5px}
  .etf-table td,.etf-table thead th{padding:5px 4px}
  .chart{height:280px}

</style>
</head>

(function(){

  const tbody=document.querySelector('#tbl tbody');
  const sums={}; let total=0;
  groups.forEach(([g,label])=>{

(function(){
  const c=document.getElementById('bg-rain'); if(!c) return;
  const ctx=c.getContext('2d');
  let cols,drops,fs,gap;
  function init(){
    c.width=innerWidth;c.height=innerHeight;
    const mobile=innerWidth<768; fs=mobile?24:18; gap=mobile?26:20;
    cols=Math.floor(c.width/gap); drops=Array(cols).fill(0).map(()=>Math.random()*-100);
  }
  const chars='0123456789ABCDEF';
  function draw(){
    ctx.fillStyle='rgba(6,11,19,.07)';ctx.fillRect(0,0,c.width,c.height);
    ctx.font=fs+'px "JetBrains Mono",monospace';
    for(let i=0;i<cols;i++){
      const ch=chars[Math.floor(Math.random()*chars.length)];
      ctx.fillStyle='rgba(62,198,224,.42)';
      ctx.fillText(ch,i*gap,drops[i]*fs);
      drops[i]+= (innerWidth<768?0.15:0.35);
      if(drops[i]*fs>c.height&&Math.random()>0.975) drops[i]=0;
    }
  }
  init(); setInterval(draw,60); addEventListener('resize',init);
})();
